<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=landscape">
  <title>STRIKER LEGENDS · MOBILE FIGHTING</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #rotate-msg {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #rotate-msg.show {
      display: flex;
    }
    #rotate-msg .icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    #rotate-msg .text {
      font-size: 24px;
      font-weight: bold;
    }
    #rotate-msg .sub {
      font-size: 16px;
      color: #aaa;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="rotate-msg">
    <div class="icon">📱</div>
    <div class="text">Please Rotate Your Device</div>
    <div class="sub">Landscape Mode Only</div>
  </div>
  <canvas id="game"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const rotateMsg = document.getElementById('rotate-msg');

      // ==================== SCREEN MANAGEMENT ====================
      function resizeCanvas() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
      }

      function checkOrientation() {
        const isLandscape = window.innerWidth > window.innerHeight;
        if (isLandscape) {
          rotateMsg.classList.remove('show');
          resizeCanvas();
        } else {
          rotateMsg.classList.add('show');
        }
      }

      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 200));
      checkOrientation();
      resizeCanvas();

      // ==================== AUDIO SYSTEM ====================
      let audioCtx = null;
      
      function initAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {}
      }

      function playSound(freq, type, duration, vol) {
        if (!audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || 'square';
          osc.frequency.value = freq || 440;
          gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
      }

      function sfxSelect() { playSound(800, 'sine', 0.1, 0.15); }
      function sfxMove() { playSound(500, 'sine', 0.05, 0.08); }
      function sfxPunch() { playSound(120, 'square', 0.1, 0.15); }
      function sfxKick() { playSound(60, 'sawtooth', 0.12, 0.18); }
      function sfxSpecial() { playSound(350, 'sawtooth', 0.2, 0.25); }
      function sfxUltimate() { playSound(40, 'sawtooth', 0.4, 0.3); playSound(600, 'square', 0.2, 0.2); }
      function sfxHit() { playSound(180, 'triangle', 0.08, 0.1); }
      function sfxBlock() { playSound(250, 'triangle', 0.05, 0.08); }

      // ==================== GAME DATA ====================
      const FIGHTERS = [
        { id:0, name:'RYU', style:'Karate', color:'#e74c3c', hp:100, spd:6, atk:12, def:8 },
        { id:1, name:'NINJA', style:'Ninjutsu', color:'#2c3e50', hp:85, spd:9, atk:10, def:5 },
        { id:2, name:'BOXER', style:'Boxing', color:'#f39c12', hp:95, spd:7, atk:14, def:7 },
        { id:3, name:'TIGER', style:'Muay Thai', color:'#e67e22', hp:90, spd:8, atk:13, def:6 },
        { id:4, name:'GRAPPLE', style:'Wrestling', color:'#9b59b6', hp:110, spd:5, atk:15, def:10 },
        { id:5, name:'SAMURAI', style:'Kenjutsu', color:'#7d3c98', hp:100, spd:6, atk:12, def:9 },
        { id:6, name:'REAPER', style:'Assassin', color:'#1a1a1a', hp:80, spd:10, atk:11, def:4 },
        { id:7, name:'MONK', style:'Kung Fu', color:'#f1c40f', hp:90, spd:8, atk:10, def:8 },
        { id:8, name:'CYBORG', style:'Tech', color:'#3498db', hp:105, spd:5, atk:14, def:9 },
        { id:9, name:'BEAST', style:'Wild', color:'#27ae60', hp:95, spd:7, atk:13, def:7 },
        { id:10, name:'MAGE', style:'Magic', color:'#8e44ad', hp:80, spd:7, atk:16, def:5 },
        { id:11, name:'DRAGON', style:'Dragon', color:'#c0392b', hp:100, spd:6, atk:15, def:8 }
      ];

      const STAGES = [
        { name:'City', sky:'#1a1a2e', ground:'#2c3e50' },
        { name:'Temple', sky:'#3e2723', ground:'#4e342e' },
        { name:'Forest', sky:'#1b5e20', ground:'#2e7d32' },
        { name:'Dojo', sky:'#bf360c', ground:'#d84315' },
        { name:'Volcano', sky:'#b71c1c', ground:'#c62828' },
        { name:'Snow', sky:'#90a4ae', ground:'#b0bec5' },
        { name:'Castle', sky:'#37474f', ground:'#455a64' },
        { name:'Desert', sky:'#f9a825', ground:'#f57f17' },
        { name:'Arena', sky:'#4a148c', ground:'#6a1b9a' },
        { name:'Neon', sky:'#1a237e', ground:'#283593' }
      ];

      // ==================== GAME STATE ====================
      const STATE = { MENU:0, SELECT:1, FIGHT:2 };
      let gameState = STATE.MENU;
      let menuOption = 0;
      let selP1 = 0;
      let selP2 = 1;
      let currentStage = STAGES[0];
      let frame = 0;
      let shakeTimer = 0;
      let slowmoTimer = 0;
      let particles = [];

      // ==================== FIGHTER CLASS ====================
      class Fighter {
        constructor(data, x, dir) {
          this.data = data;
          this.x = x;
          this.y = 0;
          this.groundY = 0;
          this.w = 60;
          this.h = 90;
          this.hp = data.hp;
          this.maxHp = data.hp;
          this.energy = 0;
          this.ultra = 0;
          this.dir = dir;
          this.vx = 0;
          this.vy = 0;
          this.grounded = true;
          this.blocking = false;
          this.atkCD = 0;
          this.stun = 0;
          this.specialCD = 0;
          this.state = 'idle';
        }
        
        update() {
          if (this.stun > 0) this.stun--;
          if (this.atkCD > 0) this.atkCD--;
          if (this.specialCD > 0) this.specialCD--;
          
          this.x += this.vx;
          
          if (!this.grounded) {
            this.vy += 0.9;
            this.y += this.vy;
            if (this.y >= this.groundY) {
              this.y = this.groundY;
              this.vy = 0;
              this.grounded = true;
            }
          }
          
          if (this.x < 20) this.x = 20;
          if (this.x > canvas.width - 80) this.x = canvas.width - 80;
          
          if (this.atkCD <= 0 && this.stun <= 0) this.state = 'idle';
        }
        
        hit(dmg, kb) {
          if (this.blocking) {
            dmg *= 0.2;
            sfxBlock();
          } else {
            sfxHit();
          }
          dmg = dmg * (1 - this.data.def / 120);
          this.hp = Math.max(0, this.hp - dmg);
          this.energy = Math.min(100, this.energy + dmg * 0.5);
          this.ultra = Math.min(100, this.ultra + dmg * 0.8);
          this.stun = 14;
          if (kb && !this.blocking) {
            this.vx = kb * 7;
            this.vy = -4;
            this.grounded = false;
          }
        }
        
        draw(ctx) {
          ctx.save();
          const sx = shakeTimer > 0 ? (Math.random() - 0.5) * 8 : 0;
          const sy = shakeTimer > 0 ? (Math.random() - 0.5) * 6 : 0;
          ctx.translate(this.x + sx, this.y + sy);
          
          if (this.dir < 0) {
            ctx.translate(this.w, 0);
            ctx.scale(-1, 1);
          }
          
          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fillRect(5, this.h - 3, this.w - 10, 6);
          
          // Body
          ctx.fillStyle = this.data.color;
          ctx.fillRect(8, 12, this.w - 16, this.h - 24);
          
          // Head
          ctx.fillStyle = '#ffdbac';
          ctx.fillRect(12, -12, this.w - 24, 28);
          
          // Eyes
          ctx.fillStyle = this.state === 'ultimate' ? '#ff0' : '#000';
          ctx.fillRect(18, -4, 6, 6);
          ctx.fillRect(30, -4, 6, 6);
          
          // Arms
          if (this.state === 'punch') {
            ctx.fillStyle = this.data.color;
            ctx.fillRect(-20, 20, 28, 10);
          } else if (this.state === 'kick') {
            ctx.fillStyle = this.data.color;
            ctx.fillRect(this.w - 8, 55, 28, 10);
          } else {
            ctx.fillStyle = this.data.color;
            ctx.fillRect(-10, 18, 16, 10);
            ctx.fillRect(this.w - 6, 18, 16, 10);
          }
          
          // Effects
          if (this.blocking) {
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 3;
            ctx.strokeRect(-3, -15, this.w + 6, this.h + 6);
          }
          if (this.state === 'special') {
            ctx.shadowColor = '#ff0';
            ctx.shadowBlur = 15;
          }
          if (this.state === 'ultimate') {
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 25;
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 4;
            ctx.strokeRect(-5, -17, this.w + 10, this.h + 10);
          }
          ctx.shadowBlur = 0;
          ctx.restore();
        }
      }

      // ==================== PLAYERS ====================
      let p1 = null;
      let p2 = null;

      function createPlayers() {
        const f1 = FIGHTERS[selP1];
        const f2 = FIGHTERS[selP2];
        p1 = new Fighter(f1, canvas.width * 0.2, 1);
        p2 = new Fighter(f2, canvas.width * 0.7, -1);
        p1.groundY = canvas.height - 100;
        p2.groundY = canvas.height - 100;
        p1.y = p1.groundY;
        p2.y = p2.groundY;
        particles = [];
        shakeTimer = 0;
        slowmoTimer = 0;
      }

      // ==================== TOUCH BUTTONS ====================
      let buttons = [];

      function createButtons() {
        const w = canvas.width;
        const h = canvas.height;
        const bs = Math.min(65, h * 0.12);
        const ss = Math.min(45, h * 0.08);
        const gap = 10;
        
        buttons = [
          { id:'left',   x:gap, y:h-bs-gap, w:bs, h:bs, label:'◀', color:'#333' },
          { id:'right',  x:gap*2+bs, y:h-bs-gap, w:bs, h:bs, label:'▶', color:'#333' },
          { id:'block',  x:gap*2+bs, y:h-bs-ss-gap*2, w:bs, h:ss, label:'🛡', color:'#2980b9' },
          { id:'punch',  x:w-bs*2-gap*2, y:h-bs-gap, w:bs, h:bs, label:'👊', color:'#c0392b' },
          { id:'kick',   x:w-bs-gap, y:h-bs-gap, w:bs, h:bs, label:'🦵', color:'#d35400' },
          { id:'special',x:w-bs*2-gap*2, y:h-bs-ss-gap*2, w:bs, h:ss, label:'⚡', color:'#8e44ad' },
          { id:'ultra',  x:w-bs-gap, y:h-bs-ss-gap*2, w:bs, h:ss, label:'💥', color:'#f39c12' }
        ];
      }

      function getButton(x, y) {
        return buttons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
      }

      function doAction(id) {
        if (!p1 || p1.stun > 0) return;
        switch(id) {
          case 'left': p1.vx = -4; p1.dir = -1; break;
          case 'right': p1.vx = 4; p1.dir = 1; break;
          case 'block': p1.blocking = true; p1.vx = 0; break;
          case 'punch':
            if (p1.atkCD <= 0) {
              p1.atkCD = 10; p1.state = 'punch';
              sfxPunch();
              attack(p1, p2, 8);
            }
            break;
          case 'kick':
            if (p1.atkCD <= 0) {
              p1.atkCD = 14; p1.state = 'kick';
              sfxKick();
              attack(p1, p2, 13);
            }
            break;
          case 'special':
            if (p1.specialCD <= 0 && p1.energy >= 25) {
              p1.energy -= 25; p1.specialCD = 40; p1.state = 'special';
              sfxSpecial();
              attack(p1, p2, 20);
              spawnParticles(p2.x + 30, p2.y + 40, 20, '#ff0');
              shakeTimer = 10;
            }
            break;
          case 'ultra':
            if (p1.ultra >= 90) {
              p1.ultra = 0; p1.state = 'ultimate';
              sfxUltimate();
              attack(p1, p2, 40);
              spawnParticles(p2.x + 30, p2.y + 40, 35, '#f00');
              shakeTimer = 20;
              slowmoTimer = 15;
            }
            break;
        }
      }

      function attack(atk, def, dmg) {
        const dist = Math.abs(atk.x - def.x);
        if (dist < 110) {
          const dir = atk.dir;
          def.hit(dmg * (atk.data.atk / 10), dir);
          spawnParticles(def.x + 30, def.y + 30, dmg, '#fff');
        }
      }

      function spawnParticles(x, y, n, color) {
        for (let i = 0; i < n; i++) {
          particles.push({
            x, y, color,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 3,
            life: 20 + Math.random() * 15,
            size: 2 + Math.random() * 5
          });
        }
      }

      // ==================== AI ====================
      function aiThink() {
        if (!p2 || p2.stun > 0) return;
        if (frame % 15 !== 0) return;
        
        const dx = p1.x - p2.x;
        const dist = Math.abs(dx);
        p2.dir = dx > 0 ? 1 : -1;
        p2.vx = 0;
        p2.blocking = false;
        
        if (dist < 70) {
          if (Math.random() < 0.3) p2.blocking = true;
          if (p2.atkCD <= 0 && Math.random() < 0.4) aiAttack(Math.random() < 0.5 ? 'punch' : 'kick');
        } else if (dist < 200) {
          p2.vx = (dx > 0 ? 1 : -1) * 3;
          if (p2.atkCD <= 0 && Math.random() < 0.3) aiAttack('punch');
          if (p2.specialCD <= 0 && p2.energy >= 25 && Math.random() < 0.15) aiAttack('special');
        } else {
          p2.vx = (dx > 0 ? 1 : -1) * 4;
        }
        
        if (p2.ultra >= 85 && Math.random() < 0.08) aiAttack('ultra');
      }

      function aiAttack(type) {
        if (!p2 || p2.stun > 0) return;
        const dist = Math.abs(p1.x - p2.x);
        if (dist > 120 && type !== 'ultra') return;
        
        switch(type) {
          case 'punch':
            if (p2.atkCD <= 0) { p2.atkCD = 10; p2.state = 'punch'; attack(p2, p1, 7); }
            break;
          case 'kick':
            if (p2.atkCD <= 0) { p2.atkCD = 14; p2.state = 'kick'; attack(p2, p1, 11); }
            break;
          case 'special':
            if (p2.specialCD <= 0 && p2.energy >= 25) {
              p2.energy -= 25; p2.specialCD = 40; p2.state = 'special';
              attack(p2, p1, 18);
              spawnParticles(p1.x + 30, p1.y + 40, 20, '#ff0');
            }
            break;
          case 'ultra':
            if (p2.ultra >= 85) {
              p2.ultra = 0; p2.state = 'ultimate';
              attack(p2, p1, 38);
              spawnParticles(p1.x + 30, p1.y + 40, 35, '#f00');
              shakeTimer = 20;
              slowmoTimer = 15;
            }
            break;
        }
      }

      // ==================== DRAWING ====================
      function drawStage() {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, currentStage.sky);
        grad.addColorStop(1, currentStage.ground);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = currentStage.ground;
        ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 80);
        ctx.lineTo(canvas.width, canvas.height - 80);
        ctx.stroke();
      }

      function drawUI() {
        if (!p1 || !p2) return;
        const bw = 280;
        const bh = 20;
        const y = 15;
        
        // P1
        ctx.fillStyle = '#333';
        ctx.fillRect(15, y, bw, bh);
        ctx.fillStyle = p1.hp / p1.maxHp > 0.5 ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(15, y, bw * (p1.hp / p1.maxHp), bh);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(15, y, bw, bh);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.fillText(p1.data.name, 15, y - 5);
        ctx.fillText('EP:' + Math.floor(p1.energy), 15, y + bh + 15);
        ctx.fillText('ULT:' + Math.floor(p1.ultra), 15, y + bh + 32);
        
        // P2
        const px = canvas.width - bw - 15;
        ctx.fillStyle = '#333';
        ctx.fillRect(px, y, bw, bh);
        ctx.fillStyle = p2.hp / p2.maxHp > 0.5 ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(px + bw * (1 - p2.hp / p2.maxHp), y, bw * (p2.hp / p2.maxHp), bh);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(px, y, bw, bh);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'right';
        ctx.fillText(p2.data.name, canvas.width - 15, y - 5);
        ctx.fillText('EP:' + Math.floor(p2.energy), canvas.width - 15, y + bh + 15);
        ctx.fillText('ULT:' + Math.floor(p2.ultra), canvas.width - 15, y + bh + 32);
        ctx.textAlign = 'left';
        
        // Timer
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('VS', canvas.width / 2, y + 25);
        ctx.textAlign = 'left';
      }

      function drawButtons() {
        buttons.forEach(b => {
          ctx.fillStyle = b.color;
          ctx.globalAlpha = 0.5;
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.strokeRect(b.x, b.y, b.w, b.h);
          ctx.fillStyle = '#fff';
          ctx.font = Math.floor(b.w * 0.35) + 'px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
        });
      }

      function drawMenu() {
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Animated bg
        for (let i = 0; i < 15; i++) {
          const x = (frame * 0.5 + i * 120) % (canvas.width + 200) - 100;
          const y = canvas.height * 0.5 + Math.sin(frame * 0.02 + i) * 80;
          ctx.fillStyle = 'rgba(233,69,96,' + (0.05 + Math.sin(frame * 0.03 + i) * 0.05) + ')';
          ctx.fillRect(x, y, 60, 60);
        }
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('STRIKER LEGENDS', canvas.width / 2, canvas.height * 0.25);
        
        const items = ['⚔️  FIGHT', '👥  SELECT FIGHTERS'];
        items.forEach((item, i) => {
          const y = canvas.height * 0.45 + i * 80;
          if (menuOption === i) {
            ctx.fillStyle = 'rgba(233,69,96,0.3)';
            ctx.fillRect(canvas.width / 2 - 160, y - 25, 320, 50);
          }
          ctx.fillStyle = menuOption === i ? '#e94560' : '#ccc';
          ctx.font = '28px Arial';
          ctx.fillText(item, canvas.width / 2, y);
        });
        
        ctx.fillStyle = '#888';
        ctx.font = '16px Arial';
        ctx.fillText('Tap to select', canvas.width / 2, canvas.height - 40);
        ctx.textAlign = 'left';
      }

      function drawSelect() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SELECT FIGHTERS', canvas.width / 2, 40);
        
        const cols = 6;
        const cw = Math.min(110, (canvas.width - 80) / cols);
        const ch = cw * 1.2;
        const sx = (canvas.width - (cw * cols + 8 * (cols - 1))) / 2;
        const sy = 80;
        
        FIGHTERS.forEach((f, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = sx + col * (cw + 8);
          const y = sy + row * (ch + 8);
          
          ctx.fillStyle = '#1a1a2e';
          ctx.fillRect(x, y, cw, ch);
          ctx.fillStyle = f.color;
          ctx.fillRect(x + 4, y + 4, cw - 8, ch - 30);
          ctx.fillStyle = '#fff';
          ctx.font = (cw * 0.12) + 'px Arial';
          ctx.fillText(f.name, x + cw / 2, y + ch - 18);
          ctx.font = (cw * 0.1) + 'px Arial';
          ctx.fillText(f.style, x + cw / 2, y + ch - 5);
          
          if (i === selP1) {
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 3;
            ctx.strokeRect(x - 2, y - 2, cw + 4, ch + 4);
            ctx.fillText('YOU', x + cw / 2, y - 8);
          }
          if (i === selP2) {
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 3;
            ctx.strokeRect(x - 2, y - 2, cw + 4, ch + 4);
            ctx.fillText('CPU', x + cw / 2, y - 8);
          }
        });
        
        ctx.fillStyle = '#aaa';
        ctx.font = '14px Arial';
        ctx.fillText('Tap fighter to select | Tap top to confirm', canvas.width / 2, canvas.height - 20);
        ctx.textAlign = 'left';
      }

      // ==================== MAIN LOOP ====================
      function update() {
        if (gameState === STATE.FIGHT) {
          if (slowmoTimer > 0) {
            slowmoTimer--;
            if (frame % 2 !== 0) return;
          }
          if (shakeTimer > 0) shakeTimer--;
          
          if (p1) p1.update();
          if (p2) p2.update();
          aiThink();
          
          particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.life--;
            return p.life > 0;
          });
          
          // Win check
          if (p1 && p1.hp <= 0) {
            gameState = STATE.MENU;
            p1 = null; p2 = null;
          }
          if (p2 && p2.hp <= 0) {
            gameState = STATE.MENU;
            p1 = null; p2 = null;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (gameState === STATE.MENU) {
          drawMenu();
        } else if (gameState === STATE.SELECT) {
          drawSelect();
        } else if (gameState === STATE.FIGHT) {
          drawStage();
          if (p2) p2.draw(ctx);
          if (p1) p1.draw(ctx);
          particles.forEach(p => {
            ctx.globalAlpha = p.life / 30;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.globalAlpha = 1;
          drawUI();
          drawButtons();
        }
      }

      function loop() {
        frame++;
        update();
        draw();
        requestAnimationFrame(loop);
      }

      // ==================== INPUT HANDLERS ====================
      function handleTap(x, y) {
        initAudio();
        
        if (gameState === STATE.MENU) {
          if (menuOption === 0) {
            // Fight
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers();
            createButtons();
            gameState = STATE.FIGHT;
          } else if (menuOption === 1) {
            gameState = STATE.SELECT;
          }
          sfxSelect();
        } else if (gameState === STATE.SELECT) {
          // Check if tapped on a fighter
          const cols = 6;
          const cw = Math.min(110, (canvas.width - 80) / cols);
          const ch = cw * 1.2;
          const sx = (canvas.width - (cw * cols + 8 * (cols - 1))) / 2;
          const sy = 80;
          
          let tappedFighter = false;
          FIGHTERS.forEach((f, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const fx = sx + col * (cw + 8);
            const fy = sy + row * (ch + 8);
            if (x >= fx && x <= fx + cw && y >= fy && y <= fy + ch) {
              if (x < canvas.width / 2) selP1 = i;
              else selP2 = i;
              tappedFighter = true;
              sfxSelect();
            }
          });
          
          if (!tappedFighter && y < sy) {
            // Confirm selection and start fight
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers();
            createButtons();
            gameState = STATE.FIGHT;
            sfxSelect();
          }
        }
      }

      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const x = touch.clientX;
        const y = touch.clientY;
        
        if (gameState === STATE.FIGHT) {
          const btn = getButton(x, y);
          if (btn) doAction(btn.id);
        } else {
          handleTap(x, y);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (gameState === STATE.FIGHT) {
          const touch = e.touches[0];
          const btn = getButton(touch.clientX, touch.clientY);
          if (btn && (btn.id === 'left' || btn.id === 'right' || btn.id === 'block')) {
            doAction(btn.id);
          }
        }
      }, { passive: false });

      canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        if (gameState === STATE.FIGHT && p1) {
          p1.vx = 0;
          p1.blocking = false;
        }
      });

      canvas.addEventListener('click', function(e) {
        if (gameState !== STATE.FIGHT) {
          handleTap(e.clientX, e.clientY);
        }
      });

      // Keyboard support for testing
      window.addEventListener('keydown', function(e) {
        initAudio();
        if (gameState === STATE.MENU) {
          if (e.key === 'ArrowDown') { menuOption = 1; sfxMove(); }
          if (e.key === 'ArrowUp') { menuOption = 0; sfxMove(); }
          if (e.key === 'Enter') handleTap(canvas.width/2, canvas.height/2);
        } else if (gameState === STATE.SELECT) {
          if (e.key === 'ArrowLeft') { selP1 = (selP1 - 1 + 12) % 12; sfxMove(); }
          if (e.key === 'ArrowRight') { selP1 = (selP1 + 1) % 12; sfxMove(); }
          if (e.key === 'ArrowUp') { selP2 = (selP2 - 1 + 12) % 12; sfxMove(); }
          if (e.key === 'ArrowDown') { selP2 = (selP2 + 1) % 12; sfxMove(); }
          if (e.key === 'Enter') {
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers();
            createButtons();
            gameState = STATE.FIGHT;
          }
        } else if (gameState === STATE.FIGHT) {
          if (e.key === 'a') doAction('left');
          if (e.key === 'd') doAction('right');
          if (e.key === 's') doAction('block');
          if (e.key === 'j') doAction('punch');
          if (e.key === 'k') doAction('kick');
          if (e.key === 'u') doAction('special');
          if (e.key === 'i') doAction('ultra');
        }
      });

      window.addEventListener('keyup', function(e) {
        if (gameState === STATE.FIGHT && p1) {
          if (e.key === 'a' || e.key === 'd') p1.vx = 0;
          if (e.key === 's') p1.blocking = false;
        }
      });

      // ==================== START ====================
      checkOrientation();
      loop();
    })();
  </script>
</body>
</html>
