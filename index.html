<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
  <title>ARCADE COMBAT · COMPLETE SYSTEM</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    }
    body {
      background: #0a0a14; width: 100vw; height: 100vh; overflow: hidden;
      position: fixed; top: 0; left: 0; touch-action: manipulation; font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  (function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', () => {
      resizeCanvas();
      if (gameState === STATE.FIGHT) createButtons();
    });
    resizeCanvas();

    // ==================== AUDIO SYSTEM ====================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    function sfx(freq, type, duration, vol = 0.08) {
      if (!audioCtx) return;
      try {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + duration);
      } catch(e) {}
    }

    // ==================== FIGHTER DATA ====================
    const FIGHTERS = [
      { id:0, name:'FLAME KNIGHT', color:'#e74c3c', secColor:'#ff6b35', hp:110, atk:14, def:7,
        critChance: 0.15, critDmg: 1.8, dodge: 0.08,
        moves: {
          lp:{dmg:7, range:60, speed:10, kb:2, height:'mid'},
          hp:{dmg:11, range:70, speed:16, kb:5, height:'high'},
          lk:{dmg:6, range:65, speed:12, kb:3, height:'low'},
          hk:{dmg:13, range:75, speed:18, kb:7, height:'mid'},
          sp:{dmg:9, cost:20, effect:'fire', height:'mid'},
          ult:{dmg:48, cost:90, effect:'fire', height:'mid'}
        }},
      { id:1, name:'THUNDER MONK', color:'#f39c12', secColor:'#3498db', hp:95, atk:13, def:8,
        critChance: 0.18, critDmg: 1.9, dodge: 0.12,
        moves: {
          lp:{dmg:5, range:55, speed:8, kb:2, height:'mid'},
          hp:{dmg:9, range:65, speed:14, kb:4, height:'high'},
          lk:{dmg:5, range:60, speed:10, kb:3, height:'low'},
          hk:{dmg:11, range:70, speed:16, kb:6, height:'mid'},
          sp:{dmg:8, cost:20, effect:'stun', height:'mid'},
          ult:{dmg:42, cost:90, effect:'stun', height:'mid'}
        }},
      { id:2, name:'BEAST WARRIOR', color:'#27ae60', secColor:'#f1c40f', hp:125, atk:16, def:10,
        critChance: 0.12, critDmg: 2.0, dodge: 0.05,
        moves: {
          lp:{dmg:8, range:65, speed:12, kb:3, height:'mid'},
          hp:{dmg:12, range:75, speed:18, kb:6, height:'high'},
          lk:{dmg:7, range:70, speed:14, kb:4, height:'low'},
          hk:{dmg:15, range:80, speed:20, kb:8, height:'mid'},
          sp:{dmg:10, cost:20, effect:'bleed', height:'mid'},
          ult:{dmg:52, cost:90, effect:'bleed', height:'mid'}
        }}
    ];

    const STAGES = [
      { name:'Neon City', sky:'#1a1a2e', ground:'#2c3e50' },
      { name:'Sunset Temple', sky:'#3e2723', ground:'#4e342e' },
      { name:'Ancient Forest', sky:'#1b5e20', ground:'#2e7d32' }
    ];

    // ==================== GAME STATE ====================
    const STATE = { MENU:0, SELECT:1, FIGHT:2 };
    let gameState = STATE.MENU;
    let menuOption = 0;
    let selP1 = 0, selP2 = 1;
    let currentStage = STAGES[0];
    let difficulty = 'Normal';
    let frame = 0, shakeTimer = 0, shakeIntensity = 0;
    let particles = [], floatingTexts = [];
    let winner = null, winTimer = 0;
    let comboCount = 0, comboTimer = 0;
    let paused = false;
    let pauseMenuOption = 0;
    let lastTapTime = 0;

    // ==================== PARTICLE & TEXT EFFECTS ====================
    function spawnParticles(x, y, count, color, spread = 6, life = 20) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y, color,
          vx: (Math.random() - 0.5) * spread * 2,
          vy: (Math.random() - 0.8) * spread - 2,
          life: life + Math.random() * 10,
          maxLife: life + 10,
          size: 3 + Math.random() * 7
        });
      }
    }

    function spawnFloatingText(x, y, text, color = '#fff', size = 22) {
      floatingTexts.push({
        x, y, text, color,
        life: 40,
        maxLife: 40,
        vy: -3.5,
        size
      });
    }

    // ==================== FIGHTER CLASS ====================
    class Fighter {
      constructor(data, x, dir) {
        this.data = data;
        this.x = x; this.y = 0; this.groundY = 0;
        this.w = 70; this.h = 100;
        this.hp = data.hp; this.maxHp = data.hp;
        this.meter = 0;
        this.dir = dir;
        this.vx = 0; this.vy = 0;
        this.grounded = true;
        this.blocking = false;
        this.crouching = false;
        this.atkCD = 0; this.stun = 0;
        this.state = 'idle';
        this.animTimer = 0;
        this.invincible = false;
        this.attackPhase = 0;
        this.attackPhaseTimer = 0;
        this.attackLunge = 0;
        this.burning = 0; this.bleeding = 0; this.frozen = 0;
        this.aiCooldown = 0;
        this.projectile = null;
        this.dodgeAnim = 0;
      }

      update() {
        if (paused) return;
        this.animTimer++;
        if (this.dodgeAnim > 0) this.dodgeAnim--;
        if (this.burning > 0) { this.burning--; if (this.animTimer % 10 === 0) this.hp = Math.max(0, this.hp - 1); }
        if (this.bleeding > 0) { this.bleeding--; if (this.animTimer % 8 === 0) this.hp = Math.max(0, this.hp - 2); }
        if (this.stun > 0) this.stun--;
        if (this.atkCD > 0) this.atkCD--;
        if (this.aiCooldown > 0) this.aiCooldown--;

        if (this.attackPhaseTimer > 0) {
          this.attackPhaseTimer--;
          if (this.attackPhase === 1) this.attackLunge = -6;
          else if (this.attackPhase === 2) this.attackLunge = 18;
          else if (this.attackPhase === 3) this.attackLunge *= 0.65;
          if (this.attackPhaseTimer <= 0 && this.attackPhase < 3) this.advancePhase();
          if (this.attackPhaseTimer <= 0 && this.attackPhase === 3) this.resetAttack();
        } else {
          this.attackLunge *= 0.8;
        }

        this.x += this.vx;
        if (!this.grounded) { this.vy += 0.85; this.y += this.vy; if (this.y >= this.groundY) { this.y = this.groundY; this.vy = 0; this.grounded = true; this.invincible = false; } }
        if (this.x < 20) this.x = 20;
        if (this.x > canvas.width - 90) this.x = canvas.width - 90;
        if (this.atkCD <= 0 && this.stun <= 0 && this.attackPhase === 0) this.state = 'idle';

        if (this.projectile) {
          this.projectile.x += this.projectile.vx;
          if (this.projectile.x < -50 || this.projectile.x > canvas.width + 50) this.projectile = null;
        }
      }

      advancePhase() {
        if (this.attackPhase === 1) { this.attackPhase = 2; this.attackPhaseTimer = 7; }
        else if (this.attackPhase === 2) { this.attackPhase = 3; this.attackPhaseTimer = 6; }
      }
      resetAttack() {
        this.attackPhase = 0; this.attackPhaseTimer = 0; this.attackLunge = 0;
        if (this.atkCD <= 0 && this.stun <= 0) this.state = 'idle';
      }

      jump() { if (this.grounded) { this.vy = -12.5; this.grounded = false; this.state = 'jump'; sfx(420, 'sine', 0.13, 0.09); } }
      crouch() { if (this.grounded) { this.crouching = true; this.state = 'crouch'; this.vx = 0; } }
      stand() { this.crouching = false; if (this.state === 'crouch') this.state = 'idle'; }

      // ==================== DAMAGE SYSTEM (HIT) ====================
      hit(rawDmg, kb, effect, attackerHeight, attacker) {
        if (this.invincible || this.dodgeAnim > 0) return false;

        // DODGE SYSTEM
        if (!this.blocking && !this.crouching && Math.random() < this.data.dodge) {
          this.dodgeAnim = 12;
          spawnFloatingText(this.x + 35, this.y - 10, 'MISS', '#aaaaaa', 20);
          sfx(500, 'sine', 0.1, 0.04);
          return false;
        }

        let finalDmg = rawDmg;
        let isCrit = false;
        let isBlocked = this.blocking;

        // Height check
        if (this.crouching && (attackerHeight === 'high' || attackerHeight === 'mid')) {
          if (attackerHeight === 'high') {
            spawnFloatingText(this.x + 35, this.y, 'MISS', '#aaaaaa', 18);
            return false;
          }
          finalDmg *= 0.65;
        }
        if (!this.grounded && attackerHeight === 'low') {
          spawnFloatingText(this.x + 35, this.y + 40, 'MISS', '#aaaaaa', 18);
          return false;
        }

        // BLOCK SYSTEM
        if (isBlocked) {
          finalDmg *= 0.25;
          spawnParticles(this.x + 35, this.y + 45, 10, '#3498db', 5, 18);
          spawnFloatingText(this.x + 35, this.y, 'BLOCK', '#3498db', 20);
          sfx(200, 'triangle', 0.1, 0.05);
        }

        // CRITICAL HIT SYSTEM
        if (!isBlocked && attacker && Math.random() < attacker.data.critChance) {
          finalDmg = Math.floor(finalDmg * attacker.data.critDmg);
          isCrit = true;
        }

        if (finalDmg > 0) {
          this.hp = Math.max(0, this.hp - finalDmg);
          this.meter = Math.min(100, this.meter + finalDmg * 0.7);
          this.stun = (kb > 6) ? 18 : 10;
          if (effect && !isBlocked) {
            if (effect === 'fire') this.burning = 55;
            if (effect === 'stun') this.stun = 28;
            if (effect === 'bleed') this.bleeding = 45;
          }
          if (kb && !isBlocked) {
            this.vx = kb * 5;
            if (kb > 7) { this.vy = -6; this.grounded = false; }
          }

          // FLOATING TEXT & EFFECTS
          if (isCrit) {
            spawnFloatingText(this.x + 35, this.y - 5, finalDmg + ' CRITICAL', '#ffd700', 26);
            spawnParticles(this.x + 35, this.y + 40, 15, '#ffd700', 10, 22);
            sfx(80, 'sawtooth', 0.2, 0.12);
            if (attacker) shakeTimer = 8;
          } else {
            spawnFloatingText(this.x + 35, this.y, Math.floor(finalDmg), '#ffffff', 22);
            spawnParticles(this.x + 35, this.y + 40, 9, '#ffaa00', 6, 16);
            sfx(160, 'triangle', 0.11, 0.07);
          }
          return true;
        }
        return false;
      }

      draw(ctx) {
        ctx.save();
        let sx = shakeTimer > 0 ? (Math.random() - 0.5) * 9 : 0;
        let sy = shakeTimer > 0 ? (Math.random() - 0.5) * 7 : 0;
        let scaleY = this.crouching ? 0.75 : 1;
        let offsetY = this.crouching ? 18 : 0;
        let lunge = this.attackLunge * this.dir;
        let dodgeOffset = this.dodgeAnim > 0 ? (Math.sin(this.dodgeAnim * 0.9) * 5) : 0;

        ctx.translate(this.x + sx + lunge + this.w / 2 + dodgeOffset, this.y + sy + offsetY + this.h / 2);
        if (this.dir < 0) ctx.scale(-1, 1);
        ctx.scale(1, scaleY);
        ctx.translate(-this.w / 2, -this.h / 2);

        if (this.invincible && Math.floor(this.animTimer / 2) % 2 === 0) ctx.globalAlpha = 0.4;
        if (this.dodgeAnim > 0) ctx.globalAlpha = 0.6;

        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(this.w / 2, this.h + 4, 26, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        this.drawCharacter(ctx);
        ctx.restore();
      }

      drawCharacter(ctx) {
        let w = this.w, h = this.h, isAtk = this.attackPhase === 2;
        if (this.data.id === 0) {
          ctx.fillStyle = '#444'; ctx.fillRect(12, h - 32, 18, 32); ctx.fillRect(w - 30, h - 32, 18, 32);
          ctx.fillStyle = '#c0392b'; ctx.fillRect(14, 18, w - 28, h - 50);
          ctx.fillStyle = '#bdc3c7'; ctx.fillRect(isAtk ? w - 6 : w - 12, 22, isAtk ? 28 : 18, 6);
          if (isAtk) { ctx.fillStyle = '#ff6b35'; ctx.fillRect(w + 12, 8, 20, 12); }
          ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(w / 2, 12, 16, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ff6b35'; ctx.beginPath(); ctx.arc(w / 2 - 5, 10, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(w / 2 + 5, 10, 3.5, 0, Math.PI * 2); ctx.fill();
        } else if (this.data.id === 1) {
          ctx.fillStyle = '#d35400'; ctx.fillRect(22, h - 30, 14, 30); ctx.fillRect(w - 36, h - 30, 14, 30);
          ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.moveTo(14, 22); ctx.lineTo(w - 14, 22); ctx.lineTo(w - 8, h - 30); ctx.lineTo(8, h - 30); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#f5cba7'; ctx.beginPath(); ctx.arc(w / 2, 12, 15, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(w / 2 - 5, 10, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(w / 2 + 5, 10, 3.2, 0, Math.PI * 2); ctx.fill();
          if (isAtk) { ctx.fillStyle = '#3498db'; ctx.fillRect(w + 7, 18, 14, 20); }
        } else {
          ctx.fillStyle = '#1e8449'; ctx.fillRect(16, h - 32, 18, 32); ctx.fillRect(w - 34, h - 32, 18, 32);
          ctx.fillStyle = '#27ae60'; ctx.fillRect(12, 20, w - 24, h - 48);
          ctx.fillStyle = '#2ecc71'; ctx.fillRect(w - 14, 20, 18, 16); ctx.fillRect(8, 20, 18, 16);
          if (isAtk) { ctx.fillStyle = '#f1c40f'; for (let i = 0; i < 4; i++) ctx.fillRect(w + 8 + i * 5, 16, 3, 16); }
          ctx.fillStyle = '#145a32'; ctx.beginPath(); ctx.arc(w / 2, 10, 17, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(w / 2 - 6, 8, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(w / 2 + 6, 8, 4, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    let p1 = null, p2 = null;
    function createPlayers() {
      p1 = new Fighter(FIGHTERS[selP1], canvas.width * 0.2, 1);
      p2 = new Fighter(FIGHTERS[selP2], canvas.width * 0.7, -1);
      p1.groundY = p2.groundY = canvas.height - 135;
      p1.y = p1.groundY; p2.y = p2.groundY;
      particles = []; floatingTexts = []; shakeTimer = 0; winner = null; winTimer = 0; comboCount = 0; paused = false; pauseMenuOption = 0;
    }

    let buttons = [];
    function createButtons() {
      let w = canvas.width, h = canvas.height;
      let bs = Math.min(78, h * 0.16);
      let gap = 12;
      let bottomY = h - bs * 3 - gap * 3;
      buttons = [
        { id: 'left', x: gap, y: bottomY + bs + gap, w: bs, h: bs, label: '◀', color: 'rgba(255,255,255,0.18)' },
        { id: 'right', x: gap * 2 + bs, y: bottomY + bs + gap, w: bs, h: bs, label: '▶', color: 'rgba(255,255,255,0.18)' },
        { id: 'jump', x: gap, y: bottomY, w: bs, h: bs, label: '⬆', color: 'rgba(46,204,113,0.25)' },
        { id: 'crouch', x: gap * 2 + bs, y: bottomY, w: bs, h: bs, label: '⬇', color: 'rgba(46,204,113,0.25)' },
        { id: 'block', x: gap, y: h - bs * 0.8 - gap, w: bs * 2 + gap, h: bs * 0.8, label: '🛡 BLOCK', color: 'rgba(41,128,185,0.25)' },
        { id: 'lp', x: w - bs * 2 - gap * 2, y: bottomY + bs + gap, w: bs, h: bs, label: 'LP', color: 'rgba(231,76,60,0.25)' },
        { id: 'hp', x: w - bs - gap, y: bottomY + bs + gap, w: bs, h: bs, label: 'HP', color: 'rgba(192,57,43,0.25)' },
        { id: 'lk', x: w - bs * 2 - gap * 2, y: bottomY, w: bs, h: bs, label: 'LK', color: 'rgba(230,126,34,0.25)' },
        { id: 'hk', x: w - bs - gap, y: bottomY, w: bs, h: bs, label: 'HK', color: 'rgba(211,84,0,0.25)' },
        { id: 'sp', x: w - bs * 2 - gap * 2, y: bottomY - bs - gap, w: bs, h: bs, label: '⚡SP', color: 'rgba(155,89,182,0.3)' },
        { id: 'ult', x: w - bs - gap, y: bottomY - bs - gap, w: bs, h: bs, label: '💥ULT', color: 'rgba(243,156,18,0.3)' },
      ];
    }

    function getButton(x, y) { return buttons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); }

    function performAttack(attacker, defender, moveKey) {
      if (!attacker || attacker.stun > 0 || attacker.attackPhase !== 0 || attacker.atkCD > 0 || paused) return;
      let move = attacker.data.moves[moveKey];
      if (!move) return;
      if (move.cost && attacker.meter < move.cost) return;

      attacker.atkCD = move.speed;
      attacker.state = 'attack';
      attacker.attackPhase = 1;
      attacker.attackPhaseTimer = 7;
      if (move.cost) attacker.meter -= move.cost;

      let dist = Math.abs(attacker.x - defender.x);
      if (dist < move.range + 35) {
        defender.hit(move.dmg, move.kb || 3, move.effect, move.height, attacker);
        comboCount++; comboTimer = 50;
        if (comboCount >= 5) { shakeTimer = 10; shakeIntensity = 12; }
      }

      if (moveKey === 'sp' && !attacker.projectile) {
        attacker.projectile = { x: attacker.x + 35, y: attacker.y + 45, vx: attacker.dir * 7.5, dmg: move.dmg, effect: move.effect, height: move.height };
      }
      sfx(move.cost ? 320 : 140, 'square', 0.14, 0.11);
      if (moveKey === 'ult') { sfx(45, 'sawtooth', 0.6, 0.25); shakeTimer = 22; shakeIntensity = 16; }
    }

    function doAction(id) {
      if (!p1 || p1.stun > 0 || winner || paused) return;
      switch (id) {
        case 'left': p1.vx = -5.5; p1.dir = -1; p1.state = 'walk'; break;
        case 'right': p1.vx = 5.5; p1.dir = 1; p1.state = 'walk'; break;
        case 'jump': p1.jump(); break;
        case 'crouch': p1.crouch(); break;
        case 'block': p1.blocking = true; p1.vx = 0; break;
        case 'lp': performAttack(p1, p2, 'lp'); break;
        case 'hp': performAttack(p1, p2, 'hp'); break;
        case 'lk': performAttack(p1, p2, 'lk'); break;
        case 'hk': performAttack(p1, p2, 'hk'); break;
        case 'sp': performAttack(p1, p2, 'sp'); break;
        case 'ult': if (p1.meter >= p1.data.moves.ult.cost) performAttack(p1, p2, 'ult'); break;
      }
    }

    function aiThink() {
      if (!p2 || p2.stun > 0 || winner || paused) return;
      if (p2.aiCooldown > 0) return;
      let dx = p1.x - p2.x, dist = Math.abs(dx);
      p2.dir = dx > 0 ? 1 : -1; p2.vx = 0; p2.blocking = false;
      let actionDelay = difficulty === 'Easy' ? 55 : difficulty === 'Hard' ? 18 : 30;
      if (frame % actionDelay !== 0) return;
      let r = Math.random();
      if (p1.attackPhase === 2 && dist < 160 && r < 0.55) { p2.blocking = true; p2.aiCooldown = 22; return; }
      if (dist < 100) {
        if (r < 0.3) performAttack(p2, p1, 'lp');
        else if (r < 0.5) performAttack(p2, p1, 'lk');
        else if (r < 0.65) performAttack(p2, p1, 'hp');
        else if (r < 0.78 && p2.meter >= 20) performAttack(p2, p1, 'sp');
        else if (r < 0.9) p2.blocking = true;
        else p2.vx = p2.dir * 3.5;
      } else if (dist < 220) {
        if (r < 0.4) p2.vx = p2.dir * 5;
        else if (r < 0.6) performAttack(p2, p1, 'hp');
        else if (r < 0.75 && p2.meter >= 90) performAttack(p2, p1, 'ult');
        else if (r < 0.9) p2.jump();
        else p2.blocking = true;
      } else {
        p2.vx = p2.dir * 5.5;
        if (r < 0.4) p2.jump();
        if (r < 0.6 && p2.meter >= 20) performAttack(p2, p1, 'sp');
      }
      p2.aiCooldown = difficulty === 'Easy' ? 50 : difficulty === 'Hard' ? 12 : 22;
    }

    function drawStage() {
      let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, currentStage.sky);
      grad.addColorStop(0.85, currentStage.ground);
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = currentStage.ground; ctx.fillRect(0, canvas.height - 105, canvas.width, 105);
      ctx.strokeStyle = '#ffffff33'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, canvas.height - 105); ctx.lineTo(canvas.width, canvas.height - 105); ctx.stroke();
    }

    function drawUI() {
      if (!p1 || !p2) return;
      let bw = Math.min(290, canvas.width * 0.32), bh = 22, y = 12;
      // P1
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(6, y - 3, bw + 6, bh + 6);
      let hp1w = bw * (p1.hp / p1.maxHp);
      ctx.fillStyle = p1.hp / p1.maxHp > 0.5 ? '#2ecc71' : '#e74c3c';
      ctx.fillRect(9, y, hp1w, bh);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(9, y, bw, bh);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px "Segoe UI"'; ctx.fillText(p1.data.name, 9, y - 6);
      ctx.font = '11px "Segoe UI"'; ctx.fillText('METER: ' + Math.floor(p1.meter), 9, y + bh + 16);
      // P2
      let px = canvas.width - bw - 9;
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(px - 3, y - 3, bw + 6, bh + 6);
      let hp2w = bw * (p2.hp / p2.maxHp);
      ctx.fillStyle = p2.hp / p2.maxHp > 0.5 ? '#2ecc71' : '#e74c3c';
      ctx.fillRect(px + bw - hp2w, y, hp2w, bh);
      ctx.strokeRect(px, y, bw, bh);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px "Segoe UI"'; ctx.textAlign = 'right'; ctx.fillText(p2.data.name, canvas.width - 9, y - 6);
      ctx.textAlign = 'right'; ctx.font = '11px "Segoe UI"'; ctx.fillText('METER: ' + Math.floor(p2.meter), canvas.width - 9, y + bh + 16);
      ctx.textAlign = 'left';
      if (comboCount > 1 && comboTimer > 0) {
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 26px "Segoe UI"'; ctx.textAlign = 'center';
        ctx.fillText(comboCount + ' HIT!', canvas.width / 2, y + 45);
        ctx.textAlign = 'left';
      }
    }

    function drawButtons() {
      buttons.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.floor(b.h * 0.4)}px "Segoe UI"`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
      });
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '11px "Segoe UI"'; ctx.textAlign = 'center';
      ctx.fillText('DOUBLE TAP TOP AREA TO PAUSE', canvas.width / 2, canvas.height - 8);
      ctx.textAlign = 'left';
    }

    function drawPauseMenu() {
      ctx.fillStyle = 'rgba(0,0,0,0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 44px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText('⏸ PAUSED', canvas.width / 2, canvas.height * 0.28);
      let items = ['▶ RESUME', '🏠 QUIT TO MENU'];
      items.forEach((item, i) => {
        let iy = canvas.height * 0.48 + i * 80;
        if (pauseMenuOption === i) {
          ctx.fillStyle = 'rgba(233,69,96,0.6)';
          ctx.fillRect(canvas.width / 2 - 140, iy - 32, 280, 64);
          ctx.strokeStyle = '#e94560'; ctx.lineWidth = 4;
          ctx.strokeRect(canvas.width / 2 - 140, iy - 32, 280, 64);
        }
        ctx.fillStyle = pauseMenuOption === i ? '#e94560' : '#dddddd';
        ctx.font = 'bold 32px "Segoe UI"';
        ctx.fillText(item, canvas.width / 2, iy + 10);
      });
      ctx.textAlign = 'left';
    }

    function drawMenu() {
      ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 42px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText('ARCADE COMBAT', canvas.width / 2, canvas.height * 0.22);
      let items = ['⚔️ FIGHT', '👥 SELECT FIGHTERS', '⚙️ DIFFICULTY: ' + difficulty];
      items.forEach((item, i) => {
        let iy = canvas.height * 0.42 + i * 75;
        ctx.fillStyle = menuOption === i ? '#e94560' : '#cccccc';
        ctx.font = 'bold 28px "Segoe UI"';
        ctx.fillText(item, canvas.width / 2, iy);
      });
      ctx.textAlign = 'left';
    }

    function drawSelect() {
      ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 24px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText('SELECT FIGHTERS', canvas.width / 2, 35);
      let cols = 3, cw = Math.min(140, (canvas.width - 60) / cols), ch = cw * 1.35, gap = 16;
      let totalW = cw * cols + gap * (cols - 1), sx = (canvas.width - totalW) / 2, sy = 65;
      FIGHTERS.forEach((f, i) => {
        let x = sx + i * (cw + gap);
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(x, sy, cw, ch);
        ctx.fillStyle = f.color; ctx.fillRect(x + 4, sy + 4, cw - 8, ch - 36);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "Segoe UI"'; ctx.fillText(f.name, x + cw / 2, sy + ch - 14);
        if (i === selP1) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 5; ctx.strokeRect(x - 4, sy - 4, cw + 8, ch + 8); }
        if (i === selP2) { ctx.strokeStyle = '#3498db'; ctx.lineWidth = 5; ctx.strokeRect(x - 4, sy - 4, cw + 8, ch + 8); }
      });
      ctx.fillStyle = '#e94560'; ctx.fillRect(canvas.width / 2 - 70, sy + ch + 30, 140, 48);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px "Segoe UI"'; ctx.fillText('READY!', canvas.width / 2, sy + ch + 58);
    }

    function update() {
      if (gameState === STATE.FIGHT && !winner && !paused) {
        if (shakeTimer > 0) shakeTimer--;
        if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) comboCount = 0; }
        p1?.update(); p2?.update(); aiThink();
        [p1, p2].forEach(f => {
          if (f && f.projectile) {
            let proj = f.projectile;
            let enemy = f === p1 ? p2 : p1;
            if (enemy && Math.abs(proj.x - enemy.x - 35) < 48 && Math.abs(proj.y - enemy.y - 50) < 58) {
              enemy.hit(proj.dmg, 3, proj.effect, proj.height, f);
              f.projectile = null;
            }
          }
        });
        particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; return p.life > 0; });
        floatingTexts = floatingTexts.filter(t => { t.life--; t.y += t.vy; return t.life > 0; });
        if (p1 && p1.hp <= 0) { winner = 'CPU WINS!'; winTimer = 180; }
        if (p2 && p2.hp <= 0) { winner = 'YOU WIN!'; winTimer = 180; }
      }
      if (winner && winTimer > 0) { winTimer--; if (winTimer <= 0) { gameState = STATE.MENU; p1 = null; p2 = null; winner = null; } }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (gameState === STATE.MENU) drawMenu();
      else if (gameState === STATE.SELECT) drawSelect();
      else if (gameState === STATE.FIGHT) {
        drawStage();
        if (p2) p2.draw(ctx);
        if (p1) p1.draw(ctx);
        [p1, p2].forEach(f => {
          if (f && f.projectile) {
            let p = f.projectile;
            ctx.fillStyle = '#ffdd57'; ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
          }
        });
        particles.forEach(p => {
          ctx.globalAlpha = p.life / p.maxLife;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
          ctx.fill();
        });
        floatingTexts.forEach(t => {
          ctx.fillStyle = t.color;
          ctx.globalAlpha = t.life / t.maxLife;
          ctx.font = `bold ${t.size}px "Segoe UI"`;
          ctx.textAlign = 'center';
          ctx.fillText(t.text, t.x, t.y);
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        drawUI();
        drawButtons();
        if (winner) {
          ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = winner === 'YOU WIN!' ? '#2ecc71' : '#e74c3c';
          ctx.font = 'bold 48px "Segoe UI"'; ctx.textAlign = 'center';
          ctx.fillText(winner, canvas.width / 2, canvas.height / 2);
        }
        if (paused) drawPauseMenu();
      }
    }

    function loop() {
      frame++;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function handleTap(x, y) {
      initAudio();
      if (gameState === STATE.FIGHT && paused) {
        let iy1 = canvas.height * 0.48, iy2 = canvas.height * 0.48 + 80;
        if (y >= iy1 - 32 && y <= iy1 + 32) paused = false;
        else if (y >= iy2 - 32 && y <= iy2 + 32) { paused = false; gameState = STATE.MENU; p1 = null; p2 = null; winner = null; }
        return;
      }
      if (gameState === STATE.MENU) {
        let iy1 = canvas.height * 0.42, iy2 = canvas.height * 0.42 + 75, iy3 = canvas.height * 0.42 + 150;
        if (y >= iy1 - 28 && y <= iy1 + 28) { menuOption = 0; currentStage = STAGES[Math.floor(Math.random() * STAGES.length)]; createPlayers(); createButtons(); gameState = STATE.FIGHT; }
        else if (y >= iy2 - 28 && y <= iy2 + 28) { menuOption = 1; gameState = STATE.SELECT; }
        else if (y >= iy3 - 28 && y <= iy3 + 28) { difficulty = difficulty === 'Easy' ? 'Normal' : difficulty === 'Normal' ? 'Hard' : 'Easy'; }
      } else if (gameState === STATE.SELECT) {
        let cols = 3, cw = Math.min(140, (canvas.width - 60) / cols), ch = cw * 1.35, gap = 16;
        let totalW = cw * cols + gap * (cols - 1), sx = (canvas.width - totalW) / 2, sy = 65;
        if (x >= canvas.width / 2 - 70 && x <= canvas.width / 2 + 70 && y >= sy + ch + 30 && y <= sy + ch + 78) {
          currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
          createPlayers(); createButtons(); gameState = STATE.FIGHT; return;
        }
        FIGHTERS.forEach((f, i) => {
          let fx = sx + i * (cw + gap);
          if (x >= fx && x <= fx + cw && y >= sy && y <= sy + ch) {
            if (x < canvas.width / 2) selP1 = i; else selP2 = i;
          }
        });
      }
    }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      let t = e.touches[0];
      if (gameState === STATE.FIGHT && !winner) {
        if (paused) { handleTap(t.clientX, t.clientY); return; }
        if (t.clientY < canvas.height * 0.25) {
          let now = Date.now();
          if (now - lastTapTime < 350) { paused = true; pauseMenuOption = 0; lastTapTime = 0; return; }
          lastTapTime = now; return;
        }
        lastTapTime = 0;
        let btn = getButton(t.clientX, t.clientY);
        if (btn) doAction(btn.id);
      } else handleTap(t.clientX, t.clientY);
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (gameState === STATE.FIGHT && !winner && !paused) {
        let t = e.touches[0];
        let btn = getButton(t.clientX, t.clientY);
        if (btn && ['left', 'right', 'block'].includes(btn.id)) doAction(btn.id);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      if (gameState === STATE.FIGHT && p1 && !paused) { p1.vx = 0; p1.blocking = false; p1.stand(); }
    });

    canvas.addEventListener('click', e => {
      if (gameState !== STATE.FIGHT || paused) handleTap(e.clientX, e.clientY);
    });

    resizeCanvas();
    createButtons();
    loop();
  })();
</script>
</body>
</html>
