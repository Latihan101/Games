// ===== AUDIO =====
var audioCtx = null;
function initAudio(){ if(!audioCtx) try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function sfx(freq,type,dur,vol,fe){
  if(!audioCtx) return;
  try{
    var t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(fe) o.frequency.exponentialRampToValueAtTime(fe,t+dur);
    g.gain.setValueAtTime(vol||0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function sfxHit(big){ if(big){sfx(55,'sawtooth',0.22,0.18,25);sfx(180,'square',0.1,0.08);}else{sfx(110,'triangle',0.13,0.08,70);} }
function sfxBlock(){ sfx(200,'square',0.08,0.06); }
function sfxCrit(){ sfx(45,'sawtooth',0.28,0.22,18); sfx(700,'square',0.1,0.09,150); }
function sfxKO(){ sfx(55,'sawtooth',0.55,0.22,18); }
function sfxCombo(n){ sfx(180+n*28,'sine',0.09,0.07); }
function sfxMove(){ sfx(260,'square',0.07,0.05,180); }
function sfxJump(){ sfx(340,'sine',0.12,0.06); }

// ===== DATA =====
var FIGHTERS = [

          hp:{dmg:11,range:74,su:9,ac:4,re:11,kb:4,h:'high'},

];

var STAGES = [
  {name:'Neon Arena',  bg0:'#0a0020',bg1:'#180040',fl:'#0a0015',line:'#aa00ff',acc:'#ff00ff'},
  {name:'Fire Temple', bg0:'#200000',bg1:'#440e00',fl:'#150000',line:'#ff4400',acc:'#ffaa00'},
  {name:'Storm Peak',  bg0:'#000f1a',bg1:'#001e35',fl:'#000810',line:'#0088ff',acc:'#00ddff'}
];

// ===== EFFECTS =====
function spawnParticles(x,y,n,col,sp,life){
  for(var i=0;i<n;i++){
    var a=Math.random()*PI*2, s=(sp||6)*Math.random();
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,col:col,life:life||22,ml:life||22,sz:3+Math.random()*5});
  }
}
function spawnSparks(x,y,col,n){
  for(var i=0;i<(n||10);i++){
    var a=Math.random()*PI*2, s=4+Math.random()*9;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,col:col,life:18,ml:22,sz:2+Math.random()*3,spark:1});
  }
}
function spawnFloat(x,y,txt,col,sz){
  floats.push({x:x,y:y,txt:txt,col:col||'#fff',sz:sz||22,life:55,ml:55,vy:-3.2});
}
function doShake(n){ shakeAmt=n; }
function doFlash(col,n){ flashAmt=n||6; flashColor=col||'#fff'; }

function updateFX(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.vx*=0.9; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
  for(var j=floats.length-1;j>=0;j--){
    var f=floats[j];
    f.y+=f.vy; f.vy*=0.93; f.life--;
    if(f.life<=0) floats.splice(j,1);
  }
  if(shakeAmt>0.5) shakeAmt*=0.82; else shakeAmt=0;
  if(flashAmt>0) flashAmt--;
}

function drawFX(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i], a=p.life/p.ml;
    ctx.save(); ctx.globalAlpha=a;
    if(p.spark){
      ctx.strokeStyle=p.col; ctx.lineWidth=p.sz*0.5;
      ctx.beginPath(); ctx.moveTo(p.x-p.vx*2,p.y-p.vy*2); ctx.lineTo(p.x,p.y); ctx.stroke();
    } else {
      ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(a*0.6+0.4),0,PI*2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.save(); ctx.textAlign='center';
  for(var j=0;j<floats.length;j++){
    var f=floats[j], fa=Math.min(1,f.life/f.ml*1.5);
    ctx.globalAlpha=fa;
    ctx.font='bold '+f.sz+'px "Segoe UI",Arial';
    ctx.fillStyle=f.col; ctx.shadowColor=f.col; ctx.shadowBlur=12;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.restore();
}

// ===== FIGHTER CLASS =====
function Fighter(data, side){
  this.d = data;
  this.side = side;
  this.W = 62; this.H = 92;
  this.init();
}
Fighter.prototype.init = function(){
  var gY = H*GROUND_RATIO;
  this.x = this.side===1 ? W*0.2 : W*0.7;
  this.y = gY - this.H;
  this.gY = gY - this.H;
  this.vx = 0; this.vy = 0;
  this.grounded = true;
  this.dir = this.side;
  this.hp = this.d.hp; this.maxHp = this.d.hp;
  this.meter = 0;
  // state: idle walk jump crouch block attack hurt ko
  this.st = 'idle';
  this.stT = 0;
  this.atkMv = null; this.atkPhase = ''; this.atkTimer = 0; this.atkHit = false;
  this.stun = 0;
  this.burning = 0; this.bleeding = 0;
  this.invincible = 0; this.dodging = 0;
  this.blocking = false; this.crouching = false;
  this.hurtFlash = 0; this.hurtDir = 0;
  this.proj = null;
  this.aiT = 0;
  // anim
  this.animT = Math.random()*PI*2;
  this.limbL = {arm:0.2,leg:0.1,fist:0,kick:0,bend:0.35};
  this.limbR = {arm:-0.2,leg:-0.1,fist:0,kick:0,bend:0.35};
  this.bodyY = 0; this.bodyTilt = 0; this.headBob = 0;
  this.scaleX = 1; this.scaleY = 1;
};

Fighter.prototype.update = function(enemy){
  if(this.hp<=0 && this.st!=='ko') return;
  this.stT++; this.animT+=0.065;
  if(this.hurtFlash>0) this.hurtFlash--;
  if(this.invincible>0) this.invincible--;
  if(this.dodging>0) this.dodging--;
  if(this.stun>0) this.stun--;
  if(this.burning>0){ this.burning--; if(this.stT%8===0){ this.hp=Math.max(0,this.hp-1); spawnParticles(this.x+31,this.y+20,2,'#ff4400',3,16); if(this.hp<=0) this.die(); } }
  if(this.bleeding>0){ this.bleeding--; if(this.stT%6===0){ this.hp=Math.max(0,this.hp-2); spawnParticles(this.x+31,this.y+35,2,'#cc0000',2,16); if(this.hp<=0) this.die(); } }

  // face enemy
  if(enemy && (this.st==='idle'||this.st==='walk'||this.st==='crouch')){
    this.dir = enemy.x > this.x ? 1 : -1;
  }

  // attack FSM
  if(this.st==='attack' && this.atkMv){
    this.atkTimer--;
    if(this.atkPhase==='su'){
      if(this.atkTimer<=0){ this.atkPhase='ac'; this.atkTimer=this.atkMv.ac; this.atkHit=false; }
    } else if(this.atkPhase==='ac'){
      if(!this.atkHit && enemy){
        var cx = this.x + (this.dir===1?this.W:0);
        var ex = enemy.x + enemy.W/2;
        var dist = Math.abs(this.x+this.W/2 + this.dir*this.W*0.4 - ex);
        if(dist < this.atkMv.range){
          if(enemy.receiveHit(this.atkMv, this)) this.atkHit=true;
        }
      }
      if(this.atkTimer<=0){ this.atkPhase='re'; this.atkTimer=this.atkMv.re; }
    } else if(this.atkPhase==='re'){
      if(this.atkTimer<=0){ this.st='idle'; this.atkMv=null; this.stT=0; }
    }
  }

  // hurt recovery
  if(this.st==='hurt' && this.stT>14){ this.st='idle'; this.stT=0; }

  // physics
  if(!this.grounded){ this.vy+=0.88; this.y+=this.vy; if(this.y>=this.gY){ this.y=this.gY; this.vy=0; this.grounded=true; if(this.st==='jump') this.st='idle'; } }
  this.x += this.vx; this.vx*=0.76;
  if(this.x<8) this.x=8;
  if(this.x>W-8-this.W) this.x=W-8-this.W;

  // projectile
  if(this.proj){
    this.proj.x += this.proj.vx;
    this.proj.life--;
    if(this.stT%3===0) spawnParticles(this.proj.x,this.proj.y+14,2,this.d.col,2,12);
    if(this.proj.life<=0||this.proj.x<-60||this.proj.x>W+60) this.proj=null;
    if(this.proj && enemy){
      var px=this.proj.x, py=this.proj.y;
      if(px>enemy.x&&px<enemy.x+enemy.W&&py>enemy.y&&py<enemy.y+enemy.H){
        var pmv={dmg:Math.floor(this.proj.dmg),range:0,su:0,ac:0,re:0,kb:3,h:'mid',fx:this.proj.fx};
        enemy.receiveHit(pmv, this);
        spawnSparks(px,py,this.d.col,12);
        this.proj=null;
      }
    }
  }

  this.animRig();
};

Fighter.prototype.die = function(){
  this.st='ko'; this.vy=-5; this.grounded=false;
  sfxKO(); doFlash('#ff0000',9); doShake(18);
};

Fighter.prototype.receiveHit = function(mv, atk){
  if(this.invincible>0||this.st==='ko') return false;
  if(this.dodging>0){
    spawnFloat(this.x+31,this.y-12,'DODGE','#aaffcc',19);
    sfx(600,'sine',0.07,0.04); return false;
  }
  // height check
  if(this.crouching && mv.h==='high'){ spawnFloat(this.x+31,this.y-5,'WHIFF','#888',17); return false; }
  if(!this.grounded && mv.h==='low'){ spawnFloat(this.x+31,this.y+40,'WHIFF','#888',17); return false; }
  // dodge chance
  if(!this.blocking && this.grounded && Math.random()<this.d.dodge){
    this.dodging=13;
    spawnFloat(this.x+31,this.y-14,'MISS!','#aaddff',19);
    sfx(520,'sine',0.08,0.04); return false;
  }

  var dmg = mv.dmg|0;
  var isCrit=false, isBlock=false;

  if(this.blocking && this.grounded){
    isBlock=true; dmg=Math.max(1,Math.ceil(dmg*0.15));
    spawnSparks(this.x,this.y+this.H*0.4,'#44aaff',8);
    spawnFloat(this.x+31,this.y-5,'BLOCK','#44aaff',20);
    sfxBlock(); this.vx = -atk.dir*2; this.meter=Math.min(100,this.meter+5);
    this.hp=Math.max(0,this.hp-dmg);
    if(this.hp<=0) this.die();
    return true;
  }

  if(Math.random()<atk.d.crit){ isCrit=true; dmg=Math.floor(dmg*atk.d.critM); }

  this.hp=Math.max(0,this.hp-dmg);
  this.meter=Math.min(100,this.meter+dmg*0.55);
  atk.meter=Math.min(100,atk.meter+dmg*0.4);

  var kb=mv.kb||3;
  this.vx = -atk.dir*kb*5;
  if(kb>=8&&this.grounded){ this.vy=-7; this.grounded=false; }

  if(mv.fx&&!isBlock){
    if(mv.fx==='fire') this.burning=65;
    if(mv.fx==='stun') this.stun=32;
    if(mv.fx==='bleed') this.bleeding=55;
  }

  this.hurtFlash = isCrit?18:10;
  this.hurtDir = atk.dir;
  this.st='hurt'; this.stT=0;

  var fx=this.x+this.W*0.5, fy=this.y+this.H*0.3;
  if(isCrit){
    spawnSparks(fx,fy,'#ffd700',18);
    spawnParticles(fx,fy,12,'#ffd700',9,30);
    spawnFloat(fx,fy-14,''+dmg+' CRIT!','#ffd700',30);
    doShake(14); doFlash('#ffdd00',6); sfxCrit();
  } else if(kb>=6){
    spawnSparks(fx,fy,atk.d.col,10);
    spawnParticles(fx,fy,7,atk.d.col,7,22);
    spawnFloat(fx,fy-8,''+dmg,'#ff8844',26);
    doShake(8); doFlash('#ff5500',3); sfxHit(true);
  } else {
    spawnSparks(fx,fy,'#ffffff',5);
    spawnParticles(fx,fy,4,atk.d.col,4,17);
    spawnFloat(fx,fy-5,''+dmg,'#ffffff',22);
    sfxHit(false);
  }

  if(this.hp<=0) this.die();
  return true;
};

Fighter.prototype.animRig = function(){
  var t=this.animT, L=this.limbL, R=this.limbR;
  this.scaleX=1; this.scaleY=1;
  if(this.st==='idle'){
    this.bodyY=Math.sin(t*0.65)*2.2; this.headBob=Math.sin(t*0.65)*1.5; this.bodyTilt=Math.sin(t*0.65)*0.018;
    L.arm=0.18+Math.sin(t*0.65)*0.07; R.arm=-0.18-Math.sin(t*0.65)*0.07;
    L.leg=0.07; R.leg=-0.07; L.bend=0.32; R.bend=0.32;
    L.fist=0; R.fist=0; L.kick=0; R.kick=0;
  } else if(this.st==='walk'){
    this.bodyY=Math.abs(Math.sin(t*1.9))*3-1; this.bodyTilt=Math.sin(t*1.9)*0.035;
    L.arm=Math.sin(t*1.9)*0.5; R.arm=-Math.sin(t*1.9)*0.5;
    L.leg=Math.sin(t*1.9)*0.55; R.leg=-Math.sin(t*1.9)*0.55;
    L.bend=0.28; R.bend=0.28; L.fist=0; R.fist=0; L.kick=0; R.kick=0;
  } else if(this.st==='jump'){
    this.bodyY=-4; this.bodyTilt=-0.04;
    L.arm=-0.75; R.arm=-0.75; L.leg=0.5; R.leg=0.5; L.bend=0.55; R.bend=0.55;
  } else if(this.st==='crouch'){
    this.bodyY=18; this.bodyTilt=0.1;
    L.leg=0.72; R.leg=0.72; L.arm=0.4; R.arm=-0.4; L.bend=0.52; R.bend=0.52;
  } else if(this.st==='block'){
    this.bodyY=5; this.bodyTilt=0.14;
    L.arm=-0.28; R.arm=-0.48; L.bend=0.95; R.bend=0.88; L.fist=0.45; R.fist=0.38;
  } else if(this.st==='attack' && this.atkMv){
    var mv=this.atkMv;
    var tot=(mv.su+mv.ac+mv.re);
    var elapsed=tot-this.atkTimer - (this.atkPhase==='ac'?mv.su:this.atkPhase==='re'?mv.su+mv.ac:0);
    var prog = this.atkPhase==='ac' ? 1 : this.atkPhase==='re' ? Math.max(0,this.atkTimer/mv.re) : Math.min(1,1-this.atkTimer/mv.su);
    var isKick=(mv.h==='low'||(this.d.id===2&&Math.random()<0.5));
    var mkLow = mv===this.d.moves.lk;
    var mkHi = mv===this.d.moves.hk;
    if(mv===this.d.moves.lk||mv===this.d.moves.hk){
      var ang = mkLow ? 0.5 : -0.9;
      R.leg = -1.0*prog + (-0.1)*(1-prog); R.kick=prog; this.bodyY=-5*prog; this.bodyTilt=-0.12*prog;
      L.leg=0.15; L.arm=0.3; R.arm=-0.5; R.bend=0.4;
    } else if(mv===this.d.moves.lp||mv===this.d.moves.sp){
      L.arm=-0.35-prog*0.25; L.bend=Math.max(0,0.55-prog*0.85); L.fist=prog;
      R.arm=0.55; R.bend=0.65; this.bodyTilt=prog*0.11; this.bodyY=-2.5*prog;
    } else {
      R.arm=-0.35-prog*0.25; R.bend=Math.max(0,0.55-prog*0.85); R.fist=prog;
      L.arm=0.55; L.bend=0.65; this.bodyTilt=-prog*0.11; this.bodyY=-2.5*prog;
    }
    if(this.atkPhase==='ac'&&this.atkHit){ this.scaleX=1.07; this.scaleY=0.94; }
  } else if(this.st==='hurt'){
    var p=this.stT/14;
    this.bodyTilt=-this.hurtDir*0.32*(1-p); this.bodyY=-4*(1-p);
    L.arm=-0.6; R.arm=0.6; this.headBob=5*(1-p);
  } else if(this.st==='ko'){
    this.bodyY=22; this.bodyTilt=this.hurtDir*0.65; this.scaleY=0.62;
    L.arm=-1.1; R.arm=1.1; L.leg=0.9; R.leg=0.4;
  }
};

Fighter.prototype.draw = function(){
  var id=this.d.id, sx=this.x+this.W/2, sy=this.y+this.H;
  if(shakeAmt>0){ sx+=(Math.random()-0.5)*shakeAmt*2; sy+=(Math.random()-0.5)*shakeAmt*1.2; }

  ctx.save();
  ctx.translate(sx, sy+this.bodyY);
  if(this.dir<0) ctx.scale(-1,1);
  ctx.scale(this.scaleX, this.scaleY);

  if(this.hurtFlash>0 && Math.floor(this.hurtFlash/2)%2===0) ctx.globalAlpha=0.45;
  if(this.dodging>0) ctx.globalAlpha=0.5;
  if(this.invincible>0 && Math.floor(this.stT/3)%2===0) ctx.globalAlpha=0.5;

  if(this.burning>0){ ctx.shadowColor='#ff4400'; ctx.shadowBlur=14+Math.sin(this.animT*3)*5; }
  else if(this.bleeding>0){ ctx.shadowColor='#cc0000'; ctx.shadowBlur=10; }
  else if(this.stun>0){ ctx.shadowColor='#ffff00'; ctx.shadowBlur=16; }

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0,4,26,7,0,0,PI*2); ctx.fill();

  this.drawBody(ctx, id);
  ctx.restore();

  if(this.proj){
    var pg=this.proj, pulse=0.85+Math.sin(this.stT*0.28)*0.15;
    ctx.save();
    ctx.shadowColor=this.d.col; ctx.shadowBlur=20;
    var rg=ctx.createRadialGradient(pg.x,pg.y+14,2,pg.x,pg.y+14,15*pulse);
    rg.addColorStop(0,'#fff'); rg.addColorStop(0.4,this.d.col); rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg; ctx.globalAlpha=0.92;
    ctx.beginPath(); ctx.arc(pg.x,pg.y+14,13*pulse,0,PI*2); ctx.fill();
    ctx.restore();
  }
};

Fighter.prototype.drawBody = function(ctx, id){
  var L=this.limbL, R=this.limbR;
  var col=this.d.col, sec=this.d.sec, trim=this.d.trim;
  var legH=32, armLen=28, headR=16, torsoH=40;

  // === LEGS ===
  // Left leg
  ctx.save(); ctx.rotate(L.leg);
  ctx.fillStyle=sec; ctx.fillRect(-13,-legH,12,legH);
  ctx.fillStyle=trim; ctx.fillRect(-13,-legH*0.45,12,4);
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(-15,0,15,7);
  if(L.kick>0.2){ ctx.save(); ctx.rotate(-L.kick*1.1); ctx.fillStyle=trim; ctx.globalAlpha=0.8; ctx.fillRect(-5,-legH*0.45,22,5); ctx.restore(); }
  ctx.restore();
  // Right leg
  ctx.save(); ctx.rotate(R.leg);
  ctx.fillStyle=sec; ctx.fillRect(1,-legH,12,legH);
  ctx.fillStyle=trim; ctx.fillRect(1,-legH*0.45,12,4);
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,0,16,7);
  if(R.kick>0.2){ ctx.save(); ctx.rotate(-R.kick*1.1); ctx.fillStyle=trim; ctx.globalAlpha=0.8; ctx.fillRect(-4,-legH*0.45,24,5); ctx.restore(); }
  ctx.restore();

  // === TORSO ===
  ctx.save(); ctx.translate(0,-legH); ctx.rotate(this.bodyTilt);

  ctx.fillStyle=col;
  ctx.fillRect(-28,-torsoH,56,torsoH);
  ctx.fillStyle=sec;
  ctx.fillRect(-20,-torsoH+5,40,9);
  ctx.fillStyle=trim;
  ctx.fillRect(-30,-9,60,5);

  if(id===0){ // Blaze armor
    ctx.fillStyle='#a93226'; ctx.fillRect(-30,-torsoH+2,7,torsoH-7); ctx.fillRect(23,-torsoH+2,7,torsoH-7);
    ctx.fillStyle=trim;
    ctx.beginPath(); ctx.moveTo(0,-torsoH*0.55); ctx.lineTo(-5,-torsoH*0.3); ctx.lineTo(0,-torsoH*0.4); ctx.lineTo(5,-torsoH*0.3); ctx.closePath(); ctx.fill();
  } else if(id===1){ // Storm robe
    ctx.fillStyle='#6c3483'; ctx.fillRect(-30,-torsoH+3,60,7); ctx.fillRect(-30,-torsoH/2,60,5);
    ctx.fillStyle=trim;
    ctx.beginPath(); ctx.moveTo(3,-torsoH*0.7); ctx.lineTo(-2,-torsoH*0.48); ctx.lineTo(2,-torsoH*0.48); ctx.lineTo(-4,-torsoH*0.22); ctx.lineTo(4,-torsoH*0.55); ctx.closePath(); ctx.fill();
  } else { // Fang hide
    ctx.fillStyle='#1a6b38'; ctx.fillRect(-30,-torsoH+3,9,torsoH-7); ctx.fillRect(21,-torsoH+3,9,torsoH-7);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    for(var ci=0;ci<3;ci++) ctx.fillRect(-5+ci*4,-torsoH*0.7,2,torsoH*0.33);
  }

  // === LEFT ARM ===
  ctx.save(); ctx.translate(-30,-torsoH*0.72); ctx.rotate(L.arm);
  ctx.fillStyle=sec; ctx.fillRect(-6,0,11,armLen*(1-L.bend*0.18));
  ctx.fillStyle=trim; ctx.fillRect(-6,armLen*0.44,11,4);
  ctx.save(); ctx.translate(0,armLen*(0.88-L.bend*0.14));
  if(L.fist>0) ctx.translate(L.fist*16,-L.fist*4);
  ctx.fillStyle=col; ctx.fillRect(-8,0,15,13);
  ctx.fillStyle=trim; ctx.fillRect(-8,0,15,3);
  ctx.restore();
  if(id===0){ // sword
    ctx.save(); ctx.translate(5,armLen*0.45); ctx.rotate(-0.15+L.fist*0.45);
    ctx.fillStyle='#bdc3c7'; ctx.fillRect(-2,0,4,22); ctx.fillStyle=trim; ctx.fillRect(-5,0,10,4);
    ctx.restore();
  }
  ctx.restore();

  // === RIGHT ARM ===
  ctx.save(); ctx.translate(30,-torsoH*0.72); ctx.rotate(R.arm);
  ctx.fillStyle=sec; ctx.fillRect(-5,0,11,armLen*(1-R.bend*0.18));
  ctx.fillStyle=trim; ctx.fillRect(-5,armLen*0.44,11,4);
  ctx.save(); ctx.translate(0,armLen*(0.88-R.bend*0.14));
  if(R.fist>0) ctx.translate(R.fist*20,-R.fist*4);
  ctx.fillStyle=col; ctx.fillRect(-7,0,15,13);
  ctx.fillStyle=trim; ctx.fillRect(-7,0,15,3);
  if(id===2&&R.fist>0.3){ ctx.fillStyle=trim; for(var ci2=0;ci2<3;ci2++) ctx.fillRect(-3+ci2*4,12,3,12); }
  ctx.restore();
  if(id===1){ // staff
    ctx.save(); ctx.translate(-3,armLen*0.28); ctx.rotate(0.13-R.fist*0.28);
    ctx.fillStyle='#8B4513'; ctx.fillRect(-2,-8,4,38);
    ctx.fillStyle=trim; ctx.shadowColor=trim; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(0,-8,5,0,PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.restore();
  }
  ctx.restore();

  // === HEAD ===
  ctx.save(); ctx.translate(0,-torsoH-headR+this.headBob*0.35); ctx.rotate(this.bodyTilt*-0.3);

  ctx.fillStyle = id===1?'#d5a67b':id===2?'#145a32':'#7B241C';
  ctx.beginPath(); ctx.arc(0,0,headR,0,PI*2); ctx.fill();

  if(id===0){ // helm
    ctx.fillStyle='#2c2c2c'; ctx.fillRect(-headR,-headR*0.25,headR*2,headR*0.45);
    ctx.fillStyle=trim; ctx.fillRect(-headR*0.35,-headR-3,headR*0.7,7);
    ctx.fillStyle='#ff3300'; ctx.fillRect(-headR*0.52,-headR*0.08,headR*1.04,headR*0.2);
  } else if(id===1){ // headband + glowing eyes
    ctx.fillStyle=trim; ctx.fillRect(-headR,-headR*0.22,headR*2,5);
    ctx.fillStyle='#00ffff'; ctx.shadowColor='#00ffff'; ctx.shadowBlur=9;
    ctx.beginPath(); ctx.arc(-6,-2,3.3,0,PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-2,3.3,0,PI*2); ctx.fill(); ctx.shadowBlur=0;
  } else { // beast mask
    ctx.fillStyle='#1a5c30'; ctx.fillRect(-headR,-headR*0.9,headR*2,headR*0.6);
    ctx.fillStyle=trim;
    ctx.beginPath(); ctx.arc(-6,-1,3.8,0,PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-1,3.8,0,PI*2); ctx.fill();
    ctx.fillStyle='#eee'; ctx.fillRect(-5,5,3,8); ctx.fillRect(2,5,3,8);
  }

  // status particles on head
  if(this.burning>0){ ctx.fillStyle='#ff4400'; ctx.globalAlpha=0.5+Math.sin(this.animT*4)*0.3; ctx.beginPath(); ctx.arc(0,-headR-5,5,0,PI*2); ctx.fill(); ctx.globalAlpha=1; }
  if(this.stun>0){
    ctx.fillStyle='#ffff00'; ctx.globalAlpha=0.7;
    for(var si2=0;si2<3;si2++){ var sa=this.animT*2.2+si2*PI*0.67; ctx.beginPath(); ctx.arc(Math.cos(sa)*13,-headR+Math.sin(sa)*4,3.5,0,PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.restore(); // torso
};

Fighter.prototype.attack = function(key){
  if(this.st==='ko'||this.hp<=0) return false;
  if(this.st==='attack'||this.st==='hurt'||(this.stun>0)) return false;
  var mv=this.d.moves[key];
  if(!mv) return false;
  if(mv.cost && this.meter<mv.cost) return false;
  if(mv.cost) this.meter-=mv.cost;
  this.st='attack'; this.atkMv=mv; this.atkPhase='su'; this.atkTimer=mv.su; this.atkHit=false; this.stT=0;
  sfxMove();
  if(key==='sp'||key==='ult'){
    if(!this.proj) this.proj={x:this.x+(this.dir===1?this.W:-10),y:this.y+this.H*0.38,vx:this.dir*8,dmg:Math.floor(mv.dmg*0.55),fx:mv.fx,life:55};
    if(key==='ult'){ sfx(45,'sawtooth',0.55,0.24); doShake(16); doFlash(this.d.col,7); }
  }
  return true;
};
Fighter.prototype.move = function(dir){ if(this.st!=='ko'&&this.hp>0&&this.st!=='attack'&&this.stun<=0){this.vx=dir*this.d.spd;this.dir=dir;this.st='walk';} };
Fighter.prototype.jump = function(){ if(this.grounded&&this.st!=='ko'&&this.hp>0&&this.st!=='attack'&&this.stun<=0){this.vy=-13.2;this.grounded=false;this.st='jump';sfxJump();} };
Fighter.prototype.crouch = function(){ if(this.grounded&&this.st!=='ko'&&this.hp>0){this.crouching=true;this.vx=0;this.st='crouch';} };
Fighter.prototype.stand = function(){ this.crouching=false; if(this.st==='crouch') this.st='idle'; };
Fighter.prototype.block = function(on){ if(this.st!=='ko'&&this.hp>0){this.blocking=on; if(on){this.vx=0;if(this.st!=='attack')this.st='block';}else if(this.st==='block')this.st='idle';} };

// ===== AI =====
function aiUpdate(){
  if(!p2||!p1||winner||paused||p2.hp<=0||p2.st==='ko') return;
  p2.aiT++;
  var delay = difficulty==='Easy'?50:difficulty==='Hard'?15:26;
  if(p2.aiT%delay!==0) return;
  if(p2.st==='attack'||p2.stun>0) return;
  var dx=p1.x-p2.x, dist=Math.abs(dx), r=Math.random();
  p2.dir = dx>0?1:-1;
  var react = difficulty==='Easy'?0.32:difficulty==='Hard'?0.74:0.54;
  p2.block(false);
  if(p1.st==='attack'&&p1.atkPhase==='ac'&&dist<150&&r<react){
    if(r<react*0.45) p2.block(true); else if(r<react*0.7) p2.jump(); else p2.vx=-p2.dir*6;
    return;
  }
  if(dist<95){
    if(r<0.26) p2.attack('lp'); else if(r<0.44) p2.attack('lk'); else if(r<0.58) p2.attack('hp');
    else if(r<0.7&&p2.meter>=25) p2.attack('sp'); else if(r<0.8&&p2.meter>=90) p2.attack('ult');
    else if(r<0.9) p2.block(true); else p2.move(-p2.dir);
  } else if(dist<250){
    if(r<0.38) p2.move(p2.dir); else if(r<0.55) p2.attack('hp');
    else if(r<0.68&&p2.meter>=90) p2.attack('ult'); else if(r<0.82) p2.jump(); else p2.block(true);
  } else {
    p2.move(p2.dir); if(r<0.35&&p2.meter>=25) p2.attack('sp'); if(r<0.55) p2.jump();
  }
}

// ===== DRAW STAGE =====
function drawStage(){
  var s=currentStage, gY=H*GROUND_RATIO;
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,s.bg0); bg.addColorStop(0.75,s.bg1); bg.addColorStop(1,s.fl);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // stars
  ctx.save();
  for(var i=0;i<bgStars.length;i++){
    var st=bgStars[i], twinkle=0.35+Math.sin(frame*0.018*st.s+st.x*8)*0.28;
    ctx.globalAlpha=twinkle; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(st.x*W,st.y*H,st.r,0,PI*2); ctx.fill();
  }
  ctx.restore();

  // floor
  ctx.fillStyle=s.fl; ctx.fillRect(0,gY,W,H-gY);

  // floor glow line
  ctx.save();
  ctx.shadowColor=s.line; ctx.shadowBlur=20;
  ctx.strokeStyle=s.line; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(0,gY); ctx.lineTo(W,gY); ctx.stroke();
  ctx.restore();

  // grid
  ctx.save(); ctx.globalAlpha=0.07; ctx.strokeStyle=s.line; ctx.lineWidth=1;
  for(var gx=0;gx<8;gx++){
    var px2=gx*(W/7);
    ctx.beginPath(); ctx.moveTo(px2,gY); ctx.lineTo(W/2, H*1.5); ctx.stroke();
  }
  for(var gr=0;gr<6;gr++){
    var gy2=gY+gr*(H-gY)/5;
    ctx.beginPath(); ctx.moveTo(0,gy2); ctx.lineTo(W,gy2); ctx.stroke();
  }
  ctx.restore();
}

// ===== DRAW UI =====
function rrect(x,y,w,h,r2){
  ctx.beginPath(); ctx.moveTo(x+r2,y); ctx.lineTo(x+w-r2,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r2);
  ctx.lineTo(x+w,y+h-r2); ctx.quadraticCurveTo(x+w,y+h,x+w-r2,y+h); ctx.lineTo(x+r2,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r2); ctx.lineTo(x,y+r2); ctx.quadraticCurveTo(x,y,x+r2,y); ctx.closePath();
}

function drawBar(x,y,w,h,frac,col,mir){
  ctx.fillStyle='rgba(0,0,0,0.65)'; rrect(x,y,w,h,4); ctx.fill();
  if(frac>0){
    var bc=frac>0.5?col:frac>0.25?'#e67e22':'#e74c3c';
    ctx.fillStyle=bc; ctx.shadowColor=bc; ctx.shadowBlur=7;
    if(mir) ctx.fillRect(x+w*(1-frac)+1,y+1,w*frac-1,h-2);
    else ctx.fillRect(x+1,y+1,w*frac-1,h-2);
    ctx.shadowBlur=0;
  }
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5;
  rrect(x,y,w,h,4); ctx.stroke();
}

function drawMeter(x,y,w,h,frac,col,mir){
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(x,y,w,h);
  if(frac>0){
    var mc = frac>=0.9?'#ffd700':col;
    ctx.fillStyle=mc; ctx.shadowColor=mc; ctx.shadowBlur=frac>=0.9?12:4;
    if(mir) ctx.fillRect(x+w*(1-frac)+1,y+1,w*frac-1,h-2);
    else ctx.fillRect(x+1,y+1,w*frac-1,h-2);
    ctx.shadowBlur=0;
  }
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1;
  for(var i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(x+w*i/4,y); ctx.lineTo(x+w*i/4,y+h); ctx.stroke(); }
}

  ctx.fillStyle='#fff'; ctx.shadowColor='#7700ff'; ctx.shadowBlur=30;
  ctx.fillText('ARCADE COMBAT',0,0); ctx.shadowBlur=0;
  ctx.font='bold '+Math.min(16,W*0.035)+'px "Segoe UI"';
  ctx.fillStyle='rgba(255,255,255,0.38)'; ctx.fillText('CHOOSE YOUR FIGHTER',0,28);
  ctx.restore();

  var items=['⚔  FIGHT','👥  SELECT FIGHTERS','⚙  DIFFICULTY: '+difficulty];
  for(var mi=0;mi<items.length;mi++){
    var iy=H*0.41+mi*Math.min(70,H*0.13);
    var active=menuSel===mi;
    ctx.save(); ctx.translate(W/2,iy);
    if(active){
      var mp=0.97+Math.sin(frame*0.1)*0.03; ctx.scale(mp,mp);
      ctx.fillStyle='rgba(100,0,240,0.28)';
      rrect(-W*0.28,-30,W*0.56,50,9); ctx.fill();
      ctx.strokeStyle='#7700ff'; ctx.lineWidth=2.2; ctx.shadowColor='#7700ff'; ctx.shadowBlur=14;
      rrect(-W*0.28,-30,W*0.56,50,9); ctx.stroke(); ctx.shadowBlur=0;
    }
    ctx.fillStyle=active?'#bb55ff':'#777';
    ctx.font='bold '+Math.min(25,W*0.048)+'px "Segoe UI",Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(items[mi],0,8);
    ctx.restore();
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function drawSelect(){
  ctx.fillStyle='#00001a'; ctx.fillRect(0,0,W,H);
  for(var i=0;i<bgStars.length;i++){
    var s=bgStars[i]; ctx.globalAlpha=0.22;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H*0.4,s.r,0,PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.font='bold '+Math.min(23,W*0.048)+'px "Segoe UI",Arial';
  ctx.fillStyle='#fff'; ctx.shadowColor='#7700ff'; ctx.shadowBlur=14;
  ctx.fillText('SELECT FIGHTERS',W/2,40); ctx.shadowBlur=0;
  ctx.font='11px "Segoe UI"'; ctx.fillStyle='rgba(255,255,255,0.38)';
  ctx.fillText('Tap left half = P1  ·  Tap right half = CPU',W/2,60);

  var cw=Math.min(125,(W-60)/3.2), ch=cw*1.52, gap=14;
  var totalW=cw*3+gap*2, sx=(W-totalW)/2, sy=76;

  for(var fi=0;fi<FIGHTERS.length;fi++){
    var f=FIGHTERS[fi], fx2=sx+fi*(cw+gap);
    var sp1=fi===selP1, sp2=fi===selP2;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.55)'; rrect(fx2,sy,cw,ch,9); ctx.fill();
    var cg=ctx.createLinearGradient(fx2,sy,fx2,sy+ch);
    cg.addColorStop(0,f.col+'80'); cg.addColorStop(1,f.col+'18');
    ctx.fillStyle=cg; rrect(fx2+3,sy+3,cw-6,ch-6,7); ctx.fill();

    ctx.fillStyle='#fff'; ctx.font='bold '+Math.min(13,cw*0.105)+'px "Segoe UI",Arial'; ctx.textAlign='center';
    ctx.fillText(f.name, fx2+cw/2, sy+22);
    ctx.font='10px "Segoe UI"'; ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillText(f.sub, fx2+cw/2, sy+36);

    var stats=[[f.hp/130,'HP','#2ecc71'],[f.spd/6,'SPD','#f39c12'],[f.crit/0.22,'CRIT','#ffd700'],[f.dodge/0.14,'DODGE','#3498db']];
    var sbY=sy+ch-54, sbW=cw-18, sbH=6;
    for(var si2=0;si2<stats.length;si2++){
      var st=stats[si2];
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(fx2+9,sbY+si2*13,sbW,sbH);
      ctx.fillStyle=st[2]; ctx.fillRect(fx2+9,sbY+si2*13,sbW*Math.min(1,st[0]),sbH);
      ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='7px "Segoe UI"'; ctx.textAlign='left';
      ctx.fillText(st[1],fx2+9,sbY+si2*13-1);
    }

    if(sp1||sp2){
      ctx.strokeStyle=sp1?'#ffd700':'#3498db'; ctx.lineWidth=3.5;
      ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=12;
      rrect(fx2-4,sy-4,cw+8,ch+8,12); ctx.stroke(); ctx.shadowBlur=0;
      ctx.fillStyle=ctx.strokeStyle; ctx.font='bold 10px "Segoe UI"'; ctx.textAlign='center';
      ctx.fillText(sp1?'P1':'CPU', fx2+cw/2, sy-7);
    }
    ctx.restore();
  }

  var bx=W/2-75, by=sy+ch+22, bh=48;
  var rp=0.97+Math.sin(frame*0.1)*0.03;
  ctx.save(); ctx.translate(W/2,by+bh/2); ctx.scale(rp,rp); ctx.translate(-W/2,-(by+bh/2));
  ctx.fillStyle='rgba(100,0,240,0.65)'; rrect(bx,by,150,bh,9); ctx.fill();
  ctx.strokeStyle='#aa55ff'; ctx.lineWidth=2.2; ctx.shadowColor='#aa55ff'; ctx.shadowBlur=12;
  rrect(bx,by,150,bh,9); ctx.stroke(); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='bold 19px "Segoe UI",Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('FIGHT!',W/2,by+bh/2);
  ctx.restore(); ctx.textBaseline='alphabetic';
}

function drawPause(){
  ctx.fillStyle='rgba(0,0,0,0.87)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold '+Math.min(42,W*0.09)+'px "Segoe UI",Arial';
  ctx.shadowColor='#7700ff'; ctx.shadowBlur=26; ctx.fillText('PAUSED',W/2,H*0.3); ctx.shadowBlur=0;
  var pitems=['▶  RESUME','🏠  QUIT TO MENU'];
  for(var pi=0;pi<pitems.length;pi++){
    var piy=H*0.5+pi*85, pac=pauseSel===pi;
    ctx.save(); ctx.translate(W/2,piy);
    if(pac){
      ctx.fillStyle='rgba(100,0,240,0.32)'; rrect(-115,-28,230,58,9); ctx.fill();
      ctx.strokeStyle='#7700ff'; ctx.lineWidth=2.2; ctx.shadowColor='#7700ff'; ctx.shadowBlur=11;
      rrect(-115,-28,230,58,9); ctx.stroke(); ctx.shadowBlur=0;
    }
    ctx.fillStyle=pac?'#aa55ff':'#777';
    ctx.font='bold '+Math.min(27,W*0.055)+'px "Segoe UI",Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pitems[pi],0,5); ctx.restore();
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

// ===== MAIN LOOP =====
function createPlayers(){
  p1=new Fighter(FIGHTERS[selP1],1);
  p2=new Fighter(FIGHTERS[selP2],-1);
  particles=[]; floats=[]; winner=null; winTimer=0; comboCount=0; comboTimer=0;
  paused=false; frame=0; shakeAmt=0; flashAmt=0;
}

function update(){
  if(gameState!==STATE.FIGHT||paused||winner) return;
  frame++;
  if(comboTimer>0){ comboTimer--; if(comboTimer<=0) comboCount=0; }
  updateFX();
  if(p1&&p2){
    var p2prevHp=p2.hp;
    p1.update(p2); p2.update(p1); aiUpdate();
    if(p2.hp<p2prevHp&&p2.hp>0){ comboCount++; comboTimer=60; sfxCombo(Math.min(comboCount,10)); }
    if(p1.hp<=0&&!winner){ winner='CPU WINS!'; winTimer=220; }
    if(p2.hp<=0&&!winner){ winner='YOU WIN!'; winTimer=220; }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(gameState===STATE.MENU){ frame++; updateFX(); drawMenu(); }
  else if(gameState===STATE.SELECT){ frame++; drawSelect(); }
  else if(gameState===STATE.FIGHT){
    drawStage();
    if(p2) p2.draw();
    if(p1) p1.draw();
    drawFX();
    drawUI();
    drawButtons();
    if(flashAmt>0){ ctx.fillStyle=flashColor; ctx.globalAlpha=(flashAmt/8)*0.2; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    if(winner){
      ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
      var wp=0.9+Math.sin(frame*0.1)*0.1;
      ctx.save(); ctx.translate(W/2,H/2); ctx.scale(wp,wp);
      var wc=winner==='YOU WIN!'?'#2ecc71':'#e74c3c';
      ctx.fillStyle=wc; ctx.shadowColor=wc; ctx.shadowBlur=45;
      ctx.font='bold '+Math.min(54,W*0.11)+'px "Segoe UI",Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(winner,0,0); ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.font='bold '+Math.min(16,W*0.035)+'px "Segoe UI"';
      ctx.fillText('Returning to menu...',0,50); ctx.restore();
    }
    if(paused) drawPause();
  }
}

function loop(){
  update(); draw();
  if(winner&&!paused){ winTimer--; if(winTimer<=0){ gameState=STATE.MENU; p1=null; p2=null; winner=null; } }
  requestAnimationFrame(loop);
}

// ===== INPUT =====
function doAction(id){
  if(!p1||winner||paused) return;
  if(id==='left') p1.move(-1);
  else if(id==='right') p1.move(1);
  else if(id==='jump') p1.jump();
  else if(id==='crouch') p1.crouch();
  else if(id==='block') p1.block(true);
  else p1.attack(id);
}

function handleTap(x,y){
  initAudio();
  if(gameState===STATE.FIGHT&&paused){
    var iy1=H*0.5, iy2=H*0.5+85;
    if(y>=iy1-28&&y<=iy1+30){ paused=false; return; }
    if(y>=iy2-28&&y<=iy2+30){ paused=false; gameState=STATE.MENU; p1=null; p2=null; winner=null; return; }
    return;
  }
  if(gameState===STATE.MENU){
    var base=H*0.41, step=Math.min(70,H*0.13);
    if(y>=base-30&&y<=base+28){ menuSel=0; currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); makeButtons(); gameState=STATE.FIGHT; }
    else if(y>=base+step-30&&y<=base+step+28){ menuSel=1; gameState=STATE.SELECT; }
    else if(y>=base+step*2-30&&y<=base+step*2+28){ difficulty=difficulty==='Easy'?'Normal':difficulty==='Normal'?'Hard':'Easy'; }
  } else if(gameState===STATE.SELECT){
    var cw=Math.min(125,(W-60)/3.2), ch=cw*1.52, gap=14;
    var totalW=cw*3+gap*2, sx=(W-totalW)/2, sy=76;
    var bx=W/2-75, by=sy+ch+22;
    if(x>=bx&&x<=bx+150&&y>=by&&y<=by+48){
      currentStage=STAGES[Math.floor(Math.random()*STAGES.length)];
      createPlayers(); makeButtons(); gameState=STATE.FIGHT; return;
    }
    for(var fi=0;fi<FIGHTERS.length;fi++){
      var fx2=sx+fi*(cw+gap);
      if(x>=fx2&&x<=fx2+cw&&y>=sy&&y<=sy+ch){
        if(x<W/2) selP1=fi; else selP2=fi;
      }
    }
  }
}

canvas.addEventListener('touchstart',function(e){
  e.preventDefault(); initAudio();
  var t=e.changedTouches[0];
  if(gameState===STATE.FIGHT&&!winner){
    if(paused){ handleTap(t.clientX,t.clientY); return; }
    if(t.clientY<H*0.22){
      var now=Date.now();
      if(now-lastTapTime<380){ paused=true; pauseSel=0; lastTapTime=0; return; }
      lastTapTime=now; return;
    }
    lastTapTime=0;
    var btn=getBtn(t.clientX,t.clientY);
    if(btn) doAction(btn.id);
  } else handleTap(t.clientX,t.clientY);
},{passive:false});

canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(gameState===STATE.FIGHT&&!winner&&!paused){
    for(var i=0;i<e.touches.length;i++){
      var t=e.touches[i], btn=getBtn(t.clientX,t.clientY);
      if(btn&&(btn.id==='left'||btn.id==='right'||btn.id==='block')) doAction(btn.id);
    }
  }
},{passive:false});

canvas.addEventListener('touchend',function(e){
  e.preventDefault();
  if(gameState===STATE.FIGHT&&p1&&!paused){
    var anyMove=false, anyBlock=false, anyCrouch=false;
    for(var i=0;i<e.touches.length;i++){
      var b=getBtn(e.touches[i].clientX,e.touches[i].clientY);
      if(b){ if(b.id==='left'||b.id==='right') anyMove=true; if(b.id==='block') anyBlock=true; if(b.id==='crouch') anyCrouch=true; }
    }
    if(!anyMove){ p1.vx=0; if(p1.st==='walk') p1.st='idle'; }
    if(!anyBlock) p1.block(false);
    if(!anyCrouch) p1.stand();
  }
},{passive:false});

canvas.addEventListener('click',function(e){
  if(gameState!==STATE.FIGHT||paused) handleTap(e.clientX,e.clientY);
});

var keys={};
window.addEventListener('keydown',function(e){
  if(keys[e.code]) return; keys[e.code]=true; initAudio();
  if(gameState===STATE.FIGHT&&!winner){
    if(e.code==='Escape'){ paused=!paused; if(paused) pauseSel=0; return; }
    if(paused){
      if(e.code==='ArrowUp'||e.code==='KeyW') pauseSel=(pauseSel+1)%2;
      if(e.code==='ArrowDown'||e.code==='KeyS') pauseSel=(pauseSel+1)%2;
      if(e.code==='Enter'||e.code==='Space'){ if(pauseSel===0) paused=false; else{ paused=false; gameState=STATE.MENU; p1=null; p2=null; winner=null; } }
      return;
    }
    if(e.code==='ArrowLeft') doAction('left');
    if(e.code==='ArrowRight') doAction('right');
    if(e.code==='ArrowUp'||e.code==='KeyW') doAction('jump');
    if(e.code==='ArrowDown') doAction('crouch');
    if(e.code==='KeyA') doAction('lp');
    if(e.code==='KeyD') doAction('hp');
    if(e.code==='KeyZ') doAction('lk');
    if(e.code==='KeyX') doAction('hk');
    if(e.code==='KeyQ') doAction('sp');
    if(e.code==='KeyE') doAction('ult');
    if(e.code==='ShiftLeft'||e.code==='ShiftRight') doAction('block');
  } else if(gameState===STATE.MENU){
    if(e.code==='ArrowUp') menuSel=(menuSel-1+3)%3;
    if(e.code==='ArrowDown') menuSel=(menuSel+1)%3;
    if(e.code==='Enter'||e.code==='Space'){
      if(menuSel===0){ currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); makeButtons(); gameState=STATE.FIGHT; }
      else if(menuSel===1) gameState=STATE.SELECT;
      else { difficulty=difficulty==='Easy'?'Normal':difficulty==='Normal'?'Hard':'Easy'; }
    }
  } else if(gameState===STATE.SELECT){
    if(e.code==='Enter'||e.code==='Space'){ currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); makeButtons(); gameState=STATE.FIGHT; }
    if(e.code==='ArrowLeft') selP1=(selP1-1+3)%3;
    if(e.code==='ArrowRight') selP1=(selP1+1)%3;
    if(e.code==='KeyA') selP2=(selP2-1+3)%3;
    if(e.code==='KeyD') selP2=(selP2+1)%3;
  }
});
window.addEventListener('keyup',function(e){
  keys[e.code]=false;
  if(gameState===STATE.FIGHT&&p1&&!paused){
    if(e.code==='ArrowLeft'||e.code==='ArrowRight'){ p1.vx=0; if(p1.st==='walk') p1.st='idle'; }
    if(e.code==='ShiftLeft'||e.code==='ShiftRight') p1.block(false);
    if(e.code==='ArrowDown') p1.stand();
  }
});
setInterval(function(){
  if(gameState===STATE.FIGHT&&p1&&!paused&&!winner){
    if(keys['ArrowLeft']) doAction('left');
    else if(keys['ArrowRight']) doAction('right');
    if(keys['ArrowDown']) doAction('crouch');
    if(keys['ShiftLeft']||keys['ShiftRight']) doAction('block');
  }
},50);

// ===== START =====
currentStage = STAGES[0];
makeButtons();
loop();

})();
</script>
</body>
