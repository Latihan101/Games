<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Animation System - Full Game + Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .game-wrapper {
      width: 1200px;
      max-width: 100%;
      background: linear-gradient(160deg, #0f0f1a 0%, #0a0818 100%);
      border: 2px solid rgba(108, 63, 197, 0.4);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .menu-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: rgba(20, 10, 50, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(108,63,197,0.4);
      flex-wrap: wrap;
    }
    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 16px;
      color: #c090ff;
      letter-spacing: 2px;
      margin-right: 15px;
      text-shadow: 0 0 15px #6c3fc5;
    }
    .menu-btn {
      background: rgba(108,63,197,0.1);
      border: 1px solid rgba(108,63,197,0.4);
      color: #b0a0d0;
      padding: 6px 12px;
      border-radius: 20px;
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .menu-btn.active {
      background: #6c3fc5;
      border-color: #9060ff;
      color: white;
      box-shadow: 0 0 15px #6c3fc5aa;
    }
    .menu-btn:hover {
      border-color: #9060ff;
      background: rgba(108,63,197,0.3);
    }
    .game-content {
      display: flex;
      flex-direction: column;
    }
    .canvas-world-wrapper {
      position: relative;
      width: 100%;
      height: 400px;
      background: #0b0b14;
    }
    .hud {
      position: absolute;
      bottom: 15px;
      left: 20px;
      color: white;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid #6c3fc5;
    }
    .controls-hint {
      position: absolute;
      bottom: 15px;
      right: 20px;
      color: #aaa;
      font-size: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px 14px;
      border-radius: 20px;
    }
    .showcase-panel {
      padding: 16px;
      background: rgba(10, 5, 20, 0.8);
      max-height: 500px;
      overflow-y: auto;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: #4a2090; border-radius: 3px; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
    @keyframes slideIn { 0% { transform: translateX(100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes lvlupPop { 0% { transform: scale(0.5) rotate(-5deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
    @keyframes windowOpen { 0% { transform: scale(0.8) translateY(-20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ============================================================
// ANIMATION STATE MACHINE CONFIG
// ============================================================
const PLAYER_ANIMATIONS = {
  idle_down:   { frames: 4, row: 0, fps: 4,  loop: true,  label: "Idle Down" },
  idle_up:     { frames: 4, row: 1, fps: 4,  loop: true,  label: "Idle Up" },
  idle_left:   { frames: 4, row: 2, fps: 4,  loop: true,  label: "Idle Left" },
  idle_right:  { frames: 4, row: 3, fps: 4,  loop: true,  label: "Idle Right" },
  walk_down:   { frames: 6, row: 0, fps: 8,  loop: true,  label: "Walk Down" },
  walk_up:     { frames: 6, row: 1, fps: 8,  loop: true,  label: "Walk Up" },
  walk_left:   { frames: 6, row: 2, fps: 8,  loop: true,  label: "Walk Left" },
  walk_right:  { frames: 6, row: 3, fps: 8,  loop: true,  label: "Walk Right" },
  run_down:    { frames: 6, row: 0, fps: 14, loop: true,  label: "Run Down" },
  run_up:      { frames: 6, row: 1, fps: 14, loop: true,  label: "Run Up" },
  run_left:    { frames: 6, row: 2, fps: 14, loop: true,  label: "Run Left" },
  run_right:   { frames: 6, row: 3, fps: 14, loop: true,  label: "Run Right" },
  dash:        { frames: 5, row: 4, fps: 18, loop: false, label: "Dash" },
  attack1:     { frames: 5, row: 5, fps: 16, loop: false, label: "Attack Combo 1" },
  attack2:     { frames: 6, row: 6, fps: 16, loop: false, label: "Attack Combo 2" },
  attack3:     { frames: 7, row: 7, fps: 18, loop: false, label: "Attack Combo 3" },
  skill_cast:  { frames: 8, row: 8, fps: 14, loop: false, label: "Skill Cast" },
  ult_cast:    { frames: 10, row: 9, fps: 14, loop: false, label: "Ultimate Cast" },
  hurt:        { frames: 3, row: 10, fps: 12, loop: false, label: "Hurt" },
  knockback:   { frames: 4, row: 11, fps: 14, loop: false, label: "Knockback" },
  death:       { frames: 8, row: 12, fps: 10, loop: false, label: "Death" },
  revive:      { frames: 8, row: 12, fps: 8,  loop: false, label: "Revive" },
  victory:     { frames: 6, row: 13, fps: 8,  loop: true,  label: "Victory" },
  interaction: { frames: 4, row: 14, fps: 6,  loop: true,  label: "Interaction" },
  gathering:   { frames: 6, row: 14, fps: 8,  loop: true,  label: "Gathering" },
  mining:      { frames: 6, row: 15, fps: 8,  loop: true,  label: "Mining" },
  fishing:     { frames: 8, row: 16, fps: 6,  loop: true,  label: "Fishing" },
  crafting:    { frames: 6, row: 17, fps: 6,  loop: true,  label: "Crafting" },
};

const SKILL_DATA = {
  fireball:  { color: "#ff4500", glow: "#ff8c00", label: "Fireball",     icon: "🔥", desc: "Charge → Launch → Trail → Explosion" },
  ice_blast: { color: "#00d4ff", glow: "#80e8ff", label: "Ice Blast",    icon: "❄️", desc: "Formation → Shards → Freeze Effect" },
  thunder:   { color: "#ffe000", glow: "#fff380", label: "Thunder Strike",icon: "⚡", desc: "Lightning Beam → Ground Impact → Electric Particles" },
  meteor:    { color: "#ff6a00", glow: "#ffa040", label: "Meteor",        icon: "☄️", desc: "Falling Meteor → Ground Crack → Explosion → Debris" },
  healing:   { color: "#39ff14", glow: "#b0ffb0", label: "Healing",       icon: "✨", desc: "Magic Circle → Light Particles → Recovery" },
};

const ENEMY_DATA = [
  { id: "goblin",  label: "Goblin",      color: "#3f8c3f", size: 32 },
  { id: "orc",     label: "Orc Warrior", color: "#6b3a1f", size: 48 },
  { id: "slime",   label: "Slime",       color: "#1fa04a", size: 28 },
  { id: "skeleton",label: "Skeleton",    color: "#c8bfa0", size: 36 },
  { id: "bat",     label: "Bat",         color: "#4a2070", size: 24 },
];

const BOSS_DATA = [
  { id: "dragon",   label: "Ancient Dragon", color: "#c0392b", size: 80 },
  { id: "lich",     label: "Lich King",      color: "#8e44ad", size: 70 },
  { id: "titan",    label: "Stone Titan",    color: "#7f8c8d", size: 90 },
];

const TABS = ["🌍 World", "🧝 Player", "✨ Skills", "👾 Enemies", "🐉 Bosses", "🐾 NPCs & Pets", "🌿 World & UI", "💥 FX Showcase"];

// ============================================================
// PIXEL HERO RENDERER
// ============================================================
function drawPixelHero(ctx, x, y, scale, dir, frame, state) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const skin = "#f5c5a0";
  const hair = "#4a2c0a";
  const armor = state === "hurt" || state === "knockback" ? "#ff4444" :
                state === "death" ? "#555" :
                state === "victory" ? "#f5a623" :
                state.includes("skill") || state.includes("ult") ? "#b060ff" :
                state.includes("attack") ? "#ff6644" : "#4a90d9";
  const boot = "#2c1810";
  const cape = state.includes("ult") ? "#ff2080" : "#8c1f1f";

  const bob = Math.sin(frame * 0.8) * (state.includes("walk") ? 2 : state.includes("run") ? 3 : 0.5);

  ctx.save();
  ctx.translate(0, bob);

  // Cape
  ctx.fillStyle = cape;
  ctx.beginPath();
  ctx.ellipse(0, 4, 5, 8 + Math.sin(frame * 0.4) * 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  const legSwing = state.includes("walk") || state.includes("run") ? Math.sin(frame * 1.4) * (state.includes("run") ? 6 : 4) : 0;
  ctx.fillStyle = armor;
  ctx.fillRect(-5 - legSwing * 0.3, 10, 4, 8);
  ctx.fillRect(1 + legSwing * 0.3, 10, 4, 8);
  ctx.fillStyle = boot;
  ctx.fillRect(-6 - legSwing * 0.3, 16, 5, 4);
  ctx.fillRect(0 + legSwing * 0.3, 16, 5, 4);

  // Body
  ctx.fillStyle = armor;
  ctx.fillRect(-6, 2, 12, 10);

  // Arms
  const armSwing = state.includes("walk") || state.includes("run") ? Math.cos(frame * 1.4) * 5 : 0;
  const attackArm = state.includes("attack") ? Math.sin(frame * 2) * 15 - 10 : 0;
  ctx.fillStyle = armor;
  ctx.fillRect(-10, 2 + armSwing + attackArm, 4, 6);
  ctx.fillRect(6, 2 - armSwing + attackArm, 4, 6);

  // Glow if casting
  if (state.includes("skill") || state.includes("ult") || state === "victory") {
    ctx.save();
    const glowColor = state.includes("ult") ? "#ff00ff" : state === "victory" ? "#ffd700" : "#a060ff";
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 20 + Math.sin(frame * 0.5) * 10;
    ctx.fillStyle = glowColor;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(0, 6, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Head
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(0, -4, 6, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = hair;
  ctx.fillRect(-6, -9, 12, 5);
  ctx.beginPath();
  ctx.arc(0, -9, 5, Math.PI, 0);
  ctx.fill();

  // Eyes
  ctx.fillStyle = "#222";
  if (dir !== "up") {
    const eyeY = state === "hurt" || state === "death" ? -2 : -4;
    ctx.fillRect(-3, eyeY, 2, state === "hurt" ? 1 : 2);
    ctx.fillRect(1, eyeY, 2, state === "hurt" ? 1 : 2);
  }

  // Weapon for attack
  if (state.includes("attack") || state === "dash") {
    ctx.save();
    ctx.rotate(attackArm * 0.05 - 0.3);
    ctx.fillStyle = "#c0c0c0";
    ctx.fillRect(8, -6, 3, 16);
    ctx.fillStyle = "#f5a623";
    ctx.fillRect(6, -2, 7, 2);
    ctx.restore();
  }

  ctx.restore();
  ctx.restore();
}

// ============================================================
// WORLD GAMEPLAY COMPONENT
// ============================================================
function WorldGameplay({ onAnimationChange }) {
  const canvasRef = useRef(null);
  const playerPos = useRef({ x: 400, y: 200 });
  const playerDir = useRef("down");
  const playerState = useRef("idle_down");
  const frameRef = useRef(0);
  const keys = useRef({});
  const running = useRef(false);
  const attacking = useRef(false);
  const animRef = useRef(null);
  const enemiesRef = useRef([
    { id: "gob1", type: "goblin", x: 200, y: 150, hp: 30 },
    { id: "slime1", type: "slime", x: 550, y: 200, hp: 20 },
    { id: "bat1", type: "bat", x: 650, y: 100, hp: 15 },
    { id: "orc1", type: "orc", x: 350, y: 300, hp: 50 },
    { id: "skel1", type: "skeleton", x: 700, y: 280, hp: 25 },
  ]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    const handleKeyDown = (e) => {
      keys.current[e.key] = true;
      if (e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        if (!attacking.current) {
          attacking.current = true;
          playerState.current = "attack1";
          onAnimationChange && onAnimationChange("attack1");
          setTimeout(() => {
            attacking.current = false;
          }, 400);
        }
      }
      if (e.key === "r" || e.key === "R") {
        running.current = !running.current;
      }
    };
    const handleKeyUp = (e) => { keys.current[e.key] = false; };
    window.addEventListener("keydown", handleKeyDown);
    window.addEventListener("keyup", handleKeyUp);

    const gameLoop = () => {
      const k = keys.current;
      let dx = 0, dy = 0;
      if (k["ArrowUp"] || k["w"]) dy -= 1;
      if (k["ArrowDown"] || k["s"]) dy += 1;
      if (k["ArrowLeft"] || k["a"]) dx -= 1;
      if (k["ArrowRight"] || k["d"]) dx += 1;
      
      const speed = 2.5 * (running.current ? 1.8 : 1);
      if (dx !== 0 || dy !== 0) {
        const len = Math.sqrt(dx*dx+dy*dy);
        dx /= len; dy /= len;
        playerPos.current.x += dx * speed;
        playerPos.current.y += dy * speed;
        playerPos.current.x = Math.max(30, Math.min(870, playerPos.current.x));
        playerPos.current.y = Math.max(30, Math.min(370, playerPos.current.y));
        
        if (!attacking.current) {
          if (Math.abs(dx) > Math.abs(dy)) playerDir.current = dx > 0 ? "right" : "left";
          else playerDir.current = dy > 0 ? "down" : "up";
          const base = running.current ? "run" : "walk";
          const newState = `${base}_${playerDir.current}`;
          playerState.current = newState;
          onAnimationChange && onAnimationChange(newState);
        }
      } else {
        if (!attacking.current) {
          const newState = `idle_${playerDir.current}`;
          playerState.current = newState;
          onAnimationChange && onAnimationChange(newState);
        }
      }

      // Draw world
      ctx.clearRect(0, 0, 900, 400);
      
      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 400);
      skyGrad.addColorStop(0, "#1a2a4a");
      skyGrad.addColorStop(0.6, "#2a4a3a");
      skyGrad.addColorStop(1, "#1a3a1a");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, 900, 400);

      // Ground
      ctx.fillStyle = "#2a5a2a";
      ctx.fillRect(0, 320, 900, 80);
      ctx.fillStyle = "#1a4a1a";
      ctx.fillRect(0, 340, 900, 60);

      // Path
      ctx.fillStyle = "#8a7a5a";
      ctx.beginPath();
      ctx.moveTo(0, 350);
      ctx.quadraticCurveTo(450, 300, 900, 340);
      ctx.lineTo(900, 370);
      ctx.quadraticCurveTo(450, 330, 0, 380);
      ctx.closePath();
      ctx.fill();

      // Trees
      [80, 250, 450, 650, 820].forEach((tx, i) => {
        const ty = 260 + Math.sin(i * 1.5) * 30;
        ctx.fillStyle = "#3a2a1a";
        ctx.fillRect(tx - 4, ty, 8, 50);
        ctx.fillStyle = "#1a5a1a";
        ctx.beginPath();
        ctx.arc(tx, ty - 10, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2a7a2a";
        ctx.beginPath();
        ctx.arc(tx, ty - 20, 16, 0, Math.PI * 2);
        ctx.fill();
      });

      // Rocks
      ctx.fillStyle = "#6a6a6a";
      [150, 500, 750].forEach(rx => {
        ctx.beginPath();
        ctx.ellipse(rx, 330, 15, 8, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw enemies
      enemiesRef.current.forEach(enemy => {
        const data = ENEMY_DATA.find(e => e.id === enemy.type) || ENEMY_DATA[0];
        const bob = Math.sin(frameRef.current * 0.05 + enemy.x) * 2;
        
        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(enemy.x, enemy.y + data.size/2 + 2, data.size/2, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Body
        ctx.fillStyle = data.color;
        ctx.shadowColor = data.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        if (enemy.type === "slime") {
          ctx.arc(enemy.x, enemy.y + bob, data.size/2, 0, Math.PI * 2);
        } else if (enemy.type === "bat") {
          const wingFlap = Math.sin(frameRef.current * 0.1 + enemy.x) * 8;
          ctx.arc(enemy.x, enemy.y + bob, data.size/3, 0, Math.PI * 2);
          ctx.beginPath();
          ctx.ellipse(enemy.x - 10, enemy.y - 5 + wingFlap, 12, 6, -0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(enemy.x + 10, enemy.y - 5 - wingFlap, 12, 6, 0.3, 0, Math.PI * 2);
        } else {
          ctx.rect(enemy.x - data.size/3, enemy.y - data.size/2 + bob, data.size*2/3, data.size/2);
          ctx.beginPath();
          ctx.arc(enemy.x, enemy.y - data.size/2 + bob, data.size/3, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // HP bar
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(enemy.x - 15, enemy.y - data.size/2 - 15, 30, 4);
        ctx.fillStyle = enemy.hp > 20 ? "#39ff14" : enemy.hp > 10 ? "#ffaa00" : "#ff2244";
        ctx.fillRect(enemy.x - 15, enemy.y - data.size/2 - 15, 30 * (enemy.hp / 50), 4);
      });

      // Draw player
      drawPixelHero(ctx, playerPos.current.x, playerPos.current.y, 2.0, playerDir.current, frameRef.current * 0.3, playerState.current);
      
      frameRef.current++;
      animRef.current = requestAnimationFrame(gameLoop);
    };
    animRef.current = requestAnimationFrame(gameLoop);
    
    return () => {
      window.removeEventListener("keydown", handleKeyDown);
      window.removeEventListener("keyup", handleKeyUp);
      cancelAnimationFrame(animRef.current);
    };
  }, []);

  return <canvas ref={canvasRef} id="worldCanvas" width={900} height={400} style={{ width: "100%", height: "100%" }} />;
}

// ============================================================
// SKILL EFFECT CANVAS
// ============================================================
function SkillCanvas({ skill, playing }) {
  const canvasRef = useRef(null);
  const particlesRef = useRef([]);
  const rafRef = useRef(null);

  const spawnParticle = useCallback((cfg) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const cx = cfg.cx ?? canvas.width / 2;
    const cy = cfg.cy ?? canvas.height / 2;
    const count = cfg.count ?? 20;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const speed = cfg.speed ?? (1 + Math.random() * 3);
      particlesRef.current.push({
        x: cx + (Math.random() - 0.5) * (cfg.spread ?? 10),
        y: cy + (Math.random() - 0.5) * (cfg.spread ?? 10),
        vx: Math.cos(angle) * speed * (0.5 + Math.random()),
        vy: Math.sin(angle) * speed * (0.5 + Math.random()),
        life: 1,
        decay: 0.015 + Math.random() * 0.025,
        size: (cfg.minSize ?? 2) + Math.random() * (cfg.maxSize ?? 4),
        color: cfg.colors ? cfg.colors[Math.floor(Math.random() * cfg.colors.length)] : "#fff",
        gravity: cfg.gravity ?? 0.05,
      });
    }
  }, []);

  useEffect(() => {
    if (!playing) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    let tick = 0;

    const configs = {
      fireball: [
        { t: 0,  fn: () => spawnParticle({ cx, cy: cy+20, count: 8, colors: ["#ff4500","#ff8c00","#ffcc00"], spread: 5, speed: 0.5, minSize: 3, maxSize: 6 }) },
        { t: 20, fn: () => spawnParticle({ cx: cx-40, cy, count: 30, colors: ["#ff4500","#ff6a00","#ffcc00","#fff"], spread: 3, speed: 4, gravity: -0.02, minSize: 2, maxSize: 5 }) },
        { t: 50, fn: () => spawnParticle({ cx, cy, count: 60, colors: ["#ff2200","#ff6a00","#ffcc00","#fff","#ff4500"], spread: 20, speed: 5, gravity: 0.08, minSize: 3, maxSize: 8 }) },
      ],
      ice_blast: [
        { t: 0,  fn: () => spawnParticle({ cx, cy, count: 15, colors: ["#00d4ff","#80e8ff","#ffffff"], spread: 8, speed: 0.8, gravity: -0.01, minSize: 2, maxSize: 4 }) },
        { t: 25, fn: () => spawnParticle({ cx, cy, count: 40, colors: ["#00d4ff","#80e8ff","#b0f4ff","#ffffff"], spread: 30, speed: 4, gravity: 0.03, minSize: 1, maxSize: 3 }) },
      ],
      thunder: [
        { t: 0,  fn: () => spawnParticle({ cx, cy: cy-60, count: 5, colors: ["#ffe000","#fff380","#ffffff"], spread: 3, speed: 1, gravity: 0.2, minSize: 2, maxSize: 3 }) },
        { t: 15, fn: () => spawnParticle({ cx, cy, count: 50, colors: ["#ffe000","#fff380","#ffffff","#aaaaff"], spread: 5, speed: 6, gravity: 0.1, minSize: 1, maxSize: 3 }) },
      ],
      meteor: [
        { t: 0,  fn: () => spawnParticle({ cx: cx-50, cy: cy-70, count: 10, colors: ["#ff6a00","#ffa040","#ffcc00"], spread: 8, speed: 1, gravity: 0.0, minSize: 3, maxSize: 6 }) },
        { t: 20, fn: () => spawnParticle({ cx, cy: cy+10, count: 80, colors: ["#ff4500","#ff6a00","#ffcc00","#fff","#ff2200"], spread: 40, speed: 6, gravity: 0.1, minSize: 2, maxSize: 9 }) },
      ],
      healing: [
        { t: 0,  fn: () => spawnParticle({ cx, cy, count: 20, colors: ["#39ff14","#80ff80","#ffffff","#b0ffb0"], spread: 35, speed: 1.5, gravity: -0.04, minSize: 2, maxSize: 5 }) },
        { t: 20, fn: () => spawnParticle({ cx, cy, count: 30, colors: ["#39ff14","#ffffff","#c0ffc0"], spread: 20, speed: 2, gravity: -0.06, minSize: 3, maxSize: 6 }) },
      ],
    };

    const myConfigs = configs[skill] || configs.fireball;

    const loop = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tick++;
      
      for (const cfg of myConfigs) {
        if (tick === cfg.t) cfg.fn();
      }
      
      particlesRef.current = particlesRef.current.filter(p => p.life > 0);
      for (const p of particlesRef.current) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.life -= p.decay;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.size * 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      
      if (tick < 100) {
        rafRef.current = requestAnimationFrame(loop);
      }
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [playing, skill, spawnParticle]);

  return <canvas ref={canvasRef} width={200} height={200} style={{ width: "100%", height: "100%", pointerEvents: "none" }} />;
}

// ============================================================
// ANIMATED PIXEL HERO (for showcase)
// ============================================================
function HeroCanvas({ animKey }) {
  const canvasRef = useRef(null);
  const frameRef = useRef(0);
  const rafRef = useRef(null);
  const anim = PLAYER_ANIMATIONS[animKey] || PLAYER_ANIMATIONS.idle_down;
  const dir = animKey.includes("up") ? "up" : animKey.includes("left") ? "left" : animKey.includes("right") ? "right" : "down";

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const interval = 1000 / anim.fps;
    let last = 0;

    const loop = (ts) => {
      if (ts - last >= interval) {
        last = ts;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Ground shadow
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(64, 110, 20, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        drawPixelHero(ctx, 64, 80, 2.5, dir, frameRef.current, animKey);
        
        frameRef.current = anim.loop
          ? (frameRef.current + 1) % anim.frames
          : Math.min(frameRef.current + 1, anim.frames - 1);
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [animKey, anim, dir]);

  return <canvas ref={canvasRef} width={128} height={128} style={{ imageRendering: "pixelated", width: 128, height: 128 }} />;
}

// ============================================================
// ENEMY CANVAS
// ============================================================
function EnemyCanvas({ enemy, state }) {
  const canvasRef = useRef(null);
  const frameRef = useRef(0);
  const rafRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let last = 0;
    const fps = state === "chase" ? 14 : state === "attack" ? 16 : 6;

    const loop = (ts) => {
      if (ts - last >= 1000 / fps) {
        last = ts;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 + 10;
        const f = frameRef.current;
        const bob = Math.sin(f * 0.6) * (state === "chase" ? 3 : state === "patrol" ? 2 : 1);
        const col = state === "hurt" ? "#ff6060" : state === "stunned" ? "#ffffaa" : state === "frozen" ? "#88ccff" :
                    state === "burned" ? "#ff6600" : state === "poisoned" ? "#80ff80" : state === "death" ? "#555" : enemy.color;

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath();
        ctx.ellipse(cx, cy + enemy.size / 2 + 5, enemy.size * 0.5, enemy.size * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(cx, cy + bob);
        ctx.fillStyle = col;
        ctx.shadowColor = state === "burned" ? "#ff6600" : state === "frozen" ? "#88ccff" : state === "poisoned" ? "#39ff14" : "transparent";
        ctx.shadowBlur = (state === "burned" || state === "frozen" || state === "poisoned") ? 15 : 0;

        if (enemy.id === "slime") {
          ctx.beginPath();
          ctx.arc(0, 0, enemy.size / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.3)";
          ctx.beginPath();
          ctx.arc(-4, -4, 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (enemy.id === "bat") {
          const wingFlap = Math.sin(f * 0.8) * 15;
          ctx.beginPath();
          ctx.arc(0, 0, enemy.size / 2 * 0.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(-enemy.size / 2, -5 + wingFlap * 0.3, 14, 8, -0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(enemy.size / 2, -5 - wingFlap * 0.3, 14, 8, 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ff4444";
          ctx.fillRect(-4, -enemy.size / 2 * 0.4, 3, 4);
          ctx.fillRect(1, -enemy.size / 2 * 0.4, 3, 4);
        } else {
          ctx.fillRect(-enemy.size * 0.35, -enemy.size * 0.4, enemy.size * 0.7, enemy.size * 0.6);
          ctx.fillRect(-enemy.size * 0.45, -enemy.size * 0.15, enemy.size * 0.15, enemy.size * 0.3);
          ctx.fillRect(enemy.size * 0.3, -enemy.size * 0.15, enemy.size * 0.15, enemy.size * 0.3);
          ctx.beginPath();
          ctx.arc(0, -enemy.size * 0.45, enemy.size * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#222";
          ctx.fillRect(-enemy.size * 0.12, -enemy.size * 0.52, enemy.size * 0.08, enemy.size * 0.08);
          ctx.fillRect(enemy.size * 0.04, -enemy.size * 0.52, enemy.size * 0.08, enemy.size * 0.08);
        }
        ctx.restore();
        frameRef.current++;
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [enemy, state]);

  return <canvas ref={canvasRef} width={100} height={100} style={{ imageRendering: "pixelated", width: 100, height: 100 }} />;
}

// ============================================================
// WORLD EFFECTS CANVAS
// ============================================================
function WorldCanvas({ effect }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let t = 0;
    const W = canvas.width, H = canvas.height;

    const loop = () => {
      ctx.clearRect(0, 0, W, H);
      t++;

      if (effect === "rain") {
        ctx.fillStyle = "#1a2e4a";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(150,180,220,0.7)";
        ctx.lineWidth = 1;
        for (let i = 0; i < 60; i++) {
          const x = (i * 17 + t * 3) % W;
          const y = (i * 13 + t * 8) % H;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 1, y + 8);
          ctx.stroke();
        }
      }
      if (effect === "snow") {
        ctx.fillStyle = "#1a2a3a";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#ffffff";
        for (let i = 0; i < 50; i++) {
          const x = (i * 23 + Math.sin(t * 0.02 + i) * 20) % W;
          const y = (i * 17 + t * 1.5) % H;
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      if (effect === "fire") {
        ctx.fillStyle = "#1a0000";
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 30; i++) {
          const x = W/2 + Math.sin(t * 0.05 + i) * 40 + (Math.random() - 0.5) * 20;
          const y = H - 30 - (i * 5 + t * 2) % 80;
          ctx.fillStyle = `rgba(255,${100 + Math.random() * 100},0,${0.5 + Math.random() * 0.5})`;
          ctx.beginPath();
          ctx.arc(x, y, 3 + Math.random() * 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      if (effect === "trees") {
        ctx.fillStyle = "#87CEEB";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#1a4a1a";
        ctx.fillRect(0, H - 20, W, 20);
        [30, 100, 180].forEach(tx => {
          ctx.fillStyle = "#5c3010";
          ctx.fillRect(tx - 3, 80, 6, 30);
          const sway = Math.sin(t * 0.03 + tx) * 3;
          ctx.fillStyle = "#1a6a1a";
          ctx.beginPath();
          ctx.moveTo(tx + sway, 50);
          ctx.lineTo(tx - 25, 90);
          ctx.lineTo(tx + 25, 90);
          ctx.closePath();
          ctx.fill();
        });
      }
      if (effect === "water") {
        const grad = ctx.createLinearGradient(0, 40, 0, H);
        grad.addColorStop(0, "#0050aa");
        grad.addColorStop(1, "#0080ff");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 40, W, H - 40);
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          for (let x = 0; x < W; x += 4) {
            ctx.lineTo(x, 55 + i * 18 + Math.sin((x / 30) + t * 0.05 + i) * 4);
          }
          ctx.stroke();
        }
      }

      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [effect]);

  return <canvas ref={canvasRef} width={220} height={150} style={{ width: "100%", height: "100%", borderRadius: 6 }} />;
}

// ============================================================
// FX SHOWCASE CANVAS
// ============================================================
function FXCanvas({ fx }) {
  const canvasRef = useRef(null);
  const particlesRef = useRef([]);
  const rafRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    let t = 0;

    const spawnParticle = (cfg) => {
      for (let i = 0; i < (cfg.count || 10); i++) {
        particlesRef.current.push({
          x: cfg.cx + (Math.random() - 0.5) * (cfg.spread || 20),
          y: cfg.cy + (Math.random() - 0.5) * (cfg.spread || 20),
          vx: (Math.random() - 0.5) * (cfg.speed || 3),
          vy: (Math.random() - 0.5) * (cfg.speed || 3),
          life: 1,
          decay: 0.02 + Math.random() * 0.03,
          color: cfg.colors ? cfg.colors[Math.floor(Math.random() * cfg.colors.length)] : "#fff",
          size: (cfg.minSize || 2) + Math.random() * (cfg.maxSize || 4),
        });
      }
    };

    const loop = () => {
      ctx.clearRect(0, 0, W, H);
      t++;

      if (fx === "shockwave" && t % 80 === 0) {
        spawnParticle({ cx: W/2, cy: H/2, count: 20, colors: ["#fff","#aaaaff","#8888ff"], spread: 5, speed: 3 });
      }
      if (fx === "explosion" && t % 90 === 0) {
        spawnParticle({ cx: W/2, cy: H/2, count: 60, colors: ["#ff4500","#ff8c00","#ffcc00","#fff","#ff2200"], spread: 5, speed: 5, minSize: 2, maxSize: 8 });
      }
      if (fx === "crit" && t % 60 === 0) {
        spawnParticle({ cx: W/2, cy: H/2, count: 25, colors: ["#ff2244","#ff8800","#ffff00","#ffffff"], spread: 15, speed: 4 });
      }
      if (fx === "magic_circle") {
        ctx.strokeStyle = `hsl(${260 + Math.sin(t*0.02)*20}, 80%, 70%)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(W/2, H/2, 40 + Math.sin(t*0.03)*10, 0, Math.PI*2);
        ctx.stroke();
      }
      if (fx === "aura") {
        for (let i = 0; i < 3; i++) {
          ctx.strokeStyle = `rgba(${100+i*50}, ${50+i*30}, ${200+i*20}, ${0.3 + Math.sin(t*0.05+i)*0.2})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(W/2, H/2, 25 + i*15 + Math.sin(t*0.04+i)*5, 0, Math.PI*2);
          ctx.stroke();
        }
      }

      particlesRef.current = particlesRef.current.filter(p => p.life > 0);
      for (const p of particlesRef.current) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [fx]);

  return <canvas ref={canvasRef} width={220} height={220} style={{ width: "100%", height: "100%", borderRadius: 8 }} />;
}

// ============================================================
// BOSS CANVAS
// ============================================================
function BossCanvas({ boss, phase }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    let t = 0;

    const loop = () => {
      ctx.clearRect(0, 0, W, H);
      t++;
      const cx = W / 2, cy = H / 2 + 10;
      const bossColor = phase === 2 ? (boss.id === "dragon" ? "#ff0000" : boss.id === "lich" ? "#cc00ff" : "#ff8c00") : boss.color;

      // Aura
      ctx.fillStyle = bossColor;
      ctx.globalAlpha = 0.15 + Math.sin(t * 0.05) * 0.08;
      ctx.beginPath();
      ctx.arc(cx, cy, boss.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Body
      ctx.fillStyle = bossColor;
      ctx.shadowColor = bossColor;
      ctx.shadowBlur = phase === 2 ? 30 : 10;

      if (boss.id === "dragon") {
        const wingFlap = Math.sin(t * 0.05) * 15;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx - boss.size * 0.8, cy - boss.size * 0.5 + wingFlap);
        ctx.lineTo(cx - boss.size * 0.6, cy + boss.size * 0.2);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + boss.size * 0.8, cy - boss.size * 0.5 - wingFlap);
        ctx.lineTo(cx + boss.size * 0.6, cy + boss.size * 0.2);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(cx - boss.size * 0.35, cy - boss.size * 0.35, boss.size * 0.7, boss.size * 0.55);
        ctx.beginPath();
        ctx.arc(cx, cy - boss.size * 0.42, boss.size * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = phase === 2 ? "#ff0000" : "#ffcc00";
        ctx.beginPath();
        ctx.arc(cx - 8, cy - boss.size * 0.48, 5, 0, Math.PI * 2);
        ctx.arc(cx + 8, cy - boss.size * 0.48, 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (boss.id === "lich") {
        ctx.beginPath();
        ctx.moveTo(cx, cy - boss.size * 0.45);
        ctx.lineTo(cx - boss.size * 0.4, cy + boss.size * 0.4);
        ctx.lineTo(cx + boss.size * 0.4, cy + boss.size * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#e8dcc8";
        ctx.beginPath();
        ctx.arc(cx, cy - boss.size * 0.5, boss.size * 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = phase === 2 ? "#ff0000" : "#8800ff";
        ctx.fillRect(cx - 10, cy - boss.size * 0.56, 7, 6);
        ctx.fillRect(cx + 3, cy - boss.size * 0.56, 7, 6);
      } else {
        ctx.fillRect(cx - boss.size * 0.4, cy - boss.size * 0.3, boss.size * 0.8, boss.size * 0.65);
        ctx.beginPath();
        ctx.arc(cx, cy - boss.size * 0.38, boss.size * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = phase === 2 ? "#ff4400" : "#ddcc88";
        ctx.fillRect(cx - 12, cy - boss.size * 0.44, 8, 6);
        ctx.fillRect(cx + 4, cy - boss.size * 0.44, 8, 6);
      }
      ctx.shadowBlur = 0;

      // Health bar
      const hpPct = phase === 2 ? 0.35 : 0.72;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(10, 10, W - 20, 12);
      ctx.fillStyle = phase === 2 ? "#ff0000" : "#ff4444";
      ctx.fillRect(10, 10, (W - 20) * hpPct, 12);
      ctx.fillStyle = "#fff";
      ctx.font = "8px Orbitron, monospace";
      ctx.fillText(boss.label.toUpperCase(), 12, 20);

      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [boss, phase]);

  return <canvas ref={canvasRef} width={220} height={200} style={{ width: "100%", height: "100%" }} />;
}

              <WorldGameplay onAnimationChange={setGameAnimation} />
              <div className="hud">
                ❤️ 100 | ⚔️ ATK 25 | 🛡️ DEF 10 | 🏃 {gameAnimation.replace(/_/g, " ").toUpperCase()}
              </div>
              <div className="controls-hint">WASD/Arrows = Move | SPACE = Attack | R = Run Toggle</div>
            </div>
            <div style={{ marginTop: 10, display: "flex", gap: 8, flexWrap: "wrap" }}>
              {ENEMY_DATA.map(e => (
                <span key={e.id} style={{
                  background: `${e.color}33`, border: `1px solid ${e.color}66`,
                  color: e.color, padding: "4px 10px", borderRadius: 12,
                  fontSize: 10, fontFamily: "Orbitron, monospace",
                }}>{e.label}</span>
              ))}
              <span style={{ color: "#5a3a8a", fontSize: 9, marginLeft: "auto" }}>
                Current: {PLAYER_ANIMATIONS[gameAnimation]?.label || "Idle Down"}
              </span>
            </div>
          </div>
        )}

        {/* ===== TAB 1: PLAYER ===== */}
        {tab === 1 && (
          <div style={{ display: "grid", gridTemplateColumns: "260px 1fr", gap: 20 }}>
            <div>
              <div style={{
                background: "linear-gradient(180deg, rgba(20,10,40,0.8) 0%, rgba(10,5,20,0.9) 100%)",
                border: "1px solid rgba(108,63,197,0.4)", borderRadius: 12, padding: 16,
                textAlign: "center",
              }}>
                <div style={{ fontSize: 9, fontFamily: "Orbitron, monospace", color: "#8060aa", letterSpacing: 2, marginBottom: 10 }}>LIVE PREVIEW</div>
                <div style={{
                  background: "radial-gradient(circle at 50% 60%, rgba(108,63,197,0.15) 0%, transparent 70%)",
                  borderRadius: 10, padding: 16, display: "inline-block",
                  border: "1px solid rgba(108,63,197,0.2)",
                }}>
                  <HeroCanvas animKey={playerAnim} />
                </div>
                <div style={{
                  fontFamily: "Orbitron, monospace", fontSize: 11, color: "#c090ff",
                  marginTop: 10, textTransform: "uppercase",
                }}>{PLAYER_ANIMATIONS[playerAnim]?.label}</div>
                <div style={{ fontSize: 8, color: "#5a3a8a", marginTop: 4 }}>
                  {PLAYER_ANIMATIONS[playerAnim]?.frames}f · {PLAYER_ANIMATIONS[playerAnim]?.fps}fps · {PLAYER_ANIMATIONS[playerAnim]?.loop ? "LOOP" : "ONE-SHOT"}
                </div>
              </div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {Object.entries(animGroups).map(([group, anims]) => (
                <div key={group} style={{ background: "rgba(10,5,20,0.7)", borderRadius: 8, padding: 12, border: "1px solid rgba(108,63,197,0.15)" }}>
                  <div style={{ fontSize: 9, fontFamily: "Orbitron, monospace", color: "#5a3a8a", letterSpacing: 1, marginBottom: 8 }}>
                    ◈ {group.toUpperCase()}
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                    {anims.map(key => (
                      <button key={key} onClick={() => setPlayerAnim(key)}
                        style={{
                          background: playerAnim === key ? "linear-gradient(135deg, #6c3fc5, #4a2090)" : "rgba(108,63,197,0.1)",
                          border: `1px solid ${playerAnim === key ? "#9060ff" : "rgba(108,63,197,0.3)"}`,
                          color: playerAnim === key ? "#fff" : "#8060a0",
                          padding: "4px 8px", borderRadius: 4, cursor: "pointer",
                          fontFamily: "Orbitron, monospace", fontSize: 8,
                          transition: "all 0.15s",
                        }}
                      >{PLAYER_ANIMATIONS[key]?.label}</button>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ===== TAB 2: SKILLS ===== */}
        {tab === 2 && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            {Object.entries(SKILL_DATA).map(([id, sk]) => {
              const isSelected = selectedSkill === id;
              return (
                <div key={id} onClick={() => setSelectedSkill(id)}
                  style={{
                    background: isSelected ? "rgba(10,5,20,0.9)" : "rgba(10,5,20,0.6)",
                    border: `1px solid ${isSelected ? sk.color + "88" : "rgba(108,63,197,0.2)"}`,
                    borderRadius: 10, padding: 14, cursor: "pointer",
                    transition: "all 0.2s",
                    boxShadow: isSelected ? `0 0 15px ${sk.color}33` : "none",
                  }}>
                  <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
                    <div style={{ position: "relative", width: 100, height: 100, flexShrink: 0 }}>
                      <div style={{ width: "100%", height: "100%", background: "rgba(0,0,0,0.5)", borderRadius: 8, border: `1px solid ${sk.color}44` }}>
                        <SkillCanvas skill={id} playing={isSelected && skillPlaying} key={`${id}-${skillTick}`} />
                      </div>
                      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, pointerEvents: "none" }}>
                        {sk.icon}
                      </div>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: "Orbitron, monospace", color: sk.color, fontSize: 11, fontWeight: 700 }}>
                        {sk.label}
                      </div>
                      <div style={{ fontSize: 9, color: "#6040a0", marginTop: 4 }}>{sk.desc}</div>
                      {isSelected && (
                        <button onClick={(e) => { e.stopPropagation(); playSkill(); }}
                          style={{
                            marginTop: 8, background: `linear-gradient(135deg, ${sk.color}, ${sk.glow})`,
                            border: "none", color: "#000", padding: "5px 12px",
                            borderRadius: 4, cursor: "pointer", fontFamily: "Orbitron, monospace",
                            fontSize: 8, fontWeight: 700,
                          }}>▶ CAST</button>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ===== TAB 3: ENEMIES ===== */}
        {tab === 3 && (
          <div>
            <div style={{ fontSize: 9, fontFamily: "Orbitron, monospace", color: "#5a3a8a", letterSpacing: 1, marginBottom: 12 }}>◈ SELECT STATE TO PREVIEW</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 12 }}>
              {ENEMY_DATA.map(enemy => {
                const st = enemyStates[enemy.id] || "idle";
                const STATES = ["spawn","idle","patrol","walk","chase","attack","hurt","stunned","frozen","burned","death"];
                return (
                  <div key={enemy.id} style={{
                    background: "rgba(10,5,20,0.8)", border: "1px solid rgba(108,63,197,0.2)",
                    borderRadius: 10, padding: 12,
                  }}>
                    <div style={{ textAlign: "center" }}>
                      <EnemyCanvas enemy={enemy} state={st} />
                    </div>
                    <div style={{ fontFamily: "Orbitron, monospace", color: "#c090ff", fontSize: 10, textAlign: "center", margin: "6px 0" }}>
                      {enemy.label}
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 3 }}>
                      {STATES.map(s => (
                        <button key={s} onClick={() => setEnemyStates(prev => ({ ...prev, [enemy.id]: s }))}
                          style={{
                            background: st === s ? `${enemy.color}44` : "rgba(108,63,197,0.1)",
                            border: `1px solid ${st === s ? enemy.color : "rgba(108,63,197,0.2)"}`,
                            color: st === s ? "#fff" : "#6040a0",
                            padding: "2px 5px", borderRadius: 3, cursor: "pointer",
                            fontFamily: "Orbitron, monospace", fontSize: 7,
                          }}>{s}</button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ===== TAB 4: BOSSES ===== */}
        {tab === 4 && (
          <div>
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {BOSS_DATA.map(b => (
                <button key={b.id} onClick={() => setSelectedBoss(b)}
                  style={{
                    background: selectedBoss.id === b.id ? `linear-gradient(135deg, ${b.color}66, ${b.color}33)` : "rgba(10,5,20,0.7)",
                    border: `1px solid ${selectedBoss.id === b.id ? b.color : "rgba(108,63,197,0.3)"}`,
                    color: selectedBoss.id === b.id ? "#fff" : "#8060a0",
                    padding: "6px 14px", borderRadius: 6, cursor: "pointer",
                    fontFamily: "Orbitron, monospace", fontSize: 9,
                  }}>{b.label}</button>
              ))}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "240px 1fr", gap: 20 }}>
              <div style={{
                background: "rgba(10,5,20,0.9)", border: `1px solid ${selectedBoss.color}44`,
                borderRadius: 10, overflow: "hidden",
              }}>
                <BossCanvas boss={selectedBoss} phase={bossPhase} />
              </div>
              <div>
                <div style={{ background: "rgba(10,5,20,0.8)", borderRadius: 8, padding: 14, border: "1px solid rgba(108,63,197,0.2)" }}>
                  <div style={{ fontFamily: "Orbitron, monospace", fontSize: 12, color: selectedBoss.color, fontWeight: 700 }}>
                    {selectedBoss.label.toUpperCase()}
                  </div>
                  <div style={{ marginTop: 10 }}>
                    <div style={{ fontSize: 8, color: "#5a3a8a", fontFamily: "Orbitron, monospace", letterSpacing: 1, marginBottom: 6 }}>PHASE</div>
                    <div style={{ display: "flex", gap: 6 }}>
                      {[1, 2].map(p => (
                        <button key={p} onClick={() => setBossPhase(p)}
                          style={{
                            background: bossPhase === p ? "linear-gradient(135deg, #6c3fc5, #4a2090)" : "rgba(108,63,197,0.1)",
                            border: `1px solid ${bossPhase === p ? "#9060ff" : "rgba(108,63,197,0.3)"}`,
                            color: bossPhase === p ? "#fff" : "#6040a0",
                            padding: "5px 16px", borderRadius: 4, cursor: "pointer",
                            fontFamily: "Orbitron, monospace", fontSize: 9,
                          }}>Phase {p}{p === 2 ? " 🔥" : ""}</button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ===== TAB 5: NPCs & Pets ===== */}
        {tab === 5 && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <div style={{ background: "rgba(10,5,20,0.8)", borderRadius: 10, padding: 16, border: "1px solid rgba(108,63,197,0.2)" }}>
              <div style={{ fontFamily: "Orbitron, monospace", color: "#c090ff", fontSize: 11, letterSpacing: 1, marginBottom: 12 }}>◈ NPC ANIMATIONS</div>
              {NPC_ANIMS.map(anim => (
                <div key={anim} style={{
                  display: "flex", alignItems: "center", gap: 10,
                  padding: "8px 0", borderBottom: "1px solid rgba(108,63,197,0.1)",
                }}>
                  <div style={{
                    width: 28, height: 28, borderRadius: 4,
                    background: "linear-gradient(135deg, #3060a0, #204080)",
                    display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14,
                  }}>
                    {anim === "Idle" ? "🧍" : anim === "Walking" ? "🚶" : anim === "Talking" ? "💬" : anim === "Waving" ? "👋" : anim === "Sitting" ? "🪑" : anim === "Working" ? "⚒️" : "🤝"}
                  </div>
                  <div>
                    <div style={{ color: "#c090ff", fontSize: 11, fontFamily: "Orbitron, monospace" }}>{anim}</div>
                    <div style={{ fontSize: 8, color: "#5a3a8a" }}>Smooth looping</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ background: "rgba(10,5,20,0.8)", borderRadius: 10, padding: 16, border: "1px solid rgba(108,63,197,0.2)" }}>
              <div style={{ fontFamily: "Orbitron, monospace", color: "#c090ff", fontSize: 11, letterSpacing: 1, marginBottom: 12 }}>◈ PET ANIMATIONS</div>
              {PET_ANIMS.map(anim => (
                <div key={anim} style={{
                  display: "flex", alignItems: "center", gap: 10,
                  padding: "8px 0", borderBottom: "1px solid rgba(108,63,197,0.1)",
                }}>
                  <div style={{
                    width: 28, height: 28, borderRadius: 4,
                    background: "linear-gradient(135deg, #206040, #104020)",
                    display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14,
                  }}>
                    {anim === "Follow" ? "🐾" : anim === "Idle" ? "🐱" : anim === "Attack" ? "⚔️" : anim === "Skill" ? "✨" : anim === "Happy" ? "💖" : "⬆️"}
                  </div>
                  <div>
                    <div style={{ color: "#c090ff", fontSize: 11, fontFamily: "Orbitron, monospace" }}>{anim}</div>
                    <div style={{ fontSize: 8, color: "#5a3a8a" }}>{anim === "Level Up" ? "One-shot" : "Looping"}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ===== TAB 6: WORLD & UI ===== */}
        {tab === 6 && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <div>
              <div style={{ fontFamily: "Orbitron, monospace", color: "#c090ff", fontSize: 11, letterSpacing: 1, marginBottom: 10 }}>◈ WORLD EFFECTS</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 10 }}>
                {WORLD_EFFECTS.map(e => (
                  <button key={e} onClick={() => setWorldEffect(e)}
                    style={{
                      background: worldEffect === e ? "linear-gradient(135deg, #6c3fc5, #4a2090)" : "rgba(108,63,197,0.1)",
                      border: `1px solid ${worldEffect === e ? "#9060ff" : "rgba(108,63,197,0.3)"}`,
                      color: worldEffect === e ? "#fff" : "#6040a0",
                      padding: "4px 10px", borderRadius: 4, cursor: "pointer",
                      fontFamily: "Orbitron, monospace", fontSize: 8,
                      textTransform: "capitalize",
                    }}>{e}</button>
                ))}
              </div>
              <div style={{ height: 150, background: "rgba(0,0,0,0.5)", borderRadius: 8, overflow: "hidden", border: "1px solid rgba(108,63,197,0.2)" }}>
                <WorldCanvas effect={worldEffect} />
              </div>
            </div>
            <div>
              <div style={{ fontFamily: "Orbitron, monospace", color: "#c090ff", fontSize: 11, letterSpacing: 1, marginBottom: 10 }}>◈ UI ANIMATIONS</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {["Quest","Damage","Level Up","Achievement"].map(b => (
                  <button key={b} style={{
                    background: "linear-gradient(135deg, #6c3fc5 0%, #4a2090 100%)",
                    color: "#fff", border: "1px solid #9060ff",
                    padding: "6px 12px", borderRadius: 4, cursor: "pointer",
                    fontFamily: "Orbitron, monospace", fontSize: 9,
                  }}>{b}</button>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ===== TAB 7: FX SHOWCASE ===== */}
        {tab === 7 && (
          <div>
            <div style={{ fontFamily: "Orbitron, monospace", color: "#c090ff", fontSize: 11, letterSpacing: 1, marginBottom: 12 }}>◈ VISUAL EFFECTS</div>
            <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 16 }}>
              {FX_TYPES.map(fx => (
                <button key={fx.id} onClick={() => setFxType(fx.id)}
                  style={{
                    background: fxType === fx.id ? "linear-gradient(135deg, #6c3fc5, #4a2090)" : "rgba(108,63,197,0.1)",
                    border: `1px solid ${fxType === fx.id ? "#9060ff" : "rgba(108,63,197,0.3)"}`,
                    color: fxType === fx.id ? "#fff" : "#6040a0",
                    padding: "5px 12px", borderRadius: 4, cursor: "pointer",
                    fontFamily: "Orbitron, monospace", fontSize: 8,
                  }}>{fx.label}</button>
              ))}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "240px 1fr", gap: 20 }}>
              <div style={{
                height: 240, background: "rgba(0,0,0,0.7)", borderRadius: 10, overflow: "hidden",
                border: "1px solid rgba(108,63,197,0.3)",
              }}>
                <FXCanvas fx={fxType} key={fxType} />
              </div>
              <div style={{ background: "rgba(10,5,20,0.8)", borderRadius: 10, padding: 16, border: "1px solid rgba(108,63,197,0.2)" }}>
                <div style={{ fontFamily: "Orbitron, monospace", color: "#c090ff", fontSize: 12, marginBottom: 12 }}>
                  {FX_TYPES.find(f => f.id === fxType)?.label}
                </div>
                {["GPU Canvas 2D","Particle System","Glow Effects","Animation Loop"].map(f => (
                  <div key={f} style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 0" }}>
                    <div style={{ width: 4, height: 4, borderRadius: "50%", background: "#9060ff" }} />
                    <span style={{ fontSize: 10, color: "#8060a0" }}>{f}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{
        borderTop: "1px solid rgba(108,63,197,0.2)",
        padding: "10px 20px",
        display: "flex", justifyContent: "space-between", alignItems: "center",
        background: "rgba(0,0,0,0.3)",
      }}>
        <span style={{ fontSize: 8, color: "#3a2060", fontFamily: "Orbitron, monospace", letterSpacing: 1 }}>
          {Object.keys(PLAYER_ANIMATIONS).length} STATES · {Object.keys(SKILL_DATA).length} SKILLS · {ENEMY_DATA.length} ENEMIES · {BOSS_DATA.length} BOSSES
        </span>
        <div style={{ display: "flex", gap: 4 }}>
          {["#6c3fc5","#f5a623","#00d4ff","#39ff14","#ff2244"].map(c => (
            <div key={c} style={{ width: 6, height: 6, borderRadius: "50%", background: c, boxShadow: `0 0 4px ${c}` }} />
          ))}
        </div>
      </div>
    </div>
  );
}

// Render app
ReactDOM.render(<RPGAnimationSystem />, document.getElementById("root"));
</script>
</body>
</html>
