<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=landscape">
  <title>STRIKER LEGENDS · MOBILE FIGHTING</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      // ==================== SCREEN MANAGEMENT ====================
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createButtons(); // Recreate buttons on resize
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ==================== AUDIO SYSTEM ====================
      let audioCtx = null;
      
      function initAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {}
      }

      function playSound(freq, type, duration, vol) {
        if (!audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || 'square';
          osc.frequency.value = freq || 440;
          gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
      }

      function sfxSelect() { playSound(800, 'sine', 0.1, 0.15); }
      function sfxPunch() { playSound(120, 'square', 0.1, 0.15); }
      function sfxKick() { playSound(60, 'sawtooth', 0.12, 0.18); }
      function sfxSpecial() { playSound(350, 'sawtooth', 0.2, 0.25); }
      function sfxUltimate() { playSound(40, 'sawtooth', 0.4, 0.3); playSound(600, 'square', 0.2, 0.2); }
      function sfxHit() { playSound(180, 'triangle', 0.08, 0.1); }
      function sfxBlock() { playSound(250, 'triangle', 0.05, 0.08); }
      function sfxJump() { playSound(400, 'sine', 0.08, 0.12); }
      function sfxRoll() { playSound(200, 'sine', 0.06, 0.1); }

      // ==================== GAME DATA ====================
      const FIGHTERS = [
        { id:0, name:'RYU', style:'Karate', color:'#e74c3c', hp:100, spd:6, atk:12, def:8 },
        { id:1, name:'NINJA', style:'Ninjutsu', color:'#2c3e50', hp:85, spd:9, atk:10, def:5 },
        { id:2, name:'BOXER', style:'Boxing', color:'#f39c12', hp:95, spd:7, atk:14, def:7 },
        { id:3, name:'TIGER', style:'Muay Thai', color:'#e67e22', hp:90, spd:8, atk:13, def:6 },
        { id:4, name:'GRAP', style:'Wrestling', color:'#9b59b6', hp:110, spd:5, atk:15, def:10 },
        { id:5, name:'SAMU', style:'Kenjutsu', color:'#7d3c98', hp:100, spd:6, atk:12, def:9 },
        { id:6, name:'REAP', style:'Assassin', color:'#1a1a1a', hp:80, spd:10, atk:11, def:4 },
        { id:7, name:'MONK', style:'Kung Fu', color:'#f1c40f', hp:90, spd:8, atk:10, def:8 },
        { id:8, name:'CYBO', style:'Tech', color:'#3498db', hp:105, spd:5, atk:14, def:9 },
        { id:9, name:'BEAST', style:'Wild', color:'#27ae60', hp:95, spd:7, atk:13, def:7 },
        { id:10, name:'MAGE', style:'Magic', color:'#8e44ad', hp:80, spd:7, atk:16, def:5 },
        { id:11, name:'DRAG', style:'Dragon', color:'#c0392b', hp:100, spd:6, atk:15, def:8 }
      ];

      const STAGES = [
        { name:'City', sky:'#1a1a2e', ground:'#2c3e50' },
        { name:'Temple', sky:'#3e2723', ground:'#4e342e' },
        { name:'Forest', sky:'#1b5e20', ground:'#2e7d32' },
        { name:'Dojo', sky:'#bf360c', ground:'#d84315' },
        { name:'Volcano', sky:'#b71c1c', ground:'#c62828' },
        { name:'Snow', sky:'#90a4ae', ground:'#b0bec5' },
        { name:'Neon', sky:'#1a237e', ground:'#283593' }
      ];

      // ==================== GAME STATE ====================
      const STATE = { MENU:0, SELECT:1, FIGHT:2 };
      let gameState = STATE.MENU;
      let menuOption = 0;
      let selP1 = 0;
      let selP2 = 1;
      let currentStage = STAGES[0];
      let frame = 0;
      let shakeTimer = 0;
      let slowmoTimer = 0;
      let particles = [];
      let winner = null;
      let winTimer = 0;

      // ==================== FIGHTER CLASS ====================
      class Fighter {
        constructor(data, x, dir) {
          this.data = data;
          this.x = x;
          this.y = 0;
          this.groundY = 0;
          this.w = 70;
          this.h = 100;
          this.hp = data.hp;
          this.maxHp = data.hp;
          this.energy = 0;
          this.ultra = 0;
          this.dir = dir;
          this.vx = 0;
          this.vy = 0;
          this.grounded = true;
          this.blocking = false;
          this.rolling = false;
          this.rollCD = 0;
          this.atkCD = 0;
          this.stun = 0;
          this.specialCD = 0;
          this.state = 'idle';
          this.animFrame = 0;
          this.invincible = false;
        }
        
        update() {
          if (this.stun > 0) this.stun--;
          if (this.atkCD > 0) this.atkCD--;
          if (this.specialCD > 0) this.specialCD--;
          if (this.rollCD > 0) this.rollCD--;
          
          this.x += this.vx;
          
          if (!this.grounded) {
            this.vy += 0.9;
            this.y += this.vy;
            if (this.y >= this.groundY) {
              this.y = this.groundY;
              this.vy = 0;
              this.grounded = true;
              this.rolling = false;
              this.invincible = false;
            }
          }
          
          // Roll invincibility frames
          if (this.rolling && this.grounded) {
            this.invincible = true;
          } else if (!this.rolling) {
            this.invincible = false;
          }
          
          // Stop roll movement
          if (this.rolling && this.grounded && this.vx !== 0) {
            this.rolling = false;
            this.vx = 0;
            this.invincible = false;
          }
          
          if (this.x < 20) this.x = 20;
          if (this.x > canvas.width - 90) this.x = canvas.width - 90;
          
          if (this.atkCD <= 0 && this.stun <= 0) {
            if (this.state !== 'roll') this.state = 'idle';
          }
          
          this.animFrame++;
        }
        
        jump() {
          if (this.grounded && !this.rolling) {
            this.vy = -12;
            this.grounded = false;
            this.state = 'jump';
            sfxJump();
          }
        }
        
        roll() {
          if (this.grounded && this.rollCD <= 0 && !this.rolling) {
            this.rolling = true;
            this.rollCD = 30;
            this.invincible = true;
            this.vx = this.dir * 8;
            this.state = 'roll';
            sfxRoll();
          }
        }
        
        hit(dmg, kb) {
          if (this.invincible) return;
          if (this.blocking) {
            dmg *= 0.2;
            sfxBlock();
            spawnParticles(this.x + 35, this.y + 40, 8, '#3498db');
          } else {
            sfxHit();
            spawnParticles(this.x + 35, this.y + 40, 12, '#fff');
          }
          dmg = dmg * (1 - this.data.def / 120);
          this.hp = Math.max(0, this.hp - dmg);
          this.energy = Math.min(100, this.energy + dmg * 0.5);
          this.ultra = Math.min(100, this.ultra + dmg * 0.8);
          this.stun = 14;
          this.rolling = false;
          this.invincible = false;
          if (kb && !this.blocking) {
            this.vx = kb * 7;
            this.vy = -4;
            this.grounded = false;
          }
        }
        
        draw(ctx) {
          ctx.save();
          const sx = shakeTimer > 0 ? (Math.random() - 0.5) * 8 : 0;
          const sy = shakeTimer > 0 ? (Math.random() - 0.5) * 6 : 0;
          ctx.translate(this.x + sx, this.y + sy);
          
          // Flip based on direction
          if (this.dir < 0) {
            ctx.translate(this.w, 0);
            ctx.scale(-1, 1);
          }
          
          // Invincibility flash
          if (this.invincible && Math.floor(this.animFrame / 3) % 2 === 0) {
            ctx.globalAlpha = 0.5;
          }
          
          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.beginPath();
          ctx.ellipse(35, this.h + 2, 25, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          
          // Legs
          ctx.fillStyle = '#333';
          ctx.fillRect(10, this.h - 25, 15, 25);
          ctx.fillRect(this.w - 25, this.h - 25, 15, 25);
          
          // Feet
          ctx.fillStyle = '#1a1a1a';
          ctx.fillRect(5, this.h - 5, 20, 8);
          ctx.fillRect(this.w - 25, this.h - 5, 20, 8);
          
          // Body
          const bodyGrad = ctx.createLinearGradient(0, 20, this.w, 20);
          bodyGrad.addColorStop(0, this.data.color);
          bodyGrad.addColorStop(1, this.adjustColor(this.data.color, -30));
          ctx.fillStyle = bodyGrad;
          
          // Torso shape
          ctx.beginPath();
          ctx.moveTo(15, 20);
          ctx.lineTo(this.w - 15, 20);
          ctx.lineTo(this.w - 10, 55);
          ctx.lineTo(this.w - 10, this.h - 25);
          ctx.lineTo(10, this.h - 25);
          ctx.lineTo(10, 55);
          ctx.closePath();
          ctx.fill();
          
          // Belt
          ctx.fillStyle = '#f1c40f';
          ctx.fillRect(8, 52, this.w - 16, 6);
          
          // Arms
          if (this.state === 'punch') {
            ctx.fillStyle = this.data.color;
            ctx.fillRect(-25, 22, 28, 12);
            ctx.fillRect(this.w - 3, 45, 18, 12);
          } else if (this.state === 'kick') {
            ctx.fillStyle = this.data.color;
            ctx.fillRect(5, 22, 16, 12);
            ctx.fillRect(this.w - 5, 60, 28, 12);
          } else if (this.state === 'special') {
            ctx.fillStyle = '#ff0';
            ctx.fillRect(-15, 22, 20, 12);
            ctx.fillRect(this.w - 5, 22, 20, 12);
          } else {
            ctx.fillStyle = this.data.color;
            ctx.fillRect(-8, 22, 16, 12);
            ctx.fillRect(this.w - 8, 22, 16, 12);
          }
          
          // Fists
          ctx.fillStyle = '#ffdbac';
          [-8, this.w - 8].forEach(armX => {
            ctx.beginPath();
            ctx.arc(armX + 8, 28, 6, 0, Math.PI * 2);
            ctx.fill();
          });
          
          // Head
          ctx.fillStyle = '#ffdbac';
          ctx.beginPath();
          ctx.arc(this.w / 2, 8, 16, 0, Math.PI * 2);
          ctx.fill();
          
          // Hair
          ctx.fillStyle = '#2c3e50';
          ctx.beginPath();
          ctx.arc(this.w / 2, 2, 17, Math.PI, 0);
          ctx.fill();
          
          // Eyes
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(this.w / 2 - 5, 6, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(this.w / 2 + 5, 6, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = this.state === 'ultimate' ? '#f00' : '#000';
          ctx.beginPath();
          ctx.arc(this.w / 2 - 5 + this.dir * 1, 6, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(this.w / 2 + 5 + this.dir * 1, 6, 2.5, 0, Math.PI * 2);
          ctx.fill();
          
          // Mouth
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(this.w / 2, 14, 3, 0.1, Math.PI - 0.1);
          ctx.stroke();
          
          // Effects
          if (this.blocking) {
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(this.w / 2, this.h / 2, this.w * 0.7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          
          if (this.state === 'special') {
            ctx.shadowColor = '#ff0';
            ctx.shadowBlur = 20;
          }
          if (this.state === 'ultimate') {
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 30;
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(this.w / 2, this.h / 2, this.w * 0.8, 0, Math.PI * 2);
            ctx.stroke();
          }
          
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;
          ctx.restore();
        }
        
        adjustColor(hex, amount) {
          let r = parseInt(hex.slice(1,3), 16) + amount;
          let g = parseInt(hex.slice(3,5), 16) + amount;
          let b = parseInt(hex.slice(5,7), 16) + amount;
          r = Math.max(0, Math.min(255, r));
          g = Math.max(0, Math.min(255, g));
          b = Math.max(0, Math.min(255, b));
          return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
        }
      }

      // ==================== PLAYERS ====================
      let p1 = null;
      let p2 = null;

      function createPlayers() {
        const f1 = FIGHTERS[selP1];
        const f2 = FIGHTERS[selP2];
        p1 = new Fighter(f1, canvas.width * 0.2, 1);
        p2 = new Fighter(f2, canvas.width * 0.7, -1);
        p1.groundY = canvas.height - 130;
        p2.groundY = canvas.height - 130;
        p1.y = p1.groundY;
        p2.y = p2.groundY;
        particles = [];
        shakeTimer = 0;
        slowmoTimer = 0;
        winner = null;
        winTimer = 0;
        createButtons();
      }

      // ==================== TOUCH BUTTONS ====================
      let buttons = [];

      function createButtons() {
        const w = canvas.width;
        const h = canvas.height;
        const bs = Math.min(70, h * 0.13);
        const ss = Math.min(50, h * 0.09);
        const gap = 8;
        
        buttons = [
          // Movement
          { id:'left',   x:gap, y:h-bs-gap, w:bs, h:bs, label:'◀', color:'#333' },
          { id:'right',  x:gap*2+bs, y:h-bs-gap, w:bs, h:bs, label:'▶', color:'#333' },
          { id:'jump',   x:gap, y:h-bs*2-gap*2, w:bs, h:bs, label:'⬆', color:'#2ecc71' },
          { id:'roll',   x:gap*2+bs, y:h-bs*2-gap*2, w:bs, h:bs, label:'↪', color:'#1abc9c' },
          { id:'block',  x:gap*3+bs*2, y:h-ss-gap, w:bs*0.8, h:ss, label:'🛡', color:'#2980b9' },
          // Attacks
          { id:'punch',  x:w-bs*2-gap*2, y:h-bs-gap, w:bs, h:bs, label:'👊', color:'#c0392b' },
          { id:'kick',   x:w-bs-gap, y:h-bs-gap, w:bs, h:bs, label:'🦵', color:'#d35400' },
          { id:'special',x:w-bs*2-gap*2, y:h-bs*2-gap*2, w:bs, h:ss, label:'⚡', color:'#8e44ad' },
          { id:'ultra',  x:w-bs-gap, y:h-bs*2-gap*2, w:bs, h:ss, label:'💥', color:'#f39c12' }
        ];
      }

      function getButton(x, y) {
        return buttons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
      }

      function doAction(id) {
        if (!p1 || p1.stun > 0) return;
        if (winner) return;
        switch(id) {
          case 'left': p1.vx = -5; p1.dir = -1; break;
          case 'right': p1.vx = 5; p1.dir = 1; break;
          case 'jump': p1.jump(); break;
          case 'roll': p1.roll(); break;
          case 'block': p1.blocking = true; p1.vx = 0; break;
          case 'punch':
            if (p1.atkCD <= 0) {
              p1.atkCD = 10; p1.state = 'punch';
              sfxPunch();
              attack(p1, p2, 8);
            }
            break;
          case 'kick':
            if (p1.atkCD <= 0) {
              p1.atkCD = 14; p1.state = 'kick';
              sfxKick();
              attack(p1, p2, 13);
            }
            break;
          case 'special':
            if (p1.specialCD <= 0 && p1.energy >= 25) {
              p1.energy -= 25; p1.specialCD = 40; p1.state = 'special';
              sfxSpecial();
              attack(p1, p2, 20);
              spawnParticles(p2.x + 35, p2.y + 40, 25, '#ff0');
              shakeTimer = 10;
            }
            break;
          case 'ultra':
            if (p1.ultra >= 90) {
              p1.ultra = 0; p1.state = 'ultimate';
              sfxUltimate();
              attack(p1, p2, 40);
              spawnParticles(p2.x + 35, p2.y + 40, 40, '#f00');
              shakeTimer = 20;
              slowmoTimer = 15;
            }
            break;
        }
      }

      function attack(atk, def, dmg) {
        const dist = Math.abs(atk.x - def.x);
        if (dist < 120) {
          const dir = atk.dir;
          def.hit(dmg * (atk.data.atk / 10), dir);
        }
      }

      function spawnParticles(x, y, n, color) {
        for (let i = 0; i < n; i++) {
          particles.push({
            x, y, color,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 4,
            life: 20 + Math.random() * 20,
            size: 2 + Math.random() * 6
          });
        }
      }

      // ==================== AI ====================
      function aiThink() {
        if (!p2 || p2.stun > 0) return;
        if (winner) return;
        if (frame % 12 !== 0) return;
        
        const dx = p1.x - p2.x;
        const dist = Math.abs(dx);
        p2.dir = dx > 0 ? 1 : -1;
        p2.vx = 0;
        p2.blocking = false;
        
        if (dist < 80) {
          if (Math.random() < 0.25) p2.blocking = true;
          if (Math.random() < 0.2) p2.jump();
          if (Math.random() < 0.15) p2.roll();
          if (p2.atkCD <= 0 && Math.random() < 0.4) aiAttack(Math.random() < 0.6 ? 'punch' : 'kick');
        } else if (dist < 220) {
          p2.vx = (dx > 0 ? 1 : -1) * 3.5;
          if (p2.atkCD <= 0 && Math.random() < 0.25) aiAttack('punch');
          if (p2.specialCD <= 0 && p2.energy >= 25 && Math.random() < 0.15) aiAttack('special');
        } else {
          p2.vx = (dx > 0 ? 1 : -1) * 4.5;
          if (Math.random() < 0.1) p2.roll();
        }
        
        if (p2.ultra >= 85 && Math.random() < 0.08) aiAttack('ultra');
      }

      function aiAttack(type) {
        if (!p2 || p2.stun > 0) return;
        const dist = Math.abs(p1.x - p2.x);
        if (dist > 130 && type !== 'ultra') return;
        
        switch(type) {
          case 'punch':
            if (p2.atkCD <= 0) { p2.atkCD = 10; p2.state = 'punch'; attack(p2, p1, 7); }
            break;
          case 'kick':
            if (p2.atkCD <= 0) { p2.atkCD = 14; p2.state = 'kick'; attack(p2, p1, 11); }
            break;
          case 'special':
            if (p2.specialCD <= 0 && p2.energy >= 25) {
              p2.energy -= 25; p2.specialCD = 40; p2.state = 'special';
              attack(p2, p1, 18);
              spawnParticles(p1.x + 35, p1.y + 40, 25, '#ff0');
            }
            break;
          case 'ultra':
            if (p2.ultra >= 85) {
              p2.ultra = 0; p2.state = 'ultimate';
              attack(p2, p1, 38);
              spawnParticles(p1.x + 35, p1.y + 40, 40, '#f00');
              shakeTimer = 20;
              slowmoTimer = 15;
            }
            break;
        }
      }

      // ==================== DRAWING ====================
      function drawStage() {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, currentStage.sky);
        grad.addColorStop(1, currentStage.ground);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Ground with details
        ctx.fillStyle = currentStage.ground;
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        
        // Ground line
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 100);
        ctx.lineTo(canvas.width, canvas.height - 100);
        ctx.stroke();
        
        // Ground texture lines
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 60) {
          ctx.beginPath();
          ctx.moveTo(i, canvas.height - 100);
          ctx.lineTo(i + 30, canvas.height);
          ctx.stroke();
        }
      }

      function drawUI() {
        if (!p1 || !p2) return;
        const bw = Math.min(300, canvas.width * 0.3);
        const bh = 22;
        const y = 15;
        
        // P1 HP bar
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(10, y - 2, bw + 4, bh + 4);
        ctx.fillStyle = '#333';
        ctx.fillRect(12, y, bw, bh);
        const hp1Ratio = p1.hp / p1.maxHp;
        const hp1Grad = ctx.createLinearGradient(12, 0, 12 + bw * hp1Ratio, 0);
        hp1Grad.addColorStop(0, hp1Ratio > 0.5 ? '#2ecc71' : '#e74c3c');
        hp1Grad.addColorStop(1, hp1Ratio > 0.5 ? '#27ae60' : '#c0392b');
        ctx.fillStyle = hp1Grad;
        ctx.fillRect(12, y, bw * hp1Ratio, bh);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(12, y, bw, bh);
        
        // P1 name
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Arial';
        ctx.fillText(p1.data.name, 12, y - 8);
        
        // P1 meters
        ctx.font = '11px Arial';
        ctx.fillText('⚡' + Math.floor(p1.energy) + '%', 12, y + bh + 15);
        ctx.fillText('💥' + Math.floor(p1.ultra) + '%', 12, y + bh + 30);
        
        // P2 HP bar
        const px = canvas.width - bw - 12;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(px - 2, y - 2, bw + 4, bh + 4);
        ctx.fillStyle = '#333';
        ctx.fillRect(px, y, bw, bh);
        const hp2Ratio = p2.hp / p2.maxHp;
        const hp2Grad = ctx.createLinearGradient(px, 0, px + bw * hp2Ratio, 0);
        hp2Grad.addColorStop(0, hp2Ratio > 0.5 ? '#2ecc71' : '#e74c3c');
        hp2Grad.addColorStop(1, hp2Ratio > 0.5 ? '#27ae60' : '#c0392b');
        ctx.fillStyle = hp2Grad;
        ctx.fillRect(px, y, bw * hp2Ratio, bh);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(px, y, bw, bh);
        
        // P2 name
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'right';
        ctx.fillText(p2.data.name, canvas.width - 12, y - 8);
        
        // P2 meters
        ctx.font = '11px Arial';
        ctx.fillText('⚡' + Math.floor(p2.energy) + '%', canvas.width - 12, y + bh + 15);
        ctx.fillText('💥' + Math.floor(p2.ultra) + '%', canvas.width - 12, y + bh + 30);
        ctx.textAlign = 'left';
        
        // VS text
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 35px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('VS', canvas.width / 2, y + 30);
        ctx.textAlign = 'left';
      }

      function drawButtons() {
        buttons.forEach(b => {
          // Button shadow
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(b.x + 2, b.y + 2, b.w, b.h);
          
          // Button body
          ctx.fillStyle = b.color;
          ctx.globalAlpha = 0.6;
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.globalAlpha = 1;
          
          // Button border
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.strokeRect(b.x, b.y, b.w, b.h);
          
          // Button label
          ctx.fillStyle = '#fff';
          ctx.font = Math.floor(b.h * 0.4) + 'px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
        });
      }

      function drawMenu() {
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Animated background
        for (let i = 0; i < 20; i++) {
          const x = (frame * 0.5 + i * 130) % (canvas.width + 200) - 100;
          const y = canvas.height * 0.5 + Math.sin(frame * 0.02 + i) * 100;
          ctx.fillStyle = 'rgba(233,69,96,' + (0.03 + Math.sin(frame * 0.03 + i) * 0.03) + ')';
          ctx.fillRect(x, y, 80, 80);
        }
        
        // Title
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 50px Arial';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 20;
        ctx.fillText('STRIKER', canvas.width / 2, canvas.height * 0.2);
        ctx.fillText('LEGENDS', canvas.width / 2, canvas.height * 0.28);
        ctx.shadowBlur = 0;
        
        // Menu items
        const items = ['⚔️  FIGHT', '👥  SELECT FIGHTERS'];
        items.forEach((item, i) => {
          const y = canvas.height * 0.48 + i * 90;
          if (menuOption === i) {
            ctx.fillStyle = 'rgba(233,69,96,0.3)';
            ctx.fillRect(canvas.width / 2 - 180, y - 30, 360, 60);
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 3;
            ctx.strokeRect(canvas.width / 2 - 180, y - 30, 360, 60);
          }
          ctx.fillStyle = menuOption === i ? '#e94560' : '#ccc';
          ctx.font = 'bold 32px Arial';
          ctx.fillText(item, canvas.width / 2, y);
        });
        
        ctx.fillStyle = '#888';
        ctx.font = '16px Arial';
        ctx.fillText('Tap to select | Keyboard: ↑↓ Enter', canvas.width / 2, canvas.height - 30);
        ctx.textAlign = 'left';
      }

      function drawSelect() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SELECT FIGHTERS', canvas.width / 2, 35);
        ctx.fillText('Tap left side = P1 | Tap right side = P2', canvas.width / 2, 65);
        ctx.font = '14px Arial';
        ctx.fillText('Tap "READY" to start fight', canvas.width / 2, 85);
        
        const cols = 6;
        const rows = 2;
        const cw = Math.min(120, (canvas.width - 100) / cols);
        const ch = cw * 1.3;
        const totalW = cw * cols + 10 * (cols - 1);
        const totalH = ch * rows + 10 * (rows - 1);
        const sx = (canvas.width - totalW) / 2;
        const sy = 100;
        
        FIGHTERS.forEach((f, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = sx + col * (cw + 10);
          const y = sy + row * (ch + 10);
          
          // Card background
          ctx.fillStyle = '#1a1a2e';
          ctx.fillRect(x, y, cw, ch);
          
          // Character preview
          ctx.fillStyle = f.color;
          ctx.fillRect(x + 5, y + 5, cw - 10, ch - 35);
          
          // Name and style
          ctx.fillStyle = '#fff';
          ctx.font = 'bold ' + Math.floor(cw * 0.14) + 'px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(f.name, x + cw / 2, y + ch - 20);
          ctx.font = Math.floor(cw * 0.1) + 'px Arial';
          ctx.fillStyle = '#aaa';
          ctx.fillText(f.style, x + cw / 2, y + ch - 6);
          
          // P1 selection indicator
          if (i === selP1) {
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 4;
            ctx.strokeRect(x - 3, y - 3, cw + 6, ch + 6);
            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('P1', x + cw / 2, y - 10);
          }
          
          // P2 selection indicator
          if (i === selP2) {
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 4;
            ctx.strokeRect(x - 3, y - 3, cw + 6, ch + 6);
            ctx.fillStyle = '#3498db';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('P2', x + cw / 2, y - 10);
          }
        });
        
        // Ready button
        const rbx = canvas.width / 2 - 80;
        const rby = sy + totalH + 20;
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(rbx, rby, 160, 45);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(rbx, rby, 160, 45);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('READY!', canvas.width / 2, rby + 28);
        
        ctx.textAlign = 'left';
      }

      // ==================== MAIN LOOP ====================
      function update() {
        if (gameState === STATE.FIGHT && !winner) {
          if (slowmoTimer > 0) {
            slowmoTimer--;
            if (frame % 2 !== 0) return;
          }
          if (shakeTimer > 0) shakeTimer--;
          
          if (p1) p1.update();
          if (p2) p2.update();
          aiThink();
          
          particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15;
            p.life--;
            return p.life > 0;
          });
          
          // Win check
          if (p1 && p1.hp <= 0) {
            winner = 'P2';
            winTimer = 120;
            p1.state = 'idle';
            p2.state = 'idle';
          }
          if (p2 && p2.hp <= 0) {
            winner = 'P1';
            winTimer = 120;
            p1.state = 'idle';
            p2.state = 'idle';
          }
        }
        
        if (winner && winTimer > 0) {
          winTimer--;
          if (winTimer <= 0) {
            gameState = STATE.MENU;
            p1 = null;
            p2 = null;
            winner = null;
            winTimer = 0;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (gameState === STATE.MENU) {
          drawMenu();
        } else if (gameState === STATE.SELECT) {
          drawSelect();
        } else if (gameState === STATE.FIGHT) {
          drawStage();
          if (p2) p2.draw(ctx);
          if (p1) p1.draw(ctx);
          
          // Draw particles
          particles.forEach(p => {
            ctx.globalAlpha = p.life / 30;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.globalAlpha = 1;
          
          drawUI();
          drawButtons();
          
          // Win message
          if (winner) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(winner + ' WINS!', canvas.width / 2, canvas.height / 2);
            ctx.font = '20px Arial';
            ctx.fillText('Returning to menu...', canvas.width / 2, canvas.height / 2 + 40);
            ctx.textAlign = 'left';
          }
        }
      }

      function loop() {
        frame++;
        update();
        draw();
        requestAnimationFrame(loop);
      }

      // ==================== INPUT HANDLERS ====================
      function handleTap(x, y) {
        initAudio();
        
        if (gameState === STATE.MENU) {
          const itemsY = [canvas.height * 0.48, canvas.height * 0.48 + 90];
          if (y >= itemsY[0] - 30 && y <= itemsY[0] + 30) {
            menuOption = 0;
            // Start fight
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers();
            gameState = STATE.FIGHT;
            sfxSelect();
          } else if (y >= itemsY[1] - 30 && y <= itemsY[1] + 30) {
            menuOption = 1;
            gameState = STATE.SELECT;
            sfxSelect();
          }
        } else if (gameState === STATE.SELECT) {
          const cols = 6;
          const rows = 2;
          const cw = Math.min(120, (canvas.width - 100) / cols);
          const ch = cw * 1.3;
          const totalW = cw * cols + 10 * (cols - 1);
          const totalH = ch * rows + 10 * (rows - 1);
          const sx = (canvas.width - totalW) / 2;
          const sy = 100;
          const rby = sy + totalH + 20;
          
          // Check ready button
          if (x >= canvas.width / 2 - 80 && x <= canvas.width / 2 + 80 &&
              y >= rby && y <= rby + 45) {
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers();
            gameState = STATE.FIGHT;
            sfxSelect();
            return;
          }
          
          // Check fighter cards
          FIGHTERS.forEach((f, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const fx = sx + col * (cw + 10);
            const fy = sy + row * (ch + 10);
            if (x >= fx && x <= fx + cw && y >= fy && y <= fy + ch) {
              if (x < canvas.width / 2) {
                selP1 = i;
              } else {
                selP2 = i;
              }
              sfxSelect();
            }
          });
        }
      }

      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const x = touch.clientX;
        const y = touch.clientY;
        
        if (gameState === STATE.FIGHT) {
          const btn = getButton(x, y);
          if (btn) doAction(btn.id);
        } else {
          handleTap(x, y);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (gameState === STATE.FIGHT) {
          const touch = e.touches[0];
          const btn = getButton(touch.clientX, touch.clientY);
          if (btn && (btn.id === 'left' || btn.id === 'right' || btn.id === 'block')) {
            doAction(btn.id);
          }
        }
      }, { passive: false });

      canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        if (gameState === STATE.FIGHT && p1) {
          p1.vx = 0;
          p1.blocking = false;
        }
      });

      canvas.addEventListener('click', function(e) {
        if (gameState !== STATE.FIGHT) {
          handleTap(e.clientX, e.clientY);
        }
      });

      // Keyboard support
      window.addEventListener('keydown', function(e) {
        initAudio();
        if (gameState === STATE.MENU) {
          if (e.key === 'ArrowDown') { menuOption = 1; }
          if (e.key === 'ArrowUp') { menuOption = 0; }
          if (e.key === 'Enter') handleTap(canvas.width/2, canvas.height * 0.48);
        } else if (gameState === STATE.SELECT) {
          if (e.key === 'ArrowLeft') selP1 = (selP1 - 1 + 12) % 12;
          if (e.key === 'ArrowRight') selP1 = (selP1 + 1) % 12;
          if (e.key === 'ArrowUp') selP2 = (selP2 - 1 + 12) % 12;
          if (e.key === 'ArrowDown') selP2 = (selP2 + 1) % 12;
          if (e.key === 'Enter') {
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers();
            gameState = STATE.FIGHT;
          }
        } else if (gameState === STATE.FIGHT) {
          switch(e.key) {
            case 'a': case 'ArrowLeft': doAction('left'); break;
            case 'd': case 'ArrowRight': doAction('right'); break;
            case 'w': case 'ArrowUp': doAction('jump'); break;
            case 's': case 'ArrowDown': doAction('block'); break;
            case 'q': doAction('roll'); break;
            case 'j': doAction('punch'); break;
            case 'k': doAction('kick'); break;
            case 'u': doAction('special'); break;
            case 'i': doAction('ultra'); break;
          }
        }
      });

      window.addEventListener('keyup', function(e) {
        if (gameState === STATE.FIGHT && p1) {
          if (e.key === 'a' || e.key === 'd' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            p1.vx = 0;
          }
          if (e.key === 's' || e.key === 'ArrowDown') {
            p1.blocking = false;
          }
        }
      });

      // ==================== START ====================
      resizeCanvas();
      loop();
    })();
  </script>
</body>
</html>
