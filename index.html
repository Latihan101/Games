<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ARCADE COMBAT · 3 HEROES</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    }
    body {
      background: #000; width: 100vw; height: 100vh; overflow: hidden;
      position: fixed; top: 0; left: 0; touch-action: manipulation; font-family: Arial, sans-serif;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  (function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ==================== AUDIO ====================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    function sfx(f, t, d, v) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = t || 'square';
        o.frequency.value = f || 440;
        g.gain.setValueAtTime(v || 0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch(e) {}
    }

    // ==================== FIGHTER DATA ====================
    const FIGHTERS = [
      { id:0, name:'FLAME KNIGHT', style:'Fire Sword', color:'#e74c3c', secColor:'#ff6b35', hp:105, atk:13, def:7, spd:6,
        moves: {
          lp:{dmg:4, range:55, speed:8, kb:2, type:'punch'},
          hp:{dmg:9, range:65, speed:14, kb:5, type:'punch'},
          lk:{dmg:5, range:60, speed:10, kb:3, type:'kick'},
          hk:{dmg:11, range:70, speed:16, kb:7, type:'kick'},
          projectile:{dmg:7, cost:20, name:'FIREBALL', effect:'fire'},
          antiAir:{dmg:10, cost:25, name:'RISING SLASH', effect:'stun'},
          mobility:{dmg:6, cost:15, name:'BLAZE DASH'},
          ultimate:{dmg:42, cost:90, name:'INFERNO BLADE', effect:'fire'}
        }},
      { id:1, name:'THUNDER MONK', style:'Lightning Fist', color:'#f39c12', secColor:'#3498db', hp:90, atk:12, def:8, spd:8,
        moves: {
          lp:{dmg:3, range:50, speed:7, kb:2, type:'punch'},
          hp:{dmg:8, range:60, speed:13, kb:4, type:'punch'},
          lk:{dmg:4, range:55, speed:9, kb:3, type:'kick'},
          hk:{dmg:10, range:65, speed:15, kb:6, type:'kick'},
          projectile:{dmg:6, cost:20, name:'LIGHTNING BOLT', effect:'stun'},
          antiAir:{dmg:9, cost:25, name:'THUNDER UPPER', effect:'stun'},
          mobility:{dmg:5, cost:15, name:'ZIP STEP'},
          ultimate:{dmg:38, cost:90, name:'THUNDER GOD FIST', effect:'stun'}
        }},
      { id:2, name:'BEAST WARRIOR', style:'Wild Fury', color:'#27ae60', secColor:'#f1c40f', hp:115, atk:15, def:10, spd:5,
        moves: {
          lp:{dmg:5, range:60, speed:10, kb:3, type:'punch'},
          hp:{dmg:10, range:70, speed:16, kb:6, type:'punch'},
          lk:{dmg:6, range:65, speed:12, kb:4, type:'kick'},
          hk:{dmg:12, range:75, speed:18, kb:8, type:'kick'},
          projectile:{dmg:8, cost:20, name:'ROCK THROW', effect:'bleed'},
          antiAir:{dmg:11, cost:25, name:'CLAW UPPER', effect:'bleed'},
          mobility:{dmg:7, cost:15, name:'BEAST LEAP'},
          ultimate:{dmg:45, cost:90, name:'BEAST ROAR', effect:'bleed'}
        }}
    ];

    const STAGES = [
      { name:'City', sky:'#1a1a2e', ground:'#2c3e50' },
      { name:'Temple', sky:'#3e2723', ground:'#4e342e' },
      { name:'Forest', sky:'#1b5e20', ground:'#2e7d32' }
    ];

    // ==================== GAME STATE ====================
    const STATE = { MENU:0, SELECT:1, FIGHT:2 };
    let gameState = STATE.MENU;
    let menuOption = 0;
    let selP1 = 0, selP2 = 1;
    let currentStage = STAGES[0];
    let difficulty = 'Normal'; // Easy / Normal / Hard
    let frame = 0, shakeTimer = 0, slowmoTimer = 0;
    let particles = [], hitEffects = [];
    let winner = null, winTimer = 0;
    let comboCount = 0, comboTimer = 0, comboFlash = 0, screenPulse = 0;

    function spawnParticles(x,y,count,color,spread,life,type){
      for(let i=0;i<count;i++) particles.push({x,y,color,vx:(Math.random()-0.5)*(spread||8),vy:(Math.random()-0.5)*(spread||8)-4,life:life||25,maxLife:life||25,size:2+Math.random()*6,type:type||'circle'});
    }
    function spawnHitEffect(x,y,damage,color){
      hitEffects.push({x,y,text:Math.floor(damage),color:color||'#fff',life:35,vy:-4,scale:1});
    }

    class Fighter {
      constructor(data, x, dir) {
        this.data = data; this.x = x; this.y = 0; this.groundY = 0;
        this.w = 70; this.h = 100; this.hp = data.hp; this.maxHp = data.hp;
        this.meter = 0; this.dir = dir; this.vx = 0; this.vy = 0;
        this.grounded = true; this.blocking = 'none'; // 'none','stand','crouch'
        this.crouching = false;
        this.rolling = false; this.rollCD = 0;
        this.atkCD = 0; this.stun = 0; this.specialCD = 0;
        this.state = 'idle'; this.animTimer = 0; this.invincible = false; this.idleBob = 0;
        this.attackPhase = 0; this.attackPhaseTimer = 0; this.attackType = 'none';
        this.attackLunge = 0; this.weaponTrail = 0;
        this.bodyParts = { headRot:0, bodySquash:0, bodyLean:0, weaponGlow:0 };
        this.burning = 0; this.poisoned = 0; this.frozen = 0; this.bleeding = 0;
        this.aiMood = 'neutral'; this.aiMoodTimer = 0; this.aiBlockMemory = 0;
        this.projectileActive = null; // {x,y,vx,damage,effect}
      }

      update() {
        this.animTimer++; this.idleBob = Math.sin(this.animTimer*0.05)*3;
        // Attack animation
        if(this.attackPhaseTimer>0){
          this.attackPhaseTimer--;
          if(this.attackPhase===1){ this.attackLunge=-8*(this.attackPhaseTimer/6); this.bodyParts.bodyLean=-0.15; this.weaponTrail=0.3; }
          else if(this.attackPhase===2){ let prog=1-(this.attackPhaseTimer/Math.max(1,this._activeDur||6)); this.attackLunge=15*Math.sin(prog*Math.PI); this.bodyParts.bodyLean=0.25; this.weaponTrail=1; this.bodyParts.weaponGlow=1; }
          else if(this.attackPhase===3){ this.attackLunge*=0.7; this.bodyParts.bodyLean*=0.8; this.weaponTrail*=0.6; this.bodyParts.weaponGlow*=0.7; }
          if(this.attackPhaseTimer<=0 && this.attackPhase<3) this.advancePhase();
          if(this.attackPhaseTimer<=0 && this.attackPhase===3) this.resetAttack();
        } else { this.attackLunge*=0.8; this.bodyParts.bodyLean*=0.85; this.weaponTrail*=0.8; this.bodyParts.weaponGlow*=0.85; }
        // Status effects
        if(this.burning>0){ this.burning--; if(this.animTimer%10===0){ this.hp=Math.max(0,this.hp-1); spawnParticles(this.x+35,this.y+40,2,'#ff6b35',3,10,'fire'); } }
        if(this.bleeding>0){ this.bleeding--; if(this.animTimer%8===0){ this.hp=Math.max(0,this.hp-3); spawnParticles(this.x+35,this.y+50,3,'#e74c3c',2,10,'blood'); } }
        if(this.frozen>0){ this.frozen--; this.vx*=0.5; }
        if(this.stun>0){ this.stun--; this.bodyParts.headRot=Math.sin(this.animTimer*0.5)*0.3; } else this.bodyParts.headRot*=0.9;
        if(this.atkCD>0) this.atkCD--; if(this.specialCD>0) this.specialCD--; if(this.rollCD>0) this.rollCD--;
        this.x += this.vx;
        if(!this.grounded){ this.vy+=0.8; this.y+=this.vy; if(this.y>=this.groundY){ this.y=this.groundY; this.vy=0; this.grounded=true; this.rolling=false; this.invincible=false; this.bodyParts.bodySquash=-0.2; } }
        this.bodyParts.bodySquash *= 0.85;
        if(this.rolling && this.grounded) this.invincible=true; else if(!this.rolling) this.invincible=false;
        if(this.x<20) this.x=20; if(this.x>canvas.width-90) this.x=canvas.width-90;
        if(this.atkCD<=0 && this.stun<=0 && this.state!=='roll' && this.attackPhase===0) this.state='idle';
        // Update projectile
        if(this.projectileActive){
          this.projectileActive.x += this.projectileActive.vx;
          if(this.projectileActive.x < -50 || this.projectileActive.x > canvas.width+50) this.projectileActive = null;
        }
      }

      advancePhase(){
        if(this.attackPhase===1){ this.attackPhase=2; this.attackPhaseTimer=this._activeDur||6; }
        else if(this.attackPhase===2){ this.attackPhase=3; this.attackPhaseTimer=this._recoveryDur||5; }
      }
      resetAttack(){
        this.attackPhase=0; this.attackPhaseTimer=0; this.attackType='none'; this.attackLunge=0;
        this.bodyParts.bodyLean=0; this.weaponTrail=0; this.bodyParts.weaponGlow=0;
        if(this.atkCD<=0 && this.stun<=0) this.state='idle';
      }
      startAttack(type, activeDur, recoveryDur){
        this.attackType=type; this.attackPhase=1; this.attackPhaseTimer=6;
        this._activeDur=activeDur; this._recoveryDur=recoveryDur;
      }

      jump(){ if(this.grounded && !this.rolling){ this.vy=-12; this.grounded=false; this.state='jump'; sfx(400,'sine',0.12,0.1); } }
      crouch(){ if(this.grounded && !this.rolling){ this.crouching=true; this.state='crouch'; this.vx=0; } }
      stand(){ this.crouching=false; if(this.state==='crouch') this.state='idle'; }
      roll(){ if(this.grounded && this.rollCD<=0 && !this.rolling && this.stun<=0){ this.rolling=true; this.rollCD=30; this.invincible=true; this.vx=this.dir*9; this.state='roll'; sfx(200,'sine',0.1,0.08); } }

      hit(dmg, kb, effect) {
        if(this.invincible) return;
        let blockMult = 1;
        if(this.blocking==='stand') blockMult = 0.25;
        else if(this.blocking==='crouch') blockMult = 0.2;
        let finalDmg = dmg * blockMult * (1 - this.data.def/120);
        this.hp = Math.max(0, this.hp - finalDmg);
        this.meter = Math.min(100, this.meter + finalDmg*0.8);
        if(!this.blocking || this.blocking==='none'){
          this.stun = (kb>5) ? 18 : 10;
          if(effect && blockMult===1){
            switch(effect){ case 'fire': this.burning=60; break; case 'stun': this.stun=25; break; case 'bleed': this.bleeding=50; break; }
          }
          if(kb && blockMult===1){ this.vx = kb*5; this.vy=-4; this.grounded=false; }
          sfx(180,'triangle',0.1,0.08);
          spawnParticles(this.x+35,this.y+40,comboCount>=5?20:10,'#fff',6,20);
          spawnHitEffect(this.x+35,this.y,finalDmg, comboCount>=8?'#ff0':'#fff');
          if(kb>6){ this.state='knockdown'; this.stun=25; }
        } else {
          sfx(250,'triangle',0.08,0.06);
          spawnParticles(this.x+35,this.y+40,5,'#3498db',4,12);
        }
      }

      draw(ctx){
        ctx.save(); let sx = shakeTimer>0 ? (Math.random()-0.5)*10 : 0, sy = shakeTimer>0 ? (Math.random()-0.5)*8 : 0;
        let scaleX = this.bodyParts.bodySquash<0 ? 1+Math.abs(this.bodyParts.bodySquash)*0.5 : 1;
        let scaleY = this.bodyParts.bodySquash<0 ? 1-Math.abs(this.bodyParts.bodySquash)*0.3 : 1;
        if(this.crouching){ scaleY *= 0.7; sy += 15; }
        let lunge = this.attackLunge * this.dir;
        ctx.translate(this.x+sx+lunge+this.w/2, this.y+sy+this.h/2);
        if(this.dir<0) ctx.scale(-1,1);
        ctx.scale(scaleX, scaleY); ctx.translate(-this.w/2, -this.h/2);
        if(this.invincible && Math.floor(this.animTimer/2)%2===0) ctx.globalAlpha=0.4;
        let bob = (this.state==='idle' && this.attackPhase===0) ? this.idleBob : 0;
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h+2, 25,5,0,0,Math.PI*2); ctx.fill();
        if(this.weaponTrail>0.2){ ctx.shadowColor=this.data.secColor; ctx.shadowBlur=18*this.weaponTrail; }
        this.drawCharacter(ctx, bob);
        ctx.shadowBlur=0; ctx.restore();
      }

      drawCharacter(ctx, bob){
        let w=this.w, h=this.h, lean=this.bodyParts.bodyLean, isAtk=this.attackPhase===2, atkType=this.attackType;
        if(this.data.id===0) this.drawFlameKnight(ctx,bob,w,h,lean,isAtk,atkType);
        else if(this.data.id===1) this.drawThunderMonk(ctx,bob,w,h,lean,isAtk,atkType);
        else this.drawBeastWarrior(ctx,bob,w,h,lean,isAtk,atkType);
      }
      drawFlameKnight(ctx,bob,w,h,lean,isAtk,atkType){
        ctx.fillStyle='#555'; ctx.fillRect(15,h-30,15,30); ctx.fillRect(w-30,h-30,15,30);
        ctx.fillStyle='#e74c3c'; ctx.fillRect(12,h-8,20,8); ctx.fillRect(w-32,h-8,20,8);
        ctx.fillStyle='#c0392b'; ctx.fillRect(15,15,w-30,h-45); ctx.fillStyle='#f1c40f'; ctx.fillRect(25,15,w-50,3);
        if(isAtk){ ctx.fillStyle='#bdc3c7'; ctx.fillRect(w-5,10,25,6); ctx.fillStyle='#ff6b35'; ctx.fillRect(w+20,6,16,10); }
        else { ctx.fillStyle='#bdc3c7'; ctx.fillRect(w-10,20,15,5); }
        ctx.fillStyle='#555'; ctx.beginPath(); ctx.arc(w/2,10+bob,14,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ff6b35'; ctx.beginPath(); ctx.arc(w/2-4,8+bob,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/2+4,8+bob,3,0,Math.PI*2); ctx.fill();
      }
      drawThunderMonk(ctx,bob,w,h,lean,isAtk,atkType){
        ctx.fillStyle='#f39c12'; ctx.beginPath(); ctx.moveTo(15,20); ctx.lineTo(w-15,20); ctx.lineTo(w-10,h-25); ctx.lineTo(10,h-25); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#d35400'; ctx.fillRect(20,h-28,10,28); ctx.fillRect(w-30,h-28,10,28);
        ctx.fillStyle='#f39c12'; ctx.fillRect(w-10,20,14,10); ctx.fillRect(5,20,14,10);
        if(isAtk){ ctx.fillStyle='#3498db'; ctx.fillRect(w+5,16,10,16); }
        ctx.fillStyle='#f5cba7'; ctx.beginPath(); ctx.arc(w/2,10+bob,13,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#3498db'; ctx.beginPath(); ctx.arc(w/2-4,8+bob,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/2+4,8+bob,3,0,Math.PI*2); ctx.fill();
      }
      drawBeastWarrior(ctx,bob,w,h,lean,isAtk,atkType){
        ctx.fillStyle='#27ae60'; ctx.fillRect(10,18,w-20,h-40);
        ctx.fillStyle='#1e8449'; ctx.fillRect(15,h-28,16,28); ctx.fillRect(w-31,h-28,16,28);
        ctx.fillStyle='#27ae60'; ctx.fillRect(w-12,18,16,14); ctx.fillRect(5,18,16,14);
        if(isAtk){ ctx.fillStyle='#f1c40f'; for(let i=0;i<4;i++) ctx.fillRect(w+5+i*5,14,3,14); }
        ctx.fillStyle='#27ae60'; ctx.beginPath(); ctx.arc(w/2,8+bob,15,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.arc(w/2-5,6+bob,3.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/2+5,6+bob,3.5,0,Math.PI*2); ctx.fill();
      }
    }

    let p1=null, p2=null;
    function createPlayers(){
      p1=new Fighter(FIGHTERS[selP1], canvas.width*0.2, 1);
      p2=new Fighter(FIGHTERS[selP2], canvas.width*0.7, -1);
      p1.groundY=p2.groundY=canvas.height-130; p1.y=p1.groundY; p2.y=p2.groundY;
      particles=[]; hitEffects=[]; shakeTimer=0; slowmoTimer=0; winner=null; winTimer=0; comboCount=0; comboTimer=0;
    }

    let buttons=[];
    function createButtons(){
      let w=canvas.width, h=canvas.height, bs=Math.min(65, h*0.13), gap=8;
      buttons=[
        {id:'left', x:gap, y:h-bs*2-gap*2, w:bs, h:bs, label:'◀'},
        {id:'right', x:gap*2+bs, y:h-bs*2-gap*2, w:bs, h:bs, label:'▶'},
        {id:'jump', x:gap, y:h-bs*3-gap*3, w:bs, h:bs, label:'⬆'},
        {id:'crouch', x:gap*2+bs, y:h-bs*3-gap*3, w:bs, h:bs, label:'⬇'},
        {id:'block', x:gap, y:h-bs-gap, w:bs*2+gap, h:bs*0.6, label:'🛡'},
        {id:'lp', x:w-bs*2-gap*2, y:h-bs*2-gap*2, w:bs, h:bs, label:'LP'},
        {id:'hp', x:w-bs-gap, y:h-bs*2-gap*2, w:bs, h:bs, label:'HP'},
        {id:'lk', x:w-bs*2-gap*2, y:h-bs*3-gap*3, w:bs, h:bs, label:'LK'},
        {id:'hk', x:w-bs-gap, y:h-bs*3-gap*3, w:bs, h:bs, label:'HK'},
        {id:'special1', x:w-bs*2-gap*2, y:h-bs*4-gap*4, w:bs, h:bs, label:'⚡'},
        {id:'special2', x:w-bs-gap, y:h-bs*4-gap*4, w:bs, h:bs, label:'💥'},
      ];
    }

    function getButton(x,y){ return buttons.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h); }
    function updateCombo(){ comboCount++; comboTimer=60; comboFlash=8; if(comboCount>=10){ sfx(800,'sine',0.15,0.1); screenPulse=10; } }
    
    function performAttack(attacker, defender, moveKey) {
      if(!attacker || attacker.stun>0 || attacker.attackPhase!==0) return;
      let move = attacker.data.moves[moveKey];
      if(!move) return;
      if(move.cost && attacker.meter < move.cost) return;
      
      attacker.atkCD = move.speed;
      attacker.state = 'attack';
      attacker.startAttack(move.type, move.speed*0.6, move.speed*0.4);
      
      if(move.cost) attacker.meter -= move.cost;
      
      let dist = Math.abs(attacker.x - defender.x);
      if(dist < move.range + 30) {
        defender.hit(move.dmg, move.kb || 3, move.effect);
        updateCombo();
      }
      
      if(moveKey==='projectile' && !attacker.projectileActive){
        attacker.projectileActive = { x: attacker.x+35, y: attacker.y+40, vx: attacker.dir*8, damage: move.dmg, effect: move.effect };
      }
      if(moveKey==='mobility'){ attacker.vx = attacker.dir*10; attacker.invincible = true; setTimeout(()=>{if(attacker)attacker.invincible=false;},200); }
      
      sfx(move.cost?350:120, 'square', 0.12, 0.1);
      if(moveKey==='ultimate'){ sfx(40,'sawtooth',0.5,0.2); shakeTimer=20; slowmoTimer=15; }
    }

    function doAction(id){
      if(!p1||p1.stun>0||winner) return;
      switch(id){
        case 'left': p1.vx=-5; p1.dir=-1; p1.state='walk'; break;
        case 'right': p1.vx=5; p1.dir=1; p1.state='walk'; break;
        case 'jump': p1.jump(); break;
        case 'crouch': p1.crouch(); break;
        case 'block': p1.blocking='stand'; p1.vx=0; break;
        case 'lp': performAttack(p1,p2,'lp'); break;
        case 'hp': performAttack(p1,p2,'hp'); break;
        case 'lk': performAttack(p1,p2,'lk'); break;
        case 'hk': performAttack(p1,p2,'hk'); break;
        case 'special1': performAttack(p1,p2,'projectile'); break;
        case 'special2': if(p1.meter>=p1.data.moves.ultimate.cost) performAttack(p1,p2,'ultimate'); break;
      }
    }

    function aiThink(){
      if(!p2||p2.stun>0||winner) return;
      if(frame % (difficulty==='Easy'?12:difficulty==='Hard'?4:7) !== 0) return;
      let dx=p1.x-p2.x, dist=Math.abs(dx); p2.dir=dx>0?1:-1; p2.vx=0; p2.blocking='none';
      
      if(p1.attackPhase===2 && dist<130 && Math.random()<0.5) { p2.blocking='stand'; return; }
      
      if(dist<80){
        let r=Math.random();
        if(r<0.3) performAttack(p2,p1,'lp');
        else if(r<0.55) performAttack(p2,p1,'lk');
        else if(r<0.7 && p2.meter>=p2.data.moves.projectile.cost) performAttack(p2,p1,'projectile');
        if(Math.random()<0.15) p2.blocking='stand';
      } else if(dist<200){
        p2.vx = p2.dir * 3;
        if(Math.random()<0.25) performAttack(p2,p1,'hp');
        if(p2.meter>=p2.data.moves.ultimate.cost && Math.random()<0.08) performAttack(p2,p1,'ultimate');
      } else {
        p2.vx = p2.dir * 4;
        if(Math.random()<0.2) p2.jump();
      }
      if(Math.random()<0.05 && p2.rollCD<=0) p2.roll();
    }

    function drawStage(){
      let grad=ctx.createLinearGradient(0,0,0,canvas.height); grad.addColorStop(0,currentStage.sky); grad.addColorStop(0.8,currentStage.ground);
      ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle=currentStage.ground; ctx.fillRect(0,canvas.height-100,canvas.width,100);
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,canvas.height-100); ctx.lineTo(canvas.width,canvas.height-100); ctx.stroke();
    }
    function drawUI(){
      if(!p1||!p2) return;
      let bw=Math.min(280,canvas.width*0.28), bh=18, y=15;
      ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(10,y-2,bw+4,bh+4);
      let hp1w=bw*(p1.hp/p1.maxHp); ctx.fillStyle=p1.hp/p1.maxHp>0.5?'#2ecc71':'#e74c3c'; ctx.fillRect(12,y,hp1w,bh);
      ctx.strokeStyle='#fff'; ctx.strokeRect(12,y,bw,bh);
      ctx.fillStyle='#fff'; ctx.font='bold 14px Arial'; ctx.fillText(p1.data.name,12,y-5);
      let px=canvas.width-bw-12; ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(px-2,y-2,bw+4,bh+4);
      let hp2w=bw*(p2.hp/p2.maxHp); ctx.fillStyle=p2.hp/p2.maxHp>0.5?'#2ecc71':'#e74c3c'; ctx.fillRect(px+bw-hp2w,y,hp2w,bh);
      ctx.strokeRect(px,y,bw,bh); ctx.textAlign='right'; ctx.fillText(p2.data.name,canvas.width-12,y-5); ctx.textAlign='left';
      if(comboCount>1&&comboTimer>0){ ctx.fillStyle='#ff0'; ctx.font='bold 24px Arial'; ctx.textAlign='center'; ctx.fillText(comboCount+' HIT!',canvas.width/2,y+50); ctx.textAlign='left'; }
    }
    function drawButtons(){
      buttons.forEach(b=>{ ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.fillStyle='#fff'; ctx.font=Math.floor(b.h*0.4)+'px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2); });
    }
    function drawMenu(){
      ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 45px Arial'; ctx.textAlign='center'; ctx.fillText('ARCADE COMBAT',canvas.width/2,canvas.height*0.25);
      let items=['FIGHT','SELECT','DIFFICULTY: '+difficulty];
      items.forEach((item,i)=>{ let iy=canvas.height*0.45+i*70; ctx.fillStyle=menuOption===i?'#e94560':'#ccc'; ctx.font='bold 28px Arial'; ctx.fillText(item,canvas.width/2,iy); });
    }
    function drawSelect(){
      ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 24px Arial'; ctx.textAlign='center'; ctx.fillText('SELECT FIGHTERS',canvas.width/2,30);
      let cols=3, cw=Math.min(130,(canvas.width-60)/cols), ch=cw*1.3, totalW=cw*cols+15*(cols-1), sx=(canvas.width-totalW)/2, sy=55;
      FIGHTERS.forEach((f,i)=>{ let x=sx+i*(cw+15); ctx.fillStyle='#1a1a2e'; ctx.fillRect(x,sy,cw,ch); ctx.fillStyle=f.color; ctx.fillRect(x+3,sy+3,cw-6,ch-30); ctx.fillStyle='#fff'; ctx.font='bold 12px Arial'; ctx.fillText(f.name,x+cw/2,sy+ch-12); if(i===selP1){ ctx.strokeStyle='#ff0'; ctx.lineWidth=3; ctx.strokeRect(x-2,sy-2,cw+4,ch+4); } if(i===selP2){ ctx.strokeStyle='#3498db'; ctx.lineWidth=3; ctx.strokeRect(x-2,sy-2,cw+4,ch+4); } });
      ctx.fillStyle='#e74c3c'; ctx.fillRect(canvas.width/2-60,sy+ch+25,120,35); ctx.fillStyle='#fff'; ctx.font='bold 16px Arial'; ctx.fillText('READY',canvas.width/2,sy+ch+47);
    }

    function update(){
      if(gameState===STATE.FIGHT&&!winner){
        if(slowmoTimer>0){ slowmoTimer--; if(frame%2!==0) return; }
        if(shakeTimer>0) shakeTimer--; if(comboTimer>0){ comboTimer--; if(comboTimer<=0) comboCount=0; }
        p1?.update(); p2?.update(); aiThink();
        // Projectile collision
        [p1,p2].forEach(f=>{ if(f&&f.projectileActive){ let proj=f.projectileActive; let enemy = f===p1?p2:p1; if(enemy && Math.abs(proj.x-enemy.x-35)<40 && Math.abs(proj.y-enemy.y-40)<50){ enemy.hit(proj.damage,3,proj.effect); f.projectileActive=null; } } });
        particles=particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--; return p.life>0; });
        hitEffects=hitEffects.filter(e=>{ e.life--; if(e.vy)e.y+=e.vy; return e.life>0; });
        if(p1&&p1.hp<=0){ winner='CPU WINS!'; winTimer=120; } if(p2&&p2.hp<=0){ winner='YOU WIN!'; winTimer=120; }
      }
      if(winner&&winTimer>0){ winTimer--; if(winTimer<=0){ gameState=STATE.MENU; p1=null; p2=null; winner=null; } }
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if(gameState===STATE.MENU) drawMenu();
      else if(gameState===STATE.SELECT) drawSelect();
      else if(gameState===STATE.FIGHT){
        drawStage(); 
        if(p2) p2.draw(ctx); if(p1) p1.draw(ctx);
        [p1,p2].forEach(f=>{ if(f&&f.projectileActive){ let p=f.projectileActive; ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.fill(); } });
        particles.forEach(p=>{ ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2); ctx.fill(); });
        hitEffects.forEach(e=>{ ctx.fillStyle=e.color; ctx.globalAlpha=e.life/35; ctx.font='bold 18px Arial'; ctx.textAlign='center'; ctx.fillText(e.text,e.x,e.y); });
        ctx.globalAlpha=1; drawUI(); drawButtons();
        if(winner){ ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle=winner==='YOU WIN!'?'#2ecc71':'#e74c3c'; ctx.font='bold 50px Arial'; ctx.textAlign='center'; ctx.fillText(winner,canvas.width/2,canvas.height/2); }
      }
    }
    function loop(){ frame++; update(); draw(); requestAnimationFrame(loop); }

    function handleTap(x,y){
      initAudio();
      if(gameState===STATE.MENU){
        let iy1=canvas.height*0.45, iy2=canvas.height*0.45+70, iy3=canvas.height*0.45+140;
        if(y>=iy1-25&&y<=iy1+25){ menuOption=0; currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); createButtons(); gameState=STATE.FIGHT; }
        else if(y>=iy2-25&&y<=iy2+25){ menuOption=1; gameState=STATE.SELECT; }
        else if(y>=iy3-25&&y<=iy3+25){ difficulty = difficulty==='Easy'?'Normal':difficulty==='Normal'?'Hard':'Easy'; }
      } else if(gameState===STATE.SELECT){
        let cols=3, cw=Math.min(130,(canvas.width-60)/cols), ch=cw*1.3, totalW=cw*cols+15*(cols-1), sx=(canvas.width-totalW)/2, sy=55;
        if(x>=canvas.width/2-60&&x<=canvas.width/2+60&&y>=sy+ch+25&&y<=sy+ch+60){ currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); createButtons(); gameState=STATE.FIGHT; return; }
        FIGHTERS.forEach((f,i)=>{ let fx=sx+i*(cw+15); if(x>=fx&&x<=fx+cw&&y>=sy&&y<=sy+ch){ if(x<canvas.width/2) selP1=i; else selP2=i; } });
      }
    }

    canvas.addEventListener('touchstart', e=>{ e.preventDefault(); let t=e.touches[0]; if(gameState===STATE.FIGHT){ let btn=getButton(t.clientX,t.clientY); if(btn) doAction(btn.id); } else handleTap(t.clientX,t.clientY); }, {passive:false});
    canvas.addEventListener('touchend', e=>{ e.preventDefault(); if(gameState===STATE.FIGHT&&p1){ p1.vx=0; p1.blocking='none'; p1.stand(); } });
    canvas.addEventListener('click', e=>{ if(gameState!==STATE.FIGHT) handleTap(e.clientX,e.clientY); });
    window.addEventListener('keydown', e=>{
      initAudio();
      if(gameState===STATE.MENU){ if(e.key==='ArrowDown') menuOption=(menuOption+1)%3; if(e.key==='ArrowUp') menuOption=(menuOption-1+3)%3; if(e.key==='Enter'){ if(menuOption===0){ currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); createButtons(); gameState=STATE.FIGHT; } else if(menuOption===1) gameState=STATE.SELECT; else difficulty = difficulty==='Easy'?'Normal':difficulty==='Normal'?'Hard':'Easy'; } }
      else if(gameState===STATE.SELECT){ if(e.key==='ArrowLeft') selP1=(selP1-1+3)%3; if(e.key==='ArrowRight') selP1=(selP1+1)%3; if(e.key==='ArrowUp') selP2=(selP2-1+3)%3; if(e.key==='ArrowDown') selP2=(selP2+1)%3; if(e.key==='Enter'){ currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); createButtons(); gameState=STATE.FIGHT; } }
      else if(gameState===STATE.FIGHT){ switch(e.key){ case 'a': case 'ArrowLeft': doAction('left'); break; case 'd': case 'ArrowRight': doAction('right'); break; case 'w': case 'ArrowUp': doAction('jump'); break; case 's': case 'ArrowDown': doAction('crouch'); break; case 'q': doAction('block'); break; case 'j': doAction('lp'); break; case 'k': doAction('hp'); break; case 'u': doAction('lk'); break; case 'i': doAction('hk'); break; case '1': doAction('special1'); break; case '2': doAction('special2'); break; } }
    });
    window.addEventListener('keyup', e=>{ if(gameState===STATE.FIGHT&&p1){ if(['a','d','ArrowLeft','ArrowRight'].includes(e.key)) p1.vx=0; if(e.key==='s'||e.key==='ArrowDown') p1.stand(); if(e.key==='q') p1.blocking='none'; } });

    resizeCanvas(); loop();
  })();
</script>
</body>
</html>
