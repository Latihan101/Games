<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STRIKER LEGENDS · ENHANCED</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    body { background:#000; width:100vw; height:100vh; overflow:hidden; position:fixed; top:0; left:0; touch-action:manipulation; }
    canvas { display:block; position:absolute; top:0; left:0; width:100%; height:100%; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ==================== AUDIO ====================
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
      }
      function sfx(f, t, d, v) {
        if (!audioCtx) return;
        try {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = t || 'square';
          o.frequency.value = f || 440;
          g.gain.setValueAtTime(v || 0.08, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(); o.stop(audioCtx.currentTime + d);
        } catch(e) {}
      }

      // ==================== FIGHTERS DATA ====================
      const FIGHTERS = [
        { id:0, name:'RYU', style:'Karate', color:'#e74c3c', hp:100, spd:6, atk:12, def:8 },
        { id:1, name:'NINJA', style:'Ninjutsu', color:'#2c3e50', hp:85, spd:9, atk:10, def:5 },
        { id:2, name:'BOXER', style:'Boxing', color:'#f39c12', hp:95, spd:7, atk:14, def:7 },
        { id:3, name:'TIGER', style:'Muay Thai', color:'#e67e22', hp:90, spd:8, atk:13, def:6 },
        { id:4, name:'GRAP', style:'Wrestling', color:'#9b59b6', hp:110, spd:5, atk:15, def:10 },
        { id:5, name:'SAMU', style:'Kenjutsu', color:'#7d3c98', hp:100, spd:6, atk:12, def:9 },
        { id:6, name:'REAP', style:'Assassin', color:'#1a1a1a', hp:80, spd:10, atk:11, def:4 },
        { id:7, name:'MONK', style:'Kung Fu', color:'#f1c40f', hp:90, spd:8, atk:10, def:8 },
        { id:8, name:'CYBO', style:'Tech', color:'#3498db', hp:105, spd:5, atk:14, def:9 },
        { id:9, name:'BEAST', style:'Wild', color:'#27ae60', hp:95, spd:7, atk:13, def:7 },
        { id:10, name:'MAGE', style:'Magic', color:'#8e44ad', hp:80, spd:7, atk:16, def:5 },
        { id:11, name:'DRAG', style:'Dragon', color:'#c0392b', hp:100, spd:6, atk:15, def:8 }
      ];

      const STAGES = [
        { name:'City', sky:'#1a1a2e', ground:'#2c3e50' },
        { name:'Temple', sky:'#3e2723', ground:'#4e342e' },
        { name:'Forest', sky:'#1b5e20', ground:'#2e7d32' },
        { name:'Dojo', sky:'#bf360c', ground:'#d84315' },
        { name:'Volcano', sky:'#b71c1c', ground:'#c62828' },
        { name:'Snow', sky:'#90a4ae', ground:'#b0bec5' },
        { name:'Neon', sky:'#1a237e', ground:'#283593' }
      ];

      // ==================== GAME STATE ====================
      const STATE = { MENU:0, SELECT:1, FIGHT:2 };
      let gameState = STATE.MENU;
      let menuOption = 0;
      let selP1 = 0;
      let selP2 = 1;
      let currentStage = STAGES[0];
      let frame = 0;
      let shakeTimer = 0;
      let slowmoTimer = 0;
      let particles = [];
      let hitEffects = [];
      let winner = null;
      let winTimer = 0;

      // ==================== PARTICLES & EFFECTS ====================
      function spawnParticles(x, y, count, color, spread, life) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x, y, color,
            vx: (Math.random() - 0.5) * (spread || 8),
            vy: (Math.random() - 0.5) * (spread || 8) - 4,
            life: life || 25,
            maxLife: life || 25,
            size: 2 + Math.random() * 6
          });
        }
      }

      function spawnHitEffect(x, y, damage) {
        hitEffects.push({
          x, y,
          text: Math.floor(damage),
          life: 30,
          vy: -3
        });
      }

      function spawnShockwave(x, y) {
        hitEffects.push({
          x, y,
          type: 'shockwave',
          radius: 10,
          maxRadius: 80,
          life: 20
        });
      }

      // ==================== FIGHTER CLASS ====================
      class Fighter {
        constructor(data, x, dir) {
          this.data = data;
          this.x = x;
          this.y = 0;
          this.groundY = 0;
          this.w = 70;
          this.h = 100;
          this.hp = data.hp;
          this.maxHp = data.hp;
          this.energy = 0;
          this.ultra = 0;
          this.dir = dir;
          this.vx = 0;
          this.vy = 0;
          this.grounded = true;
          this.blocking = false;
          this.rolling = false;
          this.rollCD = 0;
          this.atkCD = 0;
          this.stun = 0;
          this.specialCD = 0;
          this.state = 'idle';
          this.animTimer = 0;
          this.invincible = false;
          this.idleBob = 0;
          this.bodyParts = {
            headRot: 0,
            armAngle: 0,
            legSpread: 0,
            bodySquash: 0
          };
        }
        
        update() {
          this.animTimer++;
          this.idleBob = Math.sin(this.animTimer * 0.05) * 3;
          
          if (this.stun > 0) {
            this.stun--;
            this.bodyParts.headRot = Math.sin(this.animTimer * 0.5) * 0.3;
          } else {
            this.bodyParts.headRot *= 0.9;
          }
          
          if (this.atkCD > 0) this.atkCD--;
          if (this.specialCD > 0) this.specialCD--;
          if (this.rollCD > 0) this.rollCD--;
          
          this.x += this.vx;
          
          if (!this.grounded) {
            this.vy += 0.8;
            this.y += this.vy;
            if (this.y >= this.groundY) {
              this.y = this.groundY;
              this.vy = 0;
              this.grounded = true;
              this.rolling = false;
              this.invincible = false;
              this.bodyParts.bodySquash = -0.2;
            }
          }
          
          this.bodyParts.bodySquash *= 0.85;
          
          if (this.rolling && this.grounded) {
            this.invincible = true;
          } else if (!this.rolling) {
            this.invincible = false;
          }
          
          if (this.rolling && this.grounded && Math.abs(this.vx) < 0.5) {
            this.rolling = false;
            this.vx = 0;
            this.invincible = false;
          }
          
          if (this.x < 20) this.x = 20;
          if (this.x > canvas.width - 90) this.x = canvas.width - 90;
          
          if (this.atkCD <= 0 && this.stun <= 0 && this.state !== 'roll') {
            this.state = 'idle';
          }
          
          // Auto-stop roll
          if (this.state === 'roll' && this.rollCD <= 25) {
            this.rolling = false;
            this.state = 'idle';
            this.vx = 0;
            this.invincible = false;
          }
        }
        
        jump() {
          if (this.grounded && !this.rolling) {
            this.vy = -12;
            this.grounded = false;
            this.state = 'jump';
            this.bodyParts.legSpread = 0.5;
            sfx(400, 'sine', 0.12, 0.1);
          }
        }
        
        roll() {
          if (this.grounded && this.rollCD <= 0 && !this.rolling && this.stun <= 0) {
            this.rolling = true;
            this.rollCD = 30;
            this.invincible = true;
            this.vx = this.dir * 9;
            this.state = 'roll';
            sfx(200, 'sine', 0.1, 0.08);
            spawnParticles(this.x + 35, this.y + 80, 8, '#fff', 3, 15);
          }
        }
        
        hit(dmg, kb) {
          if (this.invincible) return;
          
          const actualDmg = this.blocking ? dmg * 0.2 : dmg;
          const finalDmg = actualDmg * (1 - this.data.def / 120);
          
          this.hp = Math.max(0, this.hp - finalDmg);
          this.energy = Math.min(100, this.energy + finalDmg * 0.5);
          this.ultra = Math.min(100, this.ultra + finalDmg * 0.8);
          this.stun = 14;
          this.bodyParts.headRot = (Math.random() - 0.5) * 0.8;
          
          if (this.blocking) {
            sfx(250, 'triangle', 0.08, 0.06);
            spawnParticles(this.x + 35, this.y + 40, 5, '#3498db', 4, 12);
          } else {
            sfx(180, 'triangle', 0.1, 0.08);
            spawnParticles(this.x + 35, this.y + 40, 10, '#fff', 6, 20);
            spawnHitEffect(this.x + 35, this.y, finalDmg);
          }
          
          if (kb && !this.blocking) {
            this.vx = kb * 6;
            this.vy = -3;
            this.grounded = false;
            this.rolling = false;
            this.invincible = false;
          }
        }
        
        draw(ctx) {
          ctx.save();
          const sx = shakeTimer > 0 ? (Math.random() - 0.5) * 10 : 0;
          const sy = shakeTimer > 0 ? (Math.random() - 0.5) * 8 : 0;
          
          // Apply body squash
          const scaleX = this.bodyParts.bodySquash < 0 ? 1 + Math.abs(this.bodyParts.bodySquash) * 0.5 : 1;
          const scaleY = this.bodyParts.bodySquash < 0 ? 1 - Math.abs(this.bodyParts.bodySquash) * 0.3 : 1;
          
          ctx.translate(this.x + sx + this.w/2, this.y + sy + this.h/2);
          
          // Flip
          if (this.dir < 0) {
            ctx.scale(-1, 1);
          }
          
          ctx.scale(scaleX, scaleY);
          ctx.translate(-this.w/2, -this.h/2);
          
          // Invincibility flash
          if (this.invincible && Math.floor(this.animTimer / 2) % 2 === 0) {
            ctx.globalAlpha = 0.4;
          }
          
          // Idle bob
          const bob = (this.state === 'idle') ? this.idleBob : 0;
          
          // ===== SHADOW =====
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.beginPath();
          ctx.ellipse(this.w/2, this.h + 2, 25, 5, 0, 0, Math.PI * 2);
          ctx.fill();
          
          // ===== LEGS =====
          const legSpread = this.state === 'walk' ? Math.sin(this.animTimer * 0.3) * 8 : 
                           this.state === 'jump' ? 6 : 
                           this.state === 'kick' ? 12 : 0;
          
          ctx.fillStyle = '#333';
          // Left leg
          ctx.save();
          ctx.translate(20, this.h - 30);
          ctx.rotate(legSpread * 0.02);
          ctx.fillRect(-5, 0, 12, 30);
          ctx.restore();
          
          // Right leg
          ctx.save();
          ctx.translate(this.w - 20, this.h - 30);
          ctx.rotate(-legSpread * 0.02);
          ctx.fillRect(-7, 0, 12, 30);
          ctx.restore();
          
          // Feet
          ctx.fillStyle = '#1a1a1a';
          ctx.fillRect(10, this.h - 5, 18, 6);
          ctx.fillRect(this.w - 28, this.h - 5, 18, 6);
          
          // ===== BODY =====
          const bodyGrad = ctx.createLinearGradient(0, 20, this.w, 20);
          bodyGrad.addColorStop(0, this.data.color);
          bodyGrad.addColorStop(0.5, this.lightenColor(this.data.color, 20));
          bodyGrad.addColorStop(1, this.darkenColor(this.data.color, 30));
          ctx.fillStyle = bodyGrad;
          
          ctx.beginPath();
          ctx.moveTo(18, 18);
          ctx.lineTo(this.w - 18, 18);
          ctx.lineTo(this.w - 12, 60);
          ctx.lineTo(this.w - 12, this.h - 30);
          ctx.lineTo(12, this.h - 30);
          ctx.lineTo(12, 60);
          ctx.closePath();
          ctx.fill();
          
          // Belt
          ctx.fillStyle = '#f1c40f';
          ctx.fillRect(10, 55, this.w - 20, 5);
          
          // ===== ARMS =====
          const armY = 25;
          if (this.state === 'punch') {
            // Punching arm extended
            ctx.fillStyle = this.data.color;
            ctx.save();
            ctx.translate(this.w + 5, armY + 5);
            ctx.rotate(-0.3);
            ctx.fillRect(-25, -6, 28, 12);
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath();
            ctx.arc(-25, 0, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            
            // Other arm
            ctx.fillStyle = this.data.color;
            ctx.fillRect(-8, armY, 16, 12);
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath();
            ctx.arc(0, armY+6, 5, 0, Math.PI*2);
            ctx.fill();
          } else if (this.state === 'kick') {
            // Arms pulled back for balance
            ctx.fillStyle = this.data.color;
            ctx.fillRect(-5, armY, 16, 12);
            ctx.fillRect(this.w - 11, armY, 16, 12);
          } else if (this.state === 'special') {
            // Both arms glowing
            ctx.fillStyle = '#ff0';
            ctx.shadowColor = '#ff0';
            ctx.shadowBlur = 15;
            ctx.fillRect(-15, armY, 20, 12);
            ctx.fillRect(this.w - 5, armY, 20, 12);
            ctx.shadowBlur = 0;
          } else if (this.state === 'roll') {
            // Arms tucked in
            ctx.fillStyle = this.data.color;
            ctx.fillRect(5, armY + 10, 14, 10);
            ctx.fillRect(this.w - 19, armY + 10, 14, 10);
          } else {
            // Normal arms with idle sway
            const armSway = Math.sin(this.animTimer * 0.04) * 3;
            ctx.fillStyle = this.data.color;
            ctx.fillRect(-6 + armSway, armY, 14, 12);
            ctx.fillRect(this.w - 8 - armSway, armY, 14, 12);
            
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath();
            ctx.arc(2 + armSway, armY+6, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.w-2 - armSway, armY+6, 5, 0, Math.PI*2);
            ctx.fill();
          }
          
          // ===== HEAD =====
          ctx.save();
          ctx.translate(this.w/2, 10 + bob);
          ctx.rotate(this.bodyParts.headRot);
          
          // Head
          ctx.fillStyle = '#ffdbac';
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI*2);
          ctx.fill();
          
          // Hair
          ctx.fillStyle = '#2c3e50';
          ctx.beginPath();
          ctx.arc(0, -4, 15, Math.PI, 0);
          ctx.fill();
          
          // Eyes
          if (this.state === 'ultimate') {
            ctx.fillStyle = '#ff0';
            ctx.shadowColor = '#ff0';
            ctx.shadowBlur = 8;
          } else {
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
          }
          ctx.beginPath();
          ctx.arc(-5, 0, 4, 0, Math.PI*2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(5, 0, 4, 0, Math.PI*2);
          ctx.fill();
          
          // Pupils
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(-4, 0, 2, 0, Math.PI*2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(6, 0, 2, 0, Math.PI*2);
          ctx.fill();
          
          // Mouth
          if (this.state === 'punch' || this.state === 'kick') {
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, 7, 3, 0, Math.PI);
            ctx.fill();
          } else if (this.state === 'special' || this.state === 'ultimate') {
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 8, 4, 0.1, Math.PI-0.1);
            ctx.stroke();
          } else {
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 6, 3, 0.1, Math.PI-0.1);
            ctx.stroke();
          }
          
          ctx.shadowBlur = 0;
          ctx.restore();
          
          // ===== EFFECTS OVERLAY =====
          if (this.blocking) {
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.6 + Math.sin(this.animTimer * 0.2) * 0.2;
            ctx.beginPath();
            ctx.arc(this.w/2, this.h/2, this.w * 0.7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          
          if (this.state === 'ultimate') {
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(this.w/2, this.h/2, this.w * 0.8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          
          ctx.restore();
        }
        
        lightenColor(hex, amount) {
          let r = parseInt(hex.slice(1,3), 16);
          let g = parseInt(hex.slice(3,5), 16);
          let b = parseInt(hex.slice(5,7), 16);
          r = Math.min(255, r + amount);
          g = Math.min(255, g + amount);
          b = Math.min(255, b + amount);
          return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
        }
        
        darkenColor(hex, amount) {
          let r = parseInt(hex.slice(1,3), 16);
          let g = parseInt(hex.slice(3,5), 16);
          let b = parseInt(hex.slice(5,7), 16);
          r = Math.max(0, r - amount);
          g = Math.max(0, g - amount);
          b = Math.max(0, b - amount);
          return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
        }
      }

      // ==================== PLAYERS ====================
      let p1 = null;
      let p2 = null;

      function createPlayers() {
        p1 = new Fighter(FIGHTERS[selP1], canvas.width * 0.2, 1);
        p2 = new Fighter(FIGHTERS[selP2], canvas.width * 0.7, -1);
        p1.groundY = canvas.height - 130;
        p2.groundY = canvas.height - 130;
        p1.y = p1.groundY;
        p2.y = p2.groundY;
        particles = [];
        hitEffects = [];
        shakeTimer = 0;
        slowmoTimer = 0;
        winner = null;
        winTimer = 0;
      }

      // ==================== BUTTONS ====================
      let buttons = [];

      function createButtons() {
        const w = canvas.width;
        const h = canvas.height;
        const bs = Math.min(65, h * 0.12);
        const ss = Math.min(48, h * 0.09);
        const gap = 8;
        
        buttons = [
          { id:'left',   x:gap, y:h-bs-gap, w:bs, h:bs, label:'◀', color:'#333' },
          { id:'right',  x:gap*2+bs, y:h-bs-gap, w:bs, h:bs, label:'▶', color:'#333' },
          { id:'jump',   x:gap, y:h-bs*2-gap*2, w:bs, h:bs, label:'⬆', color:'#2ecc71' },
          { id:'roll',   x:gap*2+bs, y:h-bs*2-gap*2, w:bs, h:bs, label:'↪', color:'#1abc9c' },
          { id:'block',  x:gap*3+bs*2, y:h-ss-gap, w:bs*0.7, h:ss, label:'🛡', color:'#2980b9' },
          { id:'punch',  x:w-bs*2-gap*2, y:h-bs-gap, w:bs, h:bs, label:'👊', color:'#c0392b' },
          { id:'kick',   x:w-bs-gap, y:h-bs-gap, w:bs, h:bs, label:'🦵', color:'#d35400' },
          { id:'special',x:w-bs*2-gap*2, y:h-bs*2-gap*2, w:bs, h:ss, label:'⚡', color:'#8e44ad' },
          { id:'ultra',  x:w-bs-gap, y:h-bs*2-gap*2, w:bs, h:ss, label:'💥', color:'#f39c12' }
        ];
      }

      function getButton(x, y) {
        return buttons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
      }

      function doAction(id) {
        if (!p1 || p1.stun > 0 || winner) return;
        switch(id) {
          case 'left': p1.vx = -5; p1.dir = -1; p1.state = 'walk'; break;
          case 'right': p1.vx = 5; p1.dir = 1; p1.state = 'walk'; break;
          case 'jump': p1.jump(); break;
          case 'roll': p1.roll(); break;
          case 'block': p1.blocking = true; p1.vx = 0; break;
          case 'punch':
            if (p1.atkCD <= 0) {
              p1.atkCD = 10; p1.state = 'punch'; p1.bodyParts.armAngle = -1;
              sfx(120, 'square', 0.12, 0.1);
              attack(p1, p2, 8);
            }
            break;
          case 'kick':
            if (p1.atkCD <= 0) {
              p1.atkCD = 14; p1.state = 'kick'; p1.bodyParts.legSpread = 1;
              sfx(60, 'sawtooth', 0.14, 0.12);
              attack(p1, p2, 13);
            }
            break;
          case 'special':
            if (p1.specialCD <= 0 && p1.energy >= 25) {
              p1.energy -= 25; p1.specialCD = 40; p1.state = 'special';
              sfx(350, 'sawtooth', 0.25, 0.15);
              attack(p1, p2, 20);
              spawnParticles(p2.x + 35, p2.y + 40, 20, '#ff0', 10, 25);
              spawnShockwave(p2.x + 35, p2.y + 40);
              shakeTimer = 10;
            }
            break;
          case 'ultra':
            if (p1.ultra >= 90) {
              p1.ultra = 0; p1.state = 'ultimate';
              sfx(40, 'sawtooth', 0.5, 0.2);
              sfx(600, 'square', 0.3, 0.15);
              attack(p1, p2, 40);
              spawnParticles(p2.x + 35, p2.y + 40, 35, '#f00', 14, 30);
              spawnShockwave(p2.x + 35, p2.y + 40);
              shakeTimer = 20;
              slowmoTimer = 15;
            }
            break;
        }
      }

      function attack(atk, def, dmg) {
        const dist = Math.abs(atk.x - def.x);
        if (dist < 120) {
          def.hit(dmg * (atk.data.atk / 10), atk.dir);
        }
      }

      // ==================== AI ====================
      function aiThink() {
        if (!p2 || p2.stun > 0 || winner) return;
        if (frame % 12 !== 0) return;
        
        const dx = p1.x - p2.x;
        const dist = Math.abs(dx);
        p2.dir = dx > 0 ? 1 : -1;
        p2.vx = 0;
        p2.blocking = false;
        
        if (dist < 80) {
          if (Math.random() < 0.25) p2.blocking = true;
          if (Math.random() < 0.15) p2.jump();
          if (Math.random() < 0.1) p2.roll();
          if (p2.atkCD <= 0 && Math.random() < 0.4) aiAttack(Math.random() < 0.6 ? 'punch' : 'kick');
        } else if (dist < 220) {
          p2.vx = (dx > 0 ? 1 : -1) * 3.5;
          p2.state = 'walk';
          if (p2.atkCD <= 0 && Math.random() < 0.25) aiAttack('punch');
          if (p2.specialCD <= 0 && p2.energy >= 25 && Math.random() < 0.15) aiAttack('special');
        } else {
          p2.vx = (dx > 0 ? 1 : -1) * 4.5;
          p2.state = 'walk';
          if (Math.random() < 0.08) p2.roll();
        }
        
        if (p2.ultra >= 85 && Math.random() < 0.08) aiAttack('ultra');
      }

      function aiAttack(type) {
        if (!p2 || p2.stun > 0) return;
        const dist = Math.abs(p1.x - p2.x);
        if (dist > 130 && type !== 'ultra') return;
        
        switch(type) {
          case 'punch':
            if (p2.atkCD <= 0) { p2.atkCD = 10; p2.state = 'punch'; attack(p2, p1, 7); }
            break;
          case 'kick':
            if (p2.atkCD <= 0) { p2.atkCD = 14; p2.state = 'kick'; attack(p2, p1, 11); }
            break;
          case 'special':
            if (p2.specialCD <= 0 && p2.energy >= 25) {
              p2.energy -= 25; p2.specialCD = 40; p2.state = 'special';
              attack(p2, p1, 18);
              spawnParticles(p1.x + 35, p1.y + 40, 20, '#ff0', 10, 25);
            }
            break;
          case 'ultra':
            if (p2.ultra >= 85) {
              p2.ultra = 0; p2.state = 'ultimate';
              attack(p2, p1, 38);
              spawnParticles(p1.x + 35, p1.y + 40, 35, '#f00', 14, 30);
              shakeTimer = 20;
              slowmoTimer = 15;
            }
            break;
        }
      }

      // ==================== DRAWING ====================
      function drawStage() {
        // Sky gradient
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, currentStage.sky);
        grad.addColorStop(0.8, currentStage.ground);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Stars/particles in sky
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for (let i = 0; i < 20; i++) {
          const sx = (i * 137 + frame * 0.1) % canvas.width;
          const sy = (i * 89) % (canvas.height * 0.6);
          ctx.beginPath();
          ctx.arc(sx, sy, 1, 0, Math.PI*2);
          ctx.fill();
        }
        
        // Ground
        ctx.fillStyle = currentStage.ground;
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        
        // Ground line
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 100);
        ctx.lineTo(canvas.width, canvas.height - 100);
        ctx.stroke();
        
        // Ground details
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 50) {
          ctx.beginPath();
          ctx.moveTo(i, canvas.height - 100);
          ctx.lineTo(i - 20, canvas.height);
          ctx.stroke();
        }
        
        // Floor reflection
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
      }

      function drawUI() {
        if (!p1 || !p2) return;
        const bw = Math.min(280, canvas.width * 0.28);
        const bh = 20;
        const y = 15;
        
        // P1 HP background
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(10, y-2, bw+4, bh+4);
        ctx.fillStyle = '#333';
        ctx.fillRect(12, y, bw, bh);
        
        // P1 HP bar with gradient
        const hp1w = bw * (p1.hp / p1.maxHp);
        const hp1Grad = ctx.createLinearGradient(12, 0, 12+hp1w, 0);
        hp1Grad.addColorStop(0, p1.hp/p1.maxHp > 0.5 ? '#2ecc71' : '#e74c3c');
        hp1Grad.addColorStop(1, p1.hp/p1.maxHp > 0.5 ? '#27ae60' : '#c0392b');
        ctx.fillStyle = hp1Grad;
        ctx.fillRect(12, y, hp1w, bh);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(12, y, bw, bh);
        
        // P1 name
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px Arial';
        ctx.fillText(p1.data.name, 12, y - 6);
        
        // P1 meters
        ctx.font = '10px Arial';
        ctx.fillText('EP:' + Math.floor(p1.energy), 12, y + bh + 13);
        ctx.fillStyle = p1.ultra >= 90 ? '#ff0' : '#fff';
        ctx.fillText('ULT:' + Math.floor(p1.ultra), 12, y + bh + 26);
        
        // P2 HP background
        const px = canvas.width - bw - 12;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(px-2, y-2, bw+4, bh+4);
        ctx.fillStyle = '#333';
        ctx.fillRect(px, y, bw, bh);
        
        // P2 HP bar
        const hp2w = bw * (p2.hp / p2.maxHp);
        const hp2Grad = ctx.createLinearGradient(px+bw-hp2w, 0, px+bw, 0);
        hp2Grad.addColorStop(0, p2.hp/p2.maxHp > 0.5 ? '#2ecc71' : '#e74c3c');
        hp2Grad.addColorStop(1, p2.hp/p2.maxHp > 0.5 ? '#27ae60' : '#c0392b');
        ctx.fillStyle = hp2Grad;
        ctx.fillRect(px + bw - hp2w, y, hp2w, bh);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(px, y, bw, bh);
        
        // P2 name
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px Arial';
        ctx.textAlign = 'right';
        ctx.fillText(p2.data.name, canvas.width - 12, y - 6);
        
        // P2 meters
        ctx.font = '10px Arial';
        ctx.fillText('EP:' + Math.floor(p2.energy), canvas.width - 12, y + bh + 13);
        ctx.fillStyle = p2.ultra >= 90 ? '#ff0' : '#fff';
        ctx.fillText('ULT:' + Math.floor(p2.ultra), canvas.width - 12, y + bh + 26);
        ctx.textAlign = 'left';
        
        // VS
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('VS', canvas.width/2, y + 25);
        ctx.textAlign = 'left';
      }

      function drawButtons() {
        buttons.forEach(b => {
          // Button shadow
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(b.x+2, b.y+2, b.w, b.h);
          
          // Button body
          const btnGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
          btnGrad.addColorStop(0, b.color);
          btnGrad.addColorStop(1, b.color + '88');
          ctx.fillStyle = btnGrad;
          ctx.globalAlpha = 0.65;
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.globalAlpha = 1;
          
          // Border
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.strokeRect(b.x, b.y, b.w, b.h);
          
          // Label
          ctx.fillStyle = '#fff';
          ctx.font = Math.floor(b.h * 0.38) + 'px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2);
        });
      }

      function drawMenu() {
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Animated background particles
        for (let i = 0; i < 25; i++) {
          const x = (frame * 0.5 + i * 110) % (canvas.width + 200) - 100;
          const y = canvas.height * 0.5 + Math.sin(frame * 0.02 + i) * 90;
          ctx.fillStyle = 'rgba(233,69,96,' + (0.03 + Math.sin(frame * 0.03 + i) * 0.02) + ')';
          ctx.fillRect(x, y, 70, 70);
        }
        
        // Title
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 50px Arial';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 20;
        ctx.fillText('STRIKER', canvas.width/2, canvas.height * 0.2);
        ctx.fillText('LEGENDS', canvas.width/2, canvas.height * 0.28);
        ctx.shadowBlur = 0;
        
        // Menu items
        const items = ['⚔️  FIGHT', '👥  SELECT'];
        items.forEach((item, i) => {
          const y = canvas.height * 0.48 + i * 85;
          if (menuOption === i) {
            ctx.fillStyle = 'rgba(233,69,96,0.3)';
            ctx.fillRect(canvas.width/2 - 170, y - 28, 340, 56);
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 3;
            ctx.strokeRect(canvas.width/2 - 170, y - 28, 340, 56);
          }
          ctx.fillStyle = menuOption === i ? '#e94560' : '#ccc';
          ctx.font = 'bold 30px Arial';
          ctx.fillText(item, canvas.width/2, y);
        });
        
        ctx.fillStyle = '#888';
        ctx.font = '14px Arial';
        ctx.fillText('Tap / Keyboard: ↑↓ Enter', canvas.width/2, canvas.height - 30);
        ctx.textAlign = 'left';
      }

      function drawSelect() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SELECT FIGHTERS', canvas.width/2, 30);
        ctx.font = '13px Arial';
        ctx.fillText('Left = P1 | Right = P2 | Tap READY to start', canvas.width/2, 55);
        
        const cols = 6;
        const cw = Math.min(110, (canvas.width - 80) / cols);
        const ch = cw * 1.2;
        const totalW = cw * cols + 8 * (cols - 1);
        const sx = (canvas.width - totalW) / 2;
        const sy = 70;
        
        FIGHTERS.forEach((f, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = sx + col * (cw + 8);
          const y = sy + row * (ch + 8);
          
          ctx.fillStyle = '#1a1a2e';
          ctx.fillRect(x, y, cw, ch);
          ctx.fillStyle = f.color;
          ctx.fillRect(x+4, y+4, cw-8, ch-32);
          ctx.fillStyle = '#fff';
          ctx.font = Math.floor(cw * 0.14) + 'px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(f.name, x + cw/2, y + ch - 16);
          ctx.font = Math.floor(cw * 0.1) + 'px Arial';
          ctx.fillStyle = '#aaa';
          ctx.fillText(f.style, x + cw/2, y + ch - 4);
          
          if (i === selP1) {
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 3;
            ctx.strokeRect(x-2, y-2, cw+4, ch+4);
            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('P1', x + cw/2, y - 6);
          }
          if (i === selP2) {
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 3;
            ctx.strokeRect(x-2, y-2, cw+4, ch+4);
            ctx.fillStyle = '#3498db';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('P2', x + cw/2, y - 6);
          }
        });
        
        // Ready button
        const rby = sy + 2 * (ch + 8) + 15;
        const rbx = canvas.width/2 - 80;
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(rbx, rby, 160, 40);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(rbx, rby, 160, 40);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Arial';
        ctx.fillText('READY!', canvas.width/2, rby + 25);
        
        ctx.textAlign = 'left';
      }

      // ==================== MAIN LOOP ====================
      function update() {
        if (gameState === STATE.FIGHT && !winner) {
          if (slowmoTimer > 0) {
            slowmoTimer--;
            if (frame % 2 !== 0) return;
          }
          if (shakeTimer > 0) shakeTimer--;
          
          if (p1) p1.update();
          if (p2) p2.update();
          aiThink();
          
          // Update particles
          particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.12;
            p.life--;
            return p.life > 0;
          });
          
          // Update hit effects
          hitEffects = hitEffects.filter(e => {
            e.life--;
            if (e.vy) e.y += e.vy;
            if (e.type === 'shockwave') {
              e.radius += (e.maxRadius - e.radius) * 0.3;
            }
            return e.life > 0;
          });
          
          // Win check
          if (p1 && p1.hp <= 0) { winner = 'CPU'; winTimer = 120; }
          if (p2 && p2.hp <= 0) { winner = 'YOU WIN!'; winTimer = 120; }
        }
        
        if (winner && winTimer > 0) {
          winTimer--;
          if (winTimer <= 0) {
            gameState = STATE.MENU;
            p1 = null; p2 = null;
            winner = null; winTimer = 0;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (gameState === STATE.MENU) {
          drawMenu();
        } else if (gameState === STATE.SELECT) {
          drawSelect();
        } else if (gameState === STATE.FIGHT) {
          drawStage();
          
          // Draw fighters
          if (p2) p2.draw(ctx);
          if (p1) p1.draw(ctx);
          
          // Draw particles
          particles.forEach(p => {
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (p.life/p.maxLife), 0, Math.PI*2);
            ctx.fill();
          });
          
          // Draw hit effects
          hitEffects.forEach(e => {
            if (e.type === 'shockwave') {
              ctx.strokeStyle = 'rgba(255,255,255,' + (e.life/20) + ')';
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
              ctx.stroke();
            } else {
              ctx.fillStyle = 'rgba(255,255,0,' + (e.life/30) + ')';
              ctx.font = 'bold 18px Arial';
              ctx.textAlign = 'center';
              ctx.fillText(e.text, e.x, e.y);
            }
          });
          
          ctx.globalAlpha = 1;
          drawUI();
          drawButtons();
          
          // Win overlay
          if (winner) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = winner === 'YOU WIN!' ? '#2ecc71' : '#e74c3c';
            ctx.font = 'bold 55px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(winner, canvas.width/2, canvas.height/2);
            ctx.fillStyle = '#fff';
            ctx.font = '18px Arial';
            ctx.fillText('Returning to menu...', canvas.width/2, canvas.height/2 + 40);
            ctx.textAlign = 'left';
          }
        }
      }

      function loop() {
        frame++;
        update();
        draw();
        requestAnimationFrame(loop);
      }

      // ==================== INPUT ====================
      function handleTap(x, y) {
        initAudio();
        
        if (gameState === STATE.MENU) {
          const item0Y = canvas.height * 0.48;
          const item1Y = canvas.height * 0.48 + 85;
          if (y >= item0Y - 28 && y <= item0Y + 28) {
            menuOption = 0;
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers();
            createButtons();
            gameState = STATE.FIGHT;
            sfx(800, 'sine', 0.12, 0.08);
          } else if (y >= item1Y - 28 && y <= item1Y + 28) {
            menuOption = 1;
            gameState = STATE.SELECT;
            sfx(800, 'sine', 0.12, 0.08);
          }
        } else if (gameState === STATE.SELECT) {
          const cols = 6;
          const cw = Math.min(110, (canvas.width - 80) / cols);
          const ch = cw * 1.2;
          const totalW = cw * cols + 8 * (cols - 1);
          const sx = (canvas.width - totalW) / 2;
          const sy = 70;
          const rby = sy + 2 * (ch + 8) + 15;
          
          // Check ready button
          if (x >= canvas.width/2 - 80 && x <= canvas.width/2 + 80 && y >= rby && y <= rby + 40) {
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers();
            createButtons();
            gameState = STATE.FIGHT;
            sfx(800, 'sine', 0.12, 0.08);
            return;
          }
          
          // Check fighter cards
          FIGHTERS.forEach((f, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const fx = sx + col * (cw + 8);
            const fy = sy + row * (ch + 8);
            if (x >= fx && x <= fx + cw && y >= fy && y <= fy + ch) {
              if (x < canvas.width/2) selP1 = i;
              else selP2 = i;
              sfx(500, 'sine', 0.08, 0.06);
            }
          });
        }
      }

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.touches[0];
        if (gameState === STATE.FIGHT) {
          const btn = getButton(t.clientX, t.clientY);
          if (btn) doAction(btn.id);
        } else {
          handleTap(t.clientX, t.clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        if (gameState === STATE.FIGHT) {
          const t = e.touches[0];
          const btn = getButton(t.clientX, t.clientY);
          if (btn && ['left','right','block'].includes(btn.id)) doAction(btn.id);
        }
      }, { passive: false });

      canvas.addEventListener('touchend', e => {
        e.preventDefault();
        if (gameState === STATE.FIGHT && p1) {
          p1.vx = 0;
          p1.blocking = false;
        }
      });

      canvas.addEventListener('click', e => {
        if (gameState !== STATE.FIGHT) handleTap(e.clientX, e.clientY);
      });

      // Keyboard
      window.addEventListener('keydown', e => {
        initAudio();
        if (gameState === STATE.MENU) {
          if (e.key === 'ArrowDown') menuOption = 1;
          if (e.key === 'ArrowUp') menuOption = 0;
          if (e.key === 'Enter') {
            if (menuOption === 0) {
              currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
              createPlayers(); createButtons();
              gameState = STATE.FIGHT;
            } else {
              gameState = STATE.SELECT;
            }
          }
        } else if (gameState === STATE.SELECT) {
          if (e.key === 'ArrowLeft') selP1 = (selP1 - 1 + 12) % 12;
          if (e.key === 'ArrowRight') selP1 = (selP1 + 1) % 12;
          if (e.key === 'ArrowUp') selP2 = (selP2 - 1 + 12) % 12;
          if (e.key === 'ArrowDown') selP2 = (selP2 + 1) % 12;
          if (e.key === 'Enter') {
            currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
            createPlayers(); createButtons();
            gameState = STATE.FIGHT;
          }
        } else if (gameState === STATE.FIGHT) {
          switch(e.key) {
            case 'a': case 'ArrowLeft': doAction('left'); break;
            case 'd': case 'ArrowRight': doAction('right'); break;
            case 'w': case 'ArrowUp': doAction('jump'); break;
            case 's': case 'ArrowDown': doAction('block'); break;
            case 'q': doAction('roll'); break;
            case 'j': doAction('punch'); break;
            case 'k': doAction('kick'); break;
            case 'u': doAction('special'); break;
            case 'i': doAction('ultra'); break;
          }
        }
      });

      window.addEventListener('keyup', e => {
        if (gameState === STATE.FIGHT && p1) {
          if (['a','d','ArrowLeft','ArrowRight'].includes(e.key)) p1.vx = 0;
          if (['s','ArrowDown'].includes(e.key)) p1.blocking = false;
        }
      });

      // ==================== START ====================
      resizeCanvas();
      loop();
    })();
  </script>
</body>
</html>
