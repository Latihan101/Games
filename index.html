<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPG Adventure - Fantasy Realm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .game-container {
      width: 1000px;
      max-width: 100%;
      background: linear-gradient(160deg, #0f0f1a 0%, #0a0818 100%);
      border: 2px solid rgba(108, 63, 197, 0.5);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 100px rgba(108,63,197,0.15);
    }
    .header {
      background: linear-gradient(90deg, rgba(108,63,197,0.2) 0%, rgba(180,80,255,0.1) 100%);
      border-bottom: 1px solid rgba(108,63,197,0.4);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 16px;
      color: #c090ff;
      letter-spacing: 2px;
      text-shadow: 0 0 15px #6c3fc5;
    }
    .nav-menu {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: transparent;
      border: 1px solid rgba(108,63,197,0.3);
      color: #b0a0d0;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: rgba(108,63,197,0.2);
      border-color: #9060ff;
      color: #fff;
    }
    .content-area {
      min-height: 450px;
    }
    /* Game World */
    .game-world {
      position: relative;
      width: 100%;
      height: 500px;
      background: #0b0b14;
      overflow: hidden;
    }
    .game-world canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .game-hud-top {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
      gap: 10px;
    }
    .hud-panel {
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(108,63,197,0.4);
      border-radius: 10px;
      padding: 8px 14px;
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      backdrop-filter: blur(10px);
      min-width: 120px;
    }
    .hp-bar-bg {
      background: #333;
      height: 8px;
      border-radius: 4px;
      margin-top: 4px;
      overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff2244, #ff6644);
      transition: width 0.3s;
      border-radius: 4px;
    }
    .mp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2244ff, #6644ff);
      transition: width 0.3s;
      border-radius: 4px;
    }
    /* Joystick */
    .joystick-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      z-index: 20;
      pointer-events: all;
    }
    .joystick-base {
      width: 100%;
      height: 100%;
      background: rgba(108,63,197,0.2);
      border: 2px solid rgba(108,63,197,0.5);
      border-radius: 50%;
      position: relative;
      touch-action: none;
      box-shadow: 0 0 20px rgba(108,63,197,0.3);
    }
    .joystick-thumb {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #9060ff, #6c3fc5);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(108,63,197,0.6);
      transition: none;
      pointer-events: none;
    }
    /* Skill Buttons */
    .skill-buttons {
      position: absolute;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
      pointer-events: all;
    }
    .skill-row {
      display: flex;
      gap: 8px;
    }
    .skill-btn {
      width: 55px;
      height: 55px;
      border-radius: 14px;
      border: 2px solid;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.15s;
      backdrop-filter: blur(5px);
      touch-action: manipulation;
    }
    .skill-btn:active {
      transform: scale(0.9);
    }
    .skill-btn .cooldown {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-family: 'Orbitron', monospace;
      color: #fff;
    }
    .skill-label {
      position: absolute;
      bottom: -18px;
      font-size: 8px;
      font-family: 'Orbitron', monospace;
      color: #c090ff;
      white-space: nowrap;
    }
    .attack-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff6644, #cc2200);
      border: 3px solid #ffaa00;
      font-size: 28px;
      box-shadow: 0 0 25px rgba(255,100,50,0.5);
    }
    .back-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 30;
      pointer-events: all;
      background: rgba(108,63,197,0.4);
      border: 1px solid #9060ff;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      backdrop-filter: blur(5px);
    }

    .home-page {
      padding: 20px;
      text-align: center;
    }

      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .char-card {
      background: rgba(20,10,40,0.8);
      border: 2px solid rgba(108,63,197,0.3);
      border-radius: 16px;
      padding: 16px;
      width: 180px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .char-card:hover {
      border-color: #9060ff;
      transform: translateY(-3px);
    }
    .char-card.selected {
      border-color: #b040ff;
      background: rgba(108,63,197,0.2);
      box-shadow: 0 0 30px rgba(108,63,197,0.5);
    }
    .char-avatar {
      width: 70px;
      height: 70px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }
    .char-name {
      font-family: 'Orbitron', monospace;
      color: #c090ff;
      font-size: 13px;
    }
    .play-btn {
      background: linear-gradient(135deg, #6c3fc5, #b040ff);
      border: none;
      color: #fff;
      padding: 14px 40px;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(108,63,197,0.5);
    }
    .play-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    /* Items */
    .items-page {
      padding: 16px;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }
    .item-slot {
      background: rgba(20,10,40,0.6);
      border: 1px solid rgba(108,63,197,0.3);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .item-slot:hover {
      border-color: #9060ff;
      background: rgba(108,63,197,0.2);
    }
    .item-icon {
      font-size: 28px;
    }
    /* Info */
    .info-page {
      padding: 16px;
      color: #c090ff;
      max-height: 450px;
      overflow-y: auto;
    }
    .info-section {
      background: rgba(20,10,40,0.6);
      border: 1px solid rgba(108,63,197,0.3);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .info-section h3 {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      color: #b040ff;
      margin-bottom: 6px;
    }
    .info-section li {
      font-size: 9px;
      color: #8060aa;
      line-height: 1.5;
    }
    .info-section li::before {
      content: "◈ ";
      color: #6c3fc5;
    }

    .language-page {
      padding: 20px;
      text-align: center;
    }
    .lang-btn {
      background: rgba(20,10,40,0.6);
      border: 2px solid rgba(108,63,197,0.3);
      color: #c090ff;
      padding: 10px 20px;
      border-radius: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      cursor: pointer;
      margin: 4px;
      transition: all 0.3s;
    }
    .lang-btn.active {
      border-color: #b040ff;
      background: rgba(108,63,197,0.2);
      box-shadow: 0 0 20px rgba(108,63,197,0.4);
    }
    /* About */
    .about-page {
      padding: 20px;
      text-align: center;
      color: #c090ff;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: #4a2090; border-radius: 2px; }
    @media (max-width: 600px) {
      .joystick-container { width: 100px; height: 100px; bottom: 20px; left: 20px; }
      .joystick-thumb { width: 40px; height: 40px; }
      .skill-btn { width: 45px; height: 45px; font-size: 18px; }
      .attack-btn { width: 55px; height: 55px; font-size: 24px; }
      .skill-buttons { bottom: 20px; right: 20px; gap: 6px; }
      .char-card { width: 140px; padding: 12px; }
    }
  </style>

// ============================================================
// ENHANCED PIXEL CHARACTER RENDERER
// ============================================================
function drawCharacter(ctx, x, y, scale, dir, frame, state, char) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const s = state;
  const f = frame;
  const skin = char.skinTone || "#f5c5a0";
  const hair = char.hairColor || "#4a2c0a";
  const armor = s.includes("hurt") ? "#ff4444" : s === "death" ? "#555" : s === "victory" ? "#ffd700" : char.color;
  const armorDark = char.colorDark || "#882200";
  const isMoving = s.includes("walk") || s.includes("run");
  const isAttacking = s.includes("attack");
  const isSkill = s.includes("skill");
  const speed = s.includes("run") ? 1.5 : 1;

  // Body bob animation
  const bob = Math.sin(f * 0.7 * speed) * (isMoving ? 3 : 0.5);
  const armSwing = isMoving ? Math.cos(f * 0.7 * speed) * 6 : 0;
  const legSwing = isMoving ? Math.sin(f * 0.7 * speed) * 5 : 0;
  const attackPhase = isAttacking ? Math.sin(f * 0.5) * 8 : 0;
  const skillPhase = isSkill ? Math.sin(f * 0.4) * 6 : 0;

  // Shadow
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(0, 18, 10, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(0, bob);

  // --- CAPE / BACK ITEMS ---
  if (char.id === "mage" || char.id === "assassin") {
    ctx.fillStyle = char.id === "mage" ? "#6622aa" : "#1a1a2a";
    ctx.beginPath();
    const capeWave = Math.sin(f * 0.3) * 3;
    ctx.moveTo(-4, -2);
    ctx.lineTo(-10 + capeWave, 14);
    ctx.lineTo(4, 8);
    ctx.lineTo(10 + capeWave, 14);
    ctx.lineTo(4, -2);
    ctx.closePath();
    ctx.fill();
  }

  // --- LEGS ---
  // Left leg
  ctx.fillStyle = armorDark;
  ctx.fillRect(-6 - legSwing * 0.5, 8, 5, 10);
  // Right leg
  ctx.fillStyle = armor;
  ctx.fillRect(1 + legSwing * 0.5, 8, 5, 10);
  // Boots
  ctx.fillStyle = "#2c1810";
  ctx.fillRect(-7 - legSwing * 0.5, 16, 6, 4);
  ctx.fillRect(0 + legSwing * 0.5, 16, 6, 4);

  // --- BODY / ARMOR ---
  const bodyGrad = ctx.createLinearGradient(0, 0, 0, 10);
  bodyGrad.addColorStop(0, armor);
  bodyGrad.addColorStop(1, armorDark);
  ctx.fillStyle = bodyGrad;
  
  // Torso shape
  ctx.beginPath();
  ctx.roundRect(-7, -2, 14, 12, 3);
  ctx.fill();
  
  // Armor details
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(-3, 0);
  ctx.lineTo(-3, 8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(3, 0);
  ctx.lineTo(3, 8);
  ctx.stroke();
  
  // Belt
  ctx.fillStyle = "#8a6a3a";
  ctx.fillRect(-7, 7, 14, 3);

  // --- ARMS ---
  // Left arm
  ctx.fillStyle = armor;
  ctx.save();
  ctx.translate(-7, 0);
  ctx.rotate(-0.3 - armSwing * 0.05 - attackPhase * 0.08);
  ctx.fillRect(-2, 0, 5, 10);
  // Hand
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(0, 10, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Right arm (weapon arm)
  ctx.fillStyle = armor;
  ctx.save();
  ctx.translate(7, 0);
  const rightArmRot = 0.3 + armSwing * 0.05 + attackPhase * 0.1 + skillPhase * 0.06;
  ctx.rotate(rightArmRot);
  ctx.fillRect(-3, 0, 5, 10);
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(0, 10, 3, 0, Math.PI * 2);
  ctx.fill();
  
  // Weapon
  if (isAttacking || isSkill || s === "victory") {
    ctx.fillStyle = "#c0c0c0";
    ctx.shadowColor = "#fff";
    ctx.shadowBlur = isSkill ? 10 : 3;
    ctx.fillRect(0, 6, 3, 16);
    // Blade tip
    ctx.fillStyle = "#e0e0e0";
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.lineTo(1.5, -2);
    ctx.lineTo(3, 6);
    ctx.closePath();
    ctx.fill();
    // Guard
    ctx.fillStyle = "#f5a623";
    ctx.fillRect(-3, 6, 9, 3);
    ctx.shadowBlur = 0;
  } else if (char.id === "mage") {
    // Staff
    ctx.fillStyle = "#8a5a2a";
    ctx.fillRect(-1, -5, 3, 18);
    ctx.fillStyle = "#b040ff";
    ctx.shadowColor = "#b040ff";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(0, -5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (char.id === "archer") {
    // Bow on back hint
    ctx.fillStyle = "#6a4a2a";
    ctx.fillRect(-6, -8, 2, 14);
  }
  ctx.restore();

  // --- HEAD ---
  // Neck
  ctx.fillStyle = skin;
  ctx.fillRect(-3, -6, 6, 4);
  
  // Head
  ctx.beginPath();
  ctx.arc(0, -10, 7, 0, Math.PI * 2);
  ctx.fill();
  
  // Hair back
  ctx.fillStyle = hair;
  ctx.beginPath();
  ctx.arc(0, -11, 7.5, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-7, -15, 14, 7);
  
  // Hair strands
  ctx.fillStyle = hair;
  if (char.id === "mage") {
    // Long hair
    ctx.fillRect(-7, -15, 3, 12);
    ctx.fillRect(4, -15, 3, 12);
  }
  
  // Eyes
  const eyeY = s === "hurt" ? -9 : s === "death" ? -7 : -11;
  ctx.fillStyle = "#fff";
  ctx.fillRect(-5, eyeY, 4, 3);
  ctx.fillRect(1, eyeY, 4, 3);
  // Pupils
  ctx.fillStyle = s === "death" ? "#888" : char.id === "assassin" ? "#ff0000" : char.id === "mage" ? "#6600ff" : "#222";
  const lookDir = dir === "left" ? -1 : dir === "right" ? 1 : 0;
  ctx.fillRect(-4 + lookDir, eyeY + 0.5, 2, 2);
  ctx.fillRect(2 + lookDir, eyeY + 0.5, 2, 2);
  
  // Eyebrows
  ctx.fillStyle = hair;
  ctx.fillRect(-5, eyeY - 2, 4, 1.5);
  ctx.fillRect(1, eyeY - 2, 4, 1.5);
  
  // Mouth
  ctx.fillStyle = "#c08070";
  if (s === "hurt") {
    ctx.fillRect(-2, -5, 4, 2);
  } else if (s === "victory") {
    ctx.beginPath();
    ctx.arc(0, -5, 2, 0, Math.PI);
    ctx.fill();
  } else {
    ctx.fillRect(-2, -6, 4, 1.5);
  }

  ctx.restore(); // bob

  // --- EFFECTS OVERLAY ---
  if (isSkill) {
    ctx.save();
    const glowColor = char.id === "mage" ? "#b040ff" : char.id === "warrior" ? "#ff8800" : "#00d4ff";
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 20 + Math.sin(f * 0.5) * 10;
    ctx.fillStyle = glowColor;
    ctx.globalAlpha = 0.25 + Math.sin(f * 0.4) * 0.1;
    ctx.beginPath();
    ctx.arc(0, 4, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  
  if (s === "victory") {
    // Sparkles
    for (let i = 0; i < 6; i++) {
      const angle = (f * 0.1 + i * 1.05);
      const dist = 14 + Math.sin(f * 0.2 + i) * 4;
      ctx.fillStyle = ["#ffd700", "#fff", "#ff8800", "#ffff00"][i % 4];
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist - 8, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore(); // main
}

// ============================================================
// JOYSTICK COMPONENT
// ============================================================
function Joystick({ onMove }) {
  const baseRef = useRef(null);
  const thumbRef = useRef(null);
  const activeRef = useRef(false);
  const baseRect = useRef(null);

  const getPos = (e) => {
    const touch = e.touches ? e.touches[0] : e;
    return { x: touch.clientX, y: touch.clientY };
  };

  const handleStart = useCallback((e) => {
    e.preventDefault();
    activeRef.current = true;
    baseRect.current = baseRef.current.getBoundingClientRect();
    const pos = getPos(e);
    updateThumb(pos);
  }, [onMove]);

  const handleMove = useCallback((e) => {
    if (!activeRef.current) return;
    e.preventDefault();
    const pos = getPos(e);
    updateThumb(pos);
  }, [onMove]);

  const handleEnd = useCallback((e) => {
    e.preventDefault();
    activeRef.current = false;
    if (thumbRef.current) {
      thumbRef.current.style.transform = "translate(-50%, -50%)";
    }
    onMove(0, 0);
  }, [onMove]);

  const updateThumb = (pos) => {
    if (!baseRect.current || !thumbRef.current) return;
    const cx = baseRect.current.left + baseRect.current.width / 2;
    const cy = baseRect.current.top + baseRect.current.height / 2;
    const maxR = baseRect.current.width / 2 - 25;
    let dx = pos.x - cx;
    let dy = pos.y - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    thumbRef.current.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    onMove(dx / maxR, dy / maxR);
  };

  return (
    <div
      className="joystick-container"
      ref={baseRef}
      onMouseDown={handleStart}
      onMouseMove={handleMove}
      onMouseUp={handleEnd}
      onMouseLeave={handleEnd}
      onTouchStart={handleStart}
      onTouchMove={handleMove}
      onTouchEnd={handleEnd}
    >
      <div className="joystick-base">
        <div className="joystick-thumb" ref={thumbRef} />
      </div>
    </div>
  );
}

// ============================================================
// GAME WORLD
// ============================================================
function GameWorld({ character, onBack, t }) {
  const canvasRef = useRef(null);
  const playerRef = useRef({
    x: 450, y: 250,
    dir: "down",
    state: "idle_down",
    hp: character.stats.hp,
    maxHp: character.stats.hp,
    mp: character.stats.mp,
    maxMp: character.stats.mp,
    level: 1,
    xp: 0,
    nextXp: 50,
  });
  const frameRef = useRef(0);
  const animRef = useRef(null);
  const enemiesRef = useRef([]);
  const particlesRef = useRef([]);
  const damageNumbersRef = useRef([]);
  const skillCooldownsRef = useRef({});
  const [hud, setHud] = useState({
    hp: character.stats.hp,
    maxHp: character.stats.hp,
    mp: character.stats.mp,
    maxMp: character.stats.mp,
    level: 1,
    xp: 0,
    nextXp: 50,
    score: 0,
    state: "idle_down",
  });
  const [cooldowns, setCooldowns] = useState({});
  const [gameOver, setGameOver] = useState(false);
  const [victory, setVictory] = useState(false);

  // Initialize enemies
  useEffect(() => {
    enemiesRef.current = [
      { id: 1, type: "goblin", x: 200, y: 150, hp: 30, maxHp: 30 },
      { id: 2, type: "slime", x: 600, y: 200, hp: 20, maxHp: 20 },
      { id: 3, type: "bat", x: 700, y: 80, hp: 15, maxHp: 15 },
      { id: 4, type: "orc", x: 350, y: 320, hp: 60, maxHp: 60 },
      { id: 5, type: "skeleton", x: 750, y: 300, hp: 40, maxHp: 40 },
      { id: 6, type: "wolf", x: 500, y: 100, hp: 35, maxHp: 35 },
      { id: 7, type: "goblin", x: 100, y: 300, hp: 30, maxHp: 30 },
      { id: 8, type: "slime", x: 800, y: 150, hp: 20, maxHp: 20 },
    ];
  }, []);

  const spawnParticles = useCallback((x, y, color, count = 15, type = "circle") => {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4;
      particlesRef.current.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        decay: 0.015 + Math.random() * 0.03,
        color,
        size: 1.5 + Math.random() * 3,
        type,
      });
    }
  }, []);

  const spawnDamage = useCallback((x, y, value, isCrit = false) => {
    damageNumbersRef.current.push({
      x, y,
      value,
      life: 1,
      decay: 0.02,
      isCrit,
      id: Date.now() + Math.random(),
    });
  }, []);

  const useSkill = useCallback((skillId) => {
    const player = playerRef.current;
    const skill = SKILLS.find(s => s.id === skillId);
    if (!skill) return;
    if (player.mp < skill.mp) return;
    if (skillCooldownsRef.current[skillId] > Date.now()) return;

    player.mp -= skill.mp;
    skillCooldownsRef.current[skillId] = Date.now() + skill.cooldown;
    player.state = skillId;
    setCooldowns(prev => ({ ...prev, [skillId]: skill.cooldown }));

    // Animate cooldown
    const interval = setInterval(() => {
      const remaining = skillCooldownsRef.current[skillId] - Date.now();
      if (remaining <= 0) {
        clearInterval(interval);
        setCooldowns(prev => ({ ...prev, [skillId]: 0 }));
      } else {
        setCooldowns(prev => ({ ...prev, [skillId]: remaining }));
      }
    }, 100);

    // Skill effect
    spawnParticles(player.x, player.y, skill.color, 30, "spark");
    
    // Damage enemies in range
    const range = skill.id === "skill3" ? 150 : 80;
    enemiesRef.current.forEach(enemy => {
      const edata = ENEMIES.find(e => e.id === enemy.type);
      if (!edata) return;
      const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
      if (dist < range) {
        const dmg = Math.floor(character.stats.atk * skill.damage);
        enemy.hp -= dmg;
        spawnParticles(enemy.x, enemy.y, skill.color, 20, "circle");
        spawnDamage(enemy.x, enemy.y, dmg);
        if (enemy.hp <= 0) {
          player.xp += edata.xp;
          setHud(prev => {
            const newXp = prev.xp + edata.xp;
            if (newXp >= prev.nextXp) {
              player.level++;
              player.maxHp += 20;
              player.hp = player.maxHp;
              player.maxMp += 15;
              player.mp = player.maxMp;
              return {
                ...prev,
                xp: newXp - prev.nextXp,
                nextXp: Math.floor(prev.nextXp * 1.5),
                level: player.level,
                hp: player.hp,
                maxHp: player.maxHp,
                mp: player.mp,
                maxMp: player.maxMp,
              };
            }
            return { ...prev, xp: newXp };
          });
          enemy.hp = enemy.maxHp;
          enemy.x = Math.random() * 800 + 50;
          enemy.y = Math.random() * 350 + 50;
          spawnParticles(enemy.x, enemy.y, "#ffd700", 25, "circle");
          setHud(prev => ({ ...prev, score: prev.score + edata.xp }));
        }
      }
    });

    setTimeout(() => {
      if (player.state === skillId) {
        player.state = `idle_${player.dir}`;
      }
    }, 600);
  }, [character, spawnParticles, spawnDamage]);

  const attack = useCallback(() => {
    const player = playerRef.current;
    if (player.state.includes("attack") || player.state.includes("skill")) return;
    player.state = Math.random() > 0.5 ? "attack1" : "attack2";
    
    const range = 40;
    enemiesRef.current.forEach(enemy => {
      const edata = ENEMIES.find(e => e.id === enemy.type);
      if (!edata) return;
      const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
      if (dist < range + edata.size) {
        const isCrit = Math.random() < 0.15;
        const dmg = Math.floor(character.stats.atk * (isCrit ? 2 : 1));
        enemy.hp -= dmg;
        spawnParticles(enemy.x, enemy.y, edata.color, 12, "circle");
        spawnDamage(enemy.x, enemy.y, dmg, isCrit);
        if (enemy.hp <= 0) {
          player.xp += edata.xp;
          setHud(prev => {
            const newXp = prev.xp + edata.xp;
            if (newXp >= prev.nextXp) {
              player.level++;
              player.maxHp += 20;
              player.hp = player.maxHp;
              player.maxMp += 15;
              player.mp = player.maxMp;
              spawnParticles(player.x, player.y, "#ffd700", 40, "spark");
              return {
                ...prev,
                xp: newXp - prev.nextXp,
                nextXp: Math.floor(prev.nextXp * 1.5),
                level: player.level,
                hp: player.hp,
                maxHp: player.maxHp,
                mp: player.mp,
                maxMp: player.maxMp,
              };
            }
            return { ...prev, xp: newXp };
          });
          enemy.hp = enemy.maxHp;
          enemy.x = Math.random() * 800 + 50;
          enemy.y = Math.random() * 350 + 50;
          spawnParticles(enemy.x, enemy.y, "#ffd700", 25, "circle");
          setHud(prev => ({ ...prev, score: prev.score + edata.xp }));
        }
      }
    });

    setTimeout(() => {
      if (player.state.includes("attack")) {
        player.state = `idle_${player.dir}`;
      }
    }, 450);
  }, [character, spawnParticles, spawnDamage]);

  // Joystick movement handler
  const handleJoystickMove = useCallback((dx, dy) => {
    const player = playerRef.current;
    if (gameOver || victory) return;
    const speed = 3;
    player.x += dx * speed;
    player.y += dy * speed;
    player.x = Math.max(25, Math.min(875, player.x));
    player.y = Math.max(25, Math.min(425, player.y));
    
    if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
      if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? "right" : "left";
      else player.dir = dy > 0 ? "down" : "up";
      if (!player.state.includes("attack") && !player.state.includes("skill") && !player.state.includes("hurt")) {
        player.state = `run_${player.dir}`;
      }
    } else {
      if (!player.state.includes("attack") && !player.state.includes("skill") && !player.state.includes("hurt")) {
        player.state = `idle_${player.dir}`;
      }
    }
  }, [gameOver, victory]);

  // Keyboard handler
  useEffect(() => {
    const keys = {};
    const handleKeyDown = (e) => {
      keys[e.key] = true;
      if (e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        attack();
      }
      if (e.key === "1") useSkill("skill1");
      if (e.key === "2") useSkill("skill2");
      if (e.key === "3") useSkill("skill3");
    };
    const handleKeyUp = (e) => { keys[e.key] = false; };
    window.addEventListener("keydown", handleKeyDown);
    window.addEventListener("keyup", handleKeyUp);

    const keyInterval = setInterval(() => {
      const player = playerRef.current;
      if (gameOver || victory) return;
      if (player.state.includes("attack") || player.state.includes("skill") || player.state.includes("hurt")) return;
      
      let dx = 0, dy = 0;
      if (keys["ArrowUp"] || keys["w"]) dy = -1;
      if (keys["ArrowDown"] || keys["s"]) dy = 1;
      if (keys["ArrowLeft"] || keys["a"]) dx = -1;
      if (keys["ArrowRight"] || keys["d"]) dx = 1;
      
      if (dx !== 0 || dy !== 0) {
        const speed = 3;
        const len = Math.sqrt(dx*dx + dy*dy);
        player.x += (dx/len) * speed;
        player.y += (dy/len) * speed;
        player.x = Math.max(25, Math.min(875, player.x));
        player.y = Math.max(25, Math.min(425, player.y));
        if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? "right" : "left";
        else player.dir = dy > 0 ? "down" : "up";
        player.state = `run_${player.dir}`;
      } else {
        player.state = `idle_${player.dir}`;
      }
    }, 16);

    return () => {
      window.removeEventListener("keydown", handleKeyDown);
      window.removeEventListener("keyup", handleKeyUp);
      clearInterval(keyInterval);
    };
  }, [attack, useSkill, gameOver, victory]);

  // MP regen
  useEffect(() => {
    const regenInterval = setInterval(() => {
      const player = playerRef.current;
      if (player.mp < player.maxMp) {
        player.mp = Math.min(player.maxMp, player.mp + 1);
        setHud(prev => ({ ...prev, mp: player.mp }));
      }
    }, 500);
    return () => clearInterval(regenInterval);
  }, []);

  // Main game loop
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = 900, H = 450;

    const loop = () => {
      ctx.clearRect(0, 0, W, H);
      const player = playerRef.current;

      // Background
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, "#1a2a4a");
      skyGrad.addColorStop(0.4, "#2a3a5a");
      skyGrad.addColorStop(0.7, "#2a4a3a");
      skyGrad.addColorStop(1, "#1a3a1a");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      // Stars
      for (let i = 0; i < 30; i++) {
        const sx = (i * 37 + 13) % W;
        const sy = (i * 23 + 7) % (H * 0.4);
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(frameRef.current * 0.02 + i) * 0.3})`;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Mountains
      ctx.fillStyle = "#1a2a3a";
      ctx.beginPath();
      ctx.moveTo(0, 350);
      ctx.lineTo(100, 250);
      ctx.lineTo(250, 320);
      ctx.lineTo(400, 220);
      ctx.lineTo(550, 300);
      ctx.lineTo(700, 240);
      ctx.lineTo(900, 310);
      ctx.lineTo(900, 450);
      ctx.lineTo(0, 450);
      ctx.closePath();
      ctx.fill();

      // Ground
      ctx.fillStyle = "#2a5a2a";
      ctx.fillRect(0, 360, W, 90);
      
      // Grass details
      ctx.fillStyle = "#3a7a3a";
      for (let i = 0; i < W; i += 30) {
        ctx.fillRect(i, 358, 15, 4);
      }
      
      // Path
      ctx.fillStyle = "#8a7a5a";
      ctx.beginPath();
      ctx.moveTo(0, 380);
      ctx.quadraticCurveTo(W/2, 350, W, 370);
      ctx.lineTo(W, 400);
      ctx.quadraticCurveTo(W/2, 380, 0, 410);
      ctx.closePath();
      ctx.fill();

      // Trees
      [60, 180, 320, 480, 620, 780].forEach((tx, i) => {
        const ty = 300 + Math.sin(i * 1.5) * 20;
        const sway = Math.sin(frameRef.current * 0.02 + i) * 3;
        ctx.save();
        ctx.translate(sway, 0);
        ctx.fillStyle = "#4a2a1a";
        ctx.fillRect(tx - 5, ty, 10, 50);
        // Canopy layers
        ctx.fillStyle = "#1a5a1a";
        ctx.beginPath();
        ctx.moveTo(tx, ty - 30);
        ctx.lineTo(tx - 25, ty + 5);
        ctx.lineTo(tx + 25, ty + 5);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#2a7a2a";
        ctx.beginPath();
        ctx.moveTo(tx, ty - 20);
        ctx.lineTo(tx - 18, ty + 2);
        ctx.lineTo(tx + 18, ty + 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Bushes
      [120, 400, 650, 820].forEach(bx => {
        ctx.fillStyle = "#2a6a2a";
        ctx.beginPath();
        ctx.arc(bx, 355, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#3a8a3a";
        ctx.beginPath();
        ctx.arc(bx + 6, 352, 8, 0, Math.PI * 2);
        ctx.fill();
      });

      // Flowers
      [90, 280, 520, 700].forEach(fx => {
        ctx.fillStyle = ["#ff6688", "#ffaa44", "#ffdd88", "#ff88aa"][Math.floor(fx/100) % 4];
        ctx.beginPath();
        ctx.arc(fx, 358, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemy AI + Draw
      enemiesRef.current.forEach(enemy => {
        const edata = ENEMIES.find(e => e.id === enemy.type);
        if (!edata) return;
        
        // AI Movement
        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (dist < 250 && dist > edata.size) {
          const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
          const speed = enemy.type === "bat" ? 1.5 : enemy.type === "wolf" ? 1.4 : 0.7;
          enemy.x += Math.cos(angle) * speed;
          enemy.y += Math.sin(angle) * speed;
          enemy.x = Math.max(25, Math.min(875, enemy.x));
          enemy.y = Math.max(25, Math.min(425, enemy.y));
        }
        
        // Damage player on contact
        if (dist < edata.size + 10 && frameRef.current % 45 === 0) {
          player.hp -= edata.atk;
          if (player.hp <= 0) {
            player.hp = 0;
            player.state = "death";
          } else if (!player.state.includes("hurt")) {
            player.state = "hurt";
            setTimeout(() => {
              if (player.state === "hurt") player.state = `idle_${player.dir}`;
            }, 400);
          }
          spawnParticles(player.x, player.y, "#ff4444", 8, "circle");
          spawnDamage(player.x, player.y, edata.atk);
        }

        // Draw enemy
        const bob = Math.sin(frameRef.current * 0.04 + enemy.x) * 2;
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath();
        ctx.ellipse(enemy.x, enemy.y + edata.size/2, edata.size/2, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = edata.color;
        ctx.shadowColor = edata.color;
        ctx.shadowBlur = 6;
        
        if (enemy.type === "slime") {
          ctx.beginPath();
          ctx.arc(enemy.x, enemy.y + bob, edata.size/2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.3)";
          ctx.beginPath();
          ctx.arc(enemy.x - 4, enemy.y - 4, 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (enemy.type === "bat") {
          const wingFlap = Math.sin(frameRef.current * 0.1 + enemy.x) * 8;
          ctx.beginPath();
          ctx.ellipse(enemy.x, enemy.y + bob, edata.size/3, edata.size/2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(enemy.x - 8, enemy.y - 4 + wingFlap, 10, 5, -0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(enemy.x + 8, enemy.y - 4 - wingFlap, 10, 5, 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ff4444";
          ctx.fillRect(enemy.x - 3, enemy.y - edata.size/2, 2, 3);
          ctx.fillRect(enemy.x + 1, enemy.y - edata.size/2, 2, 3);
        } else if (enemy.type === "wolf") {
          ctx.fillStyle = edata.color;
          ctx.beginPath();
          ctx.ellipse(enemy.x, enemy.y + bob, edata.size/2, edata.size/3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(enemy.x - edata.size/3, enemy.y - edata.size/4 + bob, edata.size/4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ff4444";
          ctx.fillRect(enemy.x - edata.size/3 - 3, enemy.y - edata.size/3 + bob, 2, 2);
          ctx.fillRect(enemy.x - edata.size/3 + 1, enemy.y - edata.size/3 + bob, 2, 2);
        } else {
          ctx.fillRect(enemy.x - edata.size/3, enemy.y - edata.size/2 + bob, edata.size*2/3, edata.size/2);
          ctx.beginPath();
          ctx.arc(enemy.x, enemy.y - edata.size/2 + bob, edata.size/3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.fillRect(enemy.x - 5, enemy.y - edata.size/2 - 2 + bob, 3, 3);
          ctx.fillRect(enemy.x + 2, enemy.y - edata.size/2 - 2 + bob, 3, 3);
          ctx.fillStyle = "#222";
          ctx.fillRect(enemy.x - 4, enemy.y - edata.size/2 - 1 + bob, 2, 2);
          ctx.fillRect(enemy.x + 3, enemy.y - edata.size/2 - 1 + bob, 2, 2);
        }
        ctx.shadowBlur = 0;

        // HP bar
        const hpPct = enemy.hp / enemy.maxHp;
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(enemy.x - 15, enemy.y - edata.size/2 - 14, 30, 4);
        ctx.fillStyle = hpPct > 0.5 ? "#39ff14" : hpPct > 0.25 ? "#ffaa00" : "#ff2244";
        ctx.fillRect(enemy.x - 15, enemy.y - edata.size/2 - 14, 30 * hpPct, 4);
        
        ctx.fillStyle = "#fff";
        ctx.font = "6px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText(edata.name, enemy.x, enemy.y - edata.size/2 - 16);
        ctx.textAlign = "start";
      });

      // Draw player
      if (player.hp > 0 || player.state === "death") {
        drawCharacter(ctx, player.x, player.y, 2.0, player.dir, frameRef.current * 0.3, player.state, character);
      }

      // Draw particles
      particlesRef.current = particlesRef.current.filter(p => p.life > 0);
      for (const p of particlesRef.current) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy += 0.05;
        p.life -= p.decay;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.size * 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Damage numbers
      damageNumbersRef.current = damageNumbersRef.current.filter(d => d.life > 0);
      for (const d of damageNumbersRef.current) {
        d.y -= 1.5;
        d.life -= d.decay;
        ctx.save();
        ctx.globalAlpha = Math.max(0, d.life);
        ctx.font = d.isCrit ? "bold 14px Orbitron" : "11px Orbitron";
        ctx.fillStyle = d.isCrit ? "#ffcc00" : "#ff4444";
        ctx.shadowColor = d.isCrit ? "#ff8800" : "#ff0000";
        ctx.shadowBlur = 6;
        ctx.textAlign = "center";
        ctx.fillText(d.isCrit ? `CRIT! ${d.value}` : `-${d.value}`, d.x, d.y);
        ctx.restore();
      }

      // Update HUD periodically
      if (frameRef.current % 10 === 0) {
        setHud(prev => ({
          ...prev,
          hp: player.hp,
          mp: player.mp,
          state: player.state,
        }));
      }

      // Check game over
      if (player.hp <= 0 && !gameOver) {
        setGameOver(true);
      }

      frameRef.current++;
      animRef.current = requestAnimationFrame(loop);
    };

    animRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(animRef.current);
  }, [character, spawnParticles, spawnDamage, gameOver]);

  return (
    <div className="game-world">
      <canvas ref={canvasRef} width={900} height={450} />
      
      {/* HUD */}
      <div className="game-hud-top">
        <div className="hud-panel" style={{ minWidth: 160 }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span>{character.name}</span>
            <span>{t.level}{hud.level}</span>
          </div>
          <div style={{ fontSize: 8, color: "#aaa" }}>❤️ HP</div>
          <div className="hp-bar-bg">
            <div className="hp-bar-fill" style={{ width: `${(hud.hp / hud.maxHp) * 100}%` }} />
          </div>
          <div style={{ fontSize: 8, color: "#aaa", marginTop: 3 }}>💎 MP</div>
          <div className="hp-bar-bg">
            <div className="mp-bar-fill" style={{ width: `${(hud.mp / hud.maxMp) * 100}%` }} />
          </div>
          <div style={{ fontSize: 7, color: "#5a3a8a", marginTop: 3 }}>
            XP: {hud.xp}/{hud.nextXp} | ⭐ {hud.score}
          </div>
        </div>
        <div className="hud-panel" style={{ fontSize: 8 }}>
          {ANIM_STATES[hud.state] ? hud.state.replace(/_/g, " ") : hud.state}
        </div>
      </div>

      {/* Joystick */}
      <Joystick onMove={handleJoystickMove} />

      {/* Skill Buttons */}
      <div className="skill-buttons">
        <div className="skill-row">
          {SKILLS.map(skill => {
            const cdRemaining = cooldowns[skill.id] || 0;
            const canUse = hud.mp >= skill.mp && cdRemaining === 0;
            return (
              <button
                key={skill.id}
                className="skill-btn"
                style={{
                  borderColor: canUse ? skill.color : "#444",
                  opacity: canUse ? 1 : 0.5,
                  color: skill.color,
                }}
                onClick={() => useSkill(skill.id)}
                disabled={!canUse}
              >
                {skill.icon}
                {cdRemaining > 0 && (
                  <div className="cooldown">
                    {Math.ceil(cdRemaining / 1000)}s
                  </div>
                )}
                <span className="skill-label">{skill.mp}MP</span>
              </button>
            );
          })}
        </div>
        <button
          className="skill-btn attack-btn"
          onClick={attack}
          style={{ alignSelf: "center" }}
        >
          ⚔️
          <span className="skill-label" style={{ bottom: -16 }}>ATK</span>
        </button>
      </div>

      {/* Back button */}
      <button className="back-btn" onClick={onBack}>{t.back}</button>

      {/* Game Over */}
      {gameOver && (
        <div style={{
          position: "absolute", inset: 0, background: "rgba(0,0,0,0.8)",
          display: "flex", alignItems: "center", justifyContent: "center",
          zIndex: 50, flexDirection: "column",
        }}>
          <div style={{ fontSize: 36, color: "#ff2244", fontFamily: "Orbitron", fontWeight: 900, marginBottom: 8 }}>
            {t.gameOver}
          </div>
          <div style={{ color: "#fff", fontFamily: "Orbitron", fontSize: 16, marginBottom: 6 }}>
            {t.level}{hud.level} · {t.score}: {hud.score}
          </div>
          <button onClick={onBack} style={{
            background: "linear-gradient(135deg, #6c3fc5, #b040ff)",
            border: "none", color: "#fff", padding: "12px 28px", borderRadius: 10,
            fontFamily: "Orbitron", fontSize: 12, cursor: "pointer", marginTop: 10,
          }}>{t.retry}</button>
        </div>
      )}
    </div>
  );
}

// ============================================================
// OTHER PAGES
// ============================================================
function HomePage({ onPlay, t }) {
  const [selected, setSelected] = useState(null);
  return (
    <div className="home-page">
      <h2 style={{ fontFamily: "Orbitron", color: "#c090ff", fontSize: 16, marginBottom: 4 }}>{t.select}</h2>
      <p style={{ color: "#5a3a8a", fontSize: 9, marginBottom: 16 }}>{t.choose}</p>
      <div className="character-select">
        {CHARACTERS.map(c => (
          <div key={c.id} className={`char-card ${selected?.id === c.id ? "selected" : ""}`}
            onClick={() => setSelected(c)}>
            <div className="char-avatar" style={{ background: `${c.color}22`, border: `2px solid ${c.color}` }}>
              {c.icon}
            </div>
            <div className="char-name">{c.name}</div>
            <div style={{ color: c.color, fontSize: 9, fontFamily: "Orbitron" }}>{c.className}</div>
            <div style={{ fontSize: 8, color: "#5a3a8a", marginTop: 4 }}>
              ❤️{c.stats.hp} ⚔️{c.stats.atk} 🛡️{c.stats.def} ⚡{c.stats.spd}
            </div>
          </div>
        ))}
      </div>
      {selected && (
        <div style={{ background: "rgba(20,10,40,0.8)", border: `1px solid ${selected.color}44`, borderRadius: 10, padding: 12, maxWidth: 450, margin: "0 auto 16px" }}>
          <p style={{ color: "#8060aa", fontSize: 9 }}>{selected.desc}</p>
        </div>
      )}
      <button className="play-btn" disabled={!selected} onClick={() => selected && onPlay(selected)}>
        {t.play}
      </button>
    </div>
  );
}

function ItemsPage({ t }) {
  return (
    <div className="items-page">
      <h2 style={{ fontFamily: "Orbitron", color: "#c090ff", fontSize: 14, marginBottom: 12 }}>{t.inv}</h2>
      <div className="items-grid">
        {ITEMS.map(item => (
          <div key={item.id} className="item-slot">
            <div className="item-icon">{item.icon}</div>
            <div style={{ fontFamily: "Orbitron", fontSize: 8, color: item.color }}>{item.name}</div>
            <div style={{ fontSize: 7, color: "#5a3a8a" }}>{item.desc}</div>
            <span style={{ fontSize: 6, color: item.color, textTransform: "uppercase", letterSpacing: 1 }}>
              {item.rarity}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function InfoPage({ t }) {
  return (
    <div className="info-page">
      <h2 style={{ fontFamily: "Orbitron", color: "#c090ff", fontSize: 14, marginBottom: 10 }}>{t.animInfo}</h2>
      <p style={{ fontSize: 9, color: "#8060aa", marginBottom: 12 }}>{t.animDesc}</p>
      <div className="info-section">
        <h3>{t.states} ({Object.keys(ANIM_STATES).length})</h3>
        <ul style={{ listStyle: "none", padding: 0 }}>
          {Object.entries(ANIM_STATES).map(([k, v]) => (
            <li key={k}>{k.replace(/_/g, " ")} · {v.frames}f · {v.fps}fps · {v.loop ? "LOOP" : "ONCE"}</li>
          ))}
        </ul>
      </div>
      <div className="info-section">
        <h3>{t.skills} ({SKILLS.length})</h3>
        <ul style={{ listStyle: "none", padding: 0 }}>
          {SKILLS.map(s => (
            <li key={s.id}>{s.icon} {s.name} · {s.desc} · CD: {s.cooldown/1000}s · MP: {s.mp}</li>
          ))}
        </ul>
      </div>
      <div className="info-section">
        <h3>{t.enemies} ({ENEMIES.length})</h3>
        <ul style={{ listStyle: "none", padding: 0 }}>
          {ENEMIES.map(e => (
            <li key={e.id}>{e.name} · HP:{e.hp} · ATK:{e.atk}</li>
          ))}
        </ul>
      </div>
    </div>
  );
}

function LanguagePage({ lang, setLang }) {
  return (
    <div className="language-page">
      <h2 style={{ fontFamily: "Orbitron", color: "#c090ff", fontSize: 16 }}>🌐 Language</h2>
      <div style={{ marginTop: 16 }}>
        {Object.entries(LANGUAGES).map(([code, l]) => (
          <button key={code} className={`lang-btn ${lang === code ? "active" : ""}`}
            onClick={() => setLang(code)}>
            {l.flag} {l.name}
          </button>
        ))}
      </div>
    </div>
  );
}

function AboutPage({ t }) {
  return (
    <div className="about-page">
      <div style={{ fontSize: 50, marginBottom: 8 }}>⚔️</div>
      <h2 style={{ fontFamily: "Orbitron", color: "#fff", fontSize: 18 }}>{t.aboutTitle}</h2>
      <p style={{ color: "#5a3a8a", fontSize: 9, marginBottom: 16 }}>{t.version}</p>
      <div style={{ background: "rgba(20,10,40,0.6)", border: "1px solid rgba(108,63,197,0.3)", borderRadius: 10, padding: 16, maxWidth: 450, margin: "0 auto", textAlign: "left" }}>
        <p style={{ fontSize: 9, color: "#8060aa", marginBottom: 6 }}>{t.engine}</p>
        <p style={{ fontSize: 8, color: "#5a3a8a" }}>🎨 Enhanced Pixel Art Characters</p>
        <p style={{ fontSize: 8, color: "#5a3a8a" }}>🎮 Virtual Joystick + Skill Buttons</p>
        <p style={{ fontSize: 8, color: "#5a3a8a" }}>✨ Particle FX System</p>
        <p style={{ fontSize: 8, color: "#5a3a8a" }}>🌍 Open World with Enemy AI</p>
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [page, setPage] = useState("home");
  const [lang, setLang] = useState("en");
  const [character, setCharacter] = useState(null);
  const t = T[lang] || T.en;

  return (
    <div className="game-container">
      <div className="header">
        <div className="logo">⚔️ RPG ADVENTURE</div>
        <nav className="nav-menu">
          {["home", "items", "info", "language", "about"].map(p => (
            <button key={p} className={`nav-btn ${page === p ? "active" : ""}`}
              onClick={() => setPage(p)}>
              {t[p]}
            </button>
          ))}
        </nav>
      </div>
      <div className="content-area">
        {page === "home" && !character && <HomePage onPlay={(c) => { setCharacter(c); setPage("game"); }} t={t} />}
        {page === "game" && character && <GameWorld character={character} onBack={() => { setCharacter(null); setPage("home"); }} t={t} />}
        {page === "items" && <ItemsPage t={t} />}
        {page === "info" && <InfoPage t={t} />}
        {page === "language" && <LanguagePage lang={lang} setLang={setLang} />}
        {page === "about" && <AboutPage t={t} />}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
