<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ARCADE COMBAT MOBILE · 3 HEROES</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    }
    body {
      background: #000; width: 100vw; height: 100vh; overflow: hidden;
      position: fixed; top: 0; left: 0; touch-action: manipulation; font-family: Arial, sans-serif;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  (function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ==================== AUDIO ====================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    function sfx(f, t, d, v) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = t || 'square';
        o.frequency.value = f || 440;
        g.gain.setValueAtTime(v || 0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch(e) {}
    }

    // ==================== FIGHTER DATA ====================
    const FIGHTERS = [
      { id:0, name:'FLAME KNIGHT', color:'#e74c3c', secColor:'#ff6b35', hp:105, atk:13, def:7,
        moves: {
          lp:{dmg:5, range:60, speed:10, kb:2, height:'mid'},
          hp:{dmg:9, range:70, speed:16, kb:5, height:'high'},
          lk:{dmg:6, range:65, speed:12, kb:3, height:'low'},
          hk:{dmg:11, range:75, speed:18, kb:7, height:'mid'},
          sp:{dmg:8, cost:20, effect:'fire', height:'mid'},
          ult:{dmg:42, cost:90, effect:'fire', height:'mid'}
        }},
      { id:1, name:'THUNDER MONK', color:'#f39c12', secColor:'#3498db', hp:90, atk:12, def:8,
        moves: {
          lp:{dmg:4, range:55, speed:8, kb:2, height:'mid'},
          hp:{dmg:8, range:65, speed:14, kb:4, height:'high'},
          lk:{dmg:5, range:60, speed:10, kb:3, height:'low'},
          hk:{dmg:10, range:70, speed:16, kb:6, height:'mid'},
          sp:{dmg:7, cost:20, effect:'stun', height:'mid'},
          ult:{dmg:38, cost:90, effect:'stun', height:'mid'}
        }},
      { id:2, name:'BEAST WARRIOR', color:'#27ae60', secColor:'#f1c40f', hp:115, atk:15, def:10,
        moves: {
          lp:{dmg:6, range:65, speed:12, kb:3, height:'mid'},
          hp:{dmg:10, range:75, speed:18, kb:6, height:'high'},
          lk:{dmg:7, range:70, speed:14, kb:4, height:'low'},
          hk:{dmg:12, range:80, speed:20, kb:8, height:'mid'},
          sp:{dmg:9, cost:20, effect:'bleed', height:'mid'},
          ult:{dmg:45, cost:90, effect:'bleed', height:'mid'}
        }}
    ];

    const STAGES = [
      { name:'City', sky:'#1a1a2e', ground:'#2c3e50' },
      { name:'Temple', sky:'#3e2723', ground:'#4e342e' },
      { name:'Forest', sky:'#1b5e20', ground:'#2e7d32' }
    ];

    // ==================== GAME STATE ====================
    const STATE = { MENU:0, SELECT:1, FIGHT:2 };
    let gameState = STATE.MENU;
    let menuOption = 0;
    let selP1 = 0, selP2 = 1;
    let currentStage = STAGES[0];
    let difficulty = 'Normal';
    let frame = 0, shakeTimer = 0;
    let particles = [], hitEffects = [];
    let winner = null, winTimer = 0;
    let comboCount = 0, comboTimer = 0;
    let paused = false;
    let pauseMenuOption = 0;
    let lastTapTime = 0; // Untuk double-tap pause

    function spawnParticles(x,y,count,color,spread,life){
      for(let i=0;i<count;i++) particles.push({x,y,color,vx:(Math.random()-0.5)*(spread||8),vy:(Math.random()-0.5)*(spread||8)-4,life:life||25,maxLife:life||25,size:2+Math.random()*6});
    }
    function spawnHitEffect(x,y,damage,color){
      hitEffects.push({x,y,text:Math.floor(damage),color:color||'#fff',life:35,vy:-4});
    }

    class Fighter {
      constructor(data, x, dir) {
        this.data = data; this.x = x; this.y = 0; this.groundY = 0;
        this.w = 70; this.h = 100; this.hp = data.hp; this.maxHp = data.hp;
        this.meter = 0; this.dir = dir; this.vx = 0; this.vy = 0;
        this.grounded = true; this.blocking = false; this.crouching = false;
        this.atkCD = 0; this.stun = 0;
        this.state = 'idle'; this.animTimer = 0; this.invincible = false;
        this.attackPhase = 0; this.attackPhaseTimer = 0; this.attackLunge = 0;
        this.burning = 0; this.bleeding = 0; this.frozen = 0;
        this.aiCooldown = 0;
        this.projectile = null;
      }

      update() {
        if(paused) return;
        this.animTimer++;
        if(this.burning>0){ this.burning--; if(this.animTimer%10===0) this.hp=Math.max(0,this.hp-1); }
        if(this.bleeding>0){ this.bleeding--; if(this.animTimer%8===0) this.hp=Math.max(0,this.hp-3); }
        if(this.frozen>0){ this.frozen--; this.vx*=0.5; }
        if(this.stun>0) this.stun--;
        if(this.atkCD>0) this.atkCD--;
        if(this.aiCooldown>0) this.aiCooldown--;

        if(this.attackPhaseTimer>0){
          this.attackPhaseTimer--;
          if(this.attackPhase===1) this.attackLunge = -8;
          else if(this.attackPhase===2) this.attackLunge = 15;
          else if(this.attackPhase===3) this.attackLunge *= 0.7;
          if(this.attackPhaseTimer<=0 && this.attackPhase<3) this.advancePhase();
          if(this.attackPhaseTimer<=0 && this.attackPhase===3) this.resetAttack();
        } else { this.attackLunge *= 0.8; }

        this.x += this.vx;
        if(!this.grounded){ this.vy+=0.8; this.y+=this.vy; if(this.y>=this.groundY){ this.y=this.groundY; this.vy=0; this.grounded=true; this.invincible=false; } }
        if(this.x<20) this.x=20; if(this.x>canvas.width-90) this.x=canvas.width-90;
        if(this.atkCD<=0 && this.stun<=0 && this.attackPhase===0) this.state='idle';
        
        if(this.projectile){
          this.projectile.x += this.projectile.vx;
          if(this.projectile.x < -50 || this.projectile.x > canvas.width+50) this.projectile = null;
        }
      }

      advancePhase(){
        if(this.attackPhase===1){ this.attackPhase=2; this.attackPhaseTimer=6; }
        else if(this.attackPhase===2){ this.attackPhase=3; this.attackPhaseTimer=5; }
      }
      resetAttack(){
        this.attackPhase=0; this.attackPhaseTimer=0; this.attackLunge=0;
        if(this.atkCD<=0 && this.stun<=0) this.state='idle';
      }

      jump(){ if(this.grounded){ this.vy=-12; this.grounded=false; this.state='jump'; sfx(400,'sine',0.12,0.1); } }
      crouch(){ if(this.grounded){ this.crouching=true; this.state='crouch'; this.vx=0; } }
      stand(){ this.crouching=false; if(this.state==='crouch') this.state='idle'; }

      hit(dmg, kb, effect, attackerHeight) {
        if(this.invincible) return false;
        let finalDmg = dmg;
        if(this.crouching && (attackerHeight === 'high' || attackerHeight === 'mid')) {
          if(attackerHeight === 'high') { finalDmg = 0; spawnParticles(this.x+35, this.y+30, 5, '#aaa', 3, 15); return false; }
          else finalDmg *= 0.5;
        }
        if(!this.grounded && attackerHeight === 'low') {
          finalDmg = 0; spawnParticles(this.x+35, this.y+60, 5, '#aaa', 3, 15); return false;
        }
        if(this.blocking) { finalDmg *= 0.2; spawnParticles(this.x+35, this.y+40, 5, '#3498db', 4, 12); sfx(250,'triangle',0.08,0.06); }
        if(finalDmg > 0) {
          this.hp = Math.max(0, this.hp - finalDmg);
          this.meter = Math.min(100, this.meter + finalDmg*0.8);
          this.stun = (kb>5) ? 15 : 8;
          if(effect && !this.blocking){ if(effect==='fire') this.burning=60; if(effect==='stun') this.stun=25; if(effect==='bleed') this.bleeding=50; }
          if(kb && !this.blocking){ this.vx = kb*4; if(kb>6){ this.vy=-5; this.grounded=false; } }
          spawnHitEffect(this.x+35, this.y, finalDmg, '#fff');
          spawnParticles(this.x+35, this.y+40, 8, '#fff', 5, 15);
          sfx(180,'triangle',0.1,0.08);
          return true;
        }
        return false;
      }

      draw(ctx){
        ctx.save(); 
        let sx = shakeTimer>0 ? (Math.random()-0.5)*8 : 0;
        let sy = shakeTimer>0 ? (Math.random()-0.5)*6 : 0;
        let scaleY = this.crouching ? 0.7 : 1;
        let offsetY = this.crouching ? 15 : 0;
        let lunge = this.attackLunge * this.dir;
        ctx.translate(this.x+sx+lunge+this.w/2, this.y+sy+offsetY+this.h/2);
        if(this.dir<0) ctx.scale(-1,1);
        ctx.scale(1, scaleY);
        ctx.translate(-this.w/2, -this.h/2);
        if(this.invincible && Math.floor(this.animTimer/2)%2===0) ctx.globalAlpha=0.4;
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(this.w/2, this.h+2, 25,5,0,0,Math.PI*2); ctx.fill();
        this.drawCharacter(ctx);
        ctx.restore();
      }

      drawCharacter(ctx){
        let w=this.w, h=this.h, isAtk=this.attackPhase===2;
        if(this.data.id===0) {
          ctx.fillStyle='#555'; ctx.fillRect(15,h-30,15,30); ctx.fillRect(w-30,h-30,15,30);
          ctx.fillStyle='#c0392b'; ctx.fillRect(15,15,w-30,h-45);
          ctx.fillStyle='#bdc3c7'; ctx.fillRect(isAtk?w-5:w-10,20,isAtk?25:15,5);
          if(isAtk){ ctx.fillStyle='#ff6b35'; ctx.fillRect(w+15,6,16,10); }
          ctx.fillStyle='#555'; ctx.beginPath(); ctx.arc(w/2,10,14,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='#ff6b35'; ctx.beginPath(); ctx.arc(w/2-4,8,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/2+4,8,3,0,Math.PI*2); ctx.fill();
        } else if(this.data.id===1) {
          ctx.fillStyle='#f39c12'; ctx.beginPath(); ctx.moveTo(15,20); ctx.lineTo(w-15,20); ctx.lineTo(w-10,h-25); ctx.lineTo(10,h-25); ctx.closePath(); ctx.fill();
          ctx.fillStyle='#d35400'; ctx.fillRect(20,h-28,10,28); ctx.fillRect(w-30,h-28,10,28);
          ctx.fillStyle='#f39c12'; ctx.fillRect(w-10,20,14,10); ctx.fillRect(5,20,14,10);
          if(isAtk){ ctx.fillStyle='#3498db'; ctx.fillRect(w+5,16,10,16); }
          ctx.fillStyle='#f5cba7'; ctx.beginPath(); ctx.arc(w/2,10,13,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='#3498db'; ctx.beginPath(); ctx.arc(w/2-4,8,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/2+4,8,3,0,Math.PI*2); ctx.fill();
        } else {
          ctx.fillStyle='#27ae60'; ctx.fillRect(10,18,w-20,h-40);
          ctx.fillStyle='#1e8449'; ctx.fillRect(15,h-28,16,28); ctx.fillRect(w-31,h-28,16,28);
          ctx.fillStyle='#27ae60'; ctx.fillRect(w-12,18,16,14); ctx.fillRect(5,18,16,14);
          if(isAtk){ ctx.fillStyle='#f1c40f'; for(let i=0;i<4;i++) ctx.fillRect(w+5+i*5,14,3,14); }
          ctx.fillStyle='#27ae60'; ctx.beginPath(); ctx.arc(w/2,8,15,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.arc(w/2-5,6,3.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/2+5,6,3.5,0,Math.PI*2); ctx.fill();
        }
      }
    }

    let p1=null, p2=null;
    function createPlayers(){
      p1=new Fighter(FIGHTERS[selP1], canvas.width*0.2, 1);
      p2=new Fighter(FIGHTERS[selP2], canvas.width*0.7, -1);
      p1.groundY=p2.groundY=canvas.height-130; p1.y=p1.groundY; p2.y=p2.groundY;
      particles=[]; hitEffects=[]; shakeTimer=0; winner=null; winTimer=0; comboCount=0; paused=false; pauseMenuOption=0;
    }

    // Tombol mobile yang lebih besar
    let buttons=[];
    function createButtons(){
      let w=canvas.width, h=canvas.height;
      let bs = Math.min(75, h*0.15); // Lebih besar untuk jempol
      let gap = 12;
      let bottomY = h - bs*3 - gap*3;
      
      buttons=[
        // MOVEMENT - Kiri bawah (D-Pad style)
        {id:'left', x:gap, y:bottomY+bs+gap, w:bs, h:bs, label:'◀', color:'rgba(255,255,255,0.15)'},
        {id:'right', x:gap*2+bs, y:bottomY+bs+gap, w:bs, h:bs, label:'▶', color:'rgba(255,255,255,0.15)'},
        {id:'jump', x:gap, y:bottomY, w:bs, h:bs, label:'⬆', color:'rgba(46,204,113,0.2)'},
        {id:'crouch', x:gap*2+bs, y:bottomY, w:bs, h:bs, label:'⬇', color:'rgba(46,204,113,0.2)'},
        {id:'block', x:gap, y:h-bs-gap, w:bs*2+gap, h:bs*0.7, label:'🛡 BLOCK', color:'rgba(41,128,185,0.2)'},
        // ATTACKS - Kanan bawah (Action buttons)
        {id:'lp', x:w-bs*2-gap*2, y:bottomY+bs+gap, w:bs, h:bs, label:'LP', color:'rgba(231,76,60,0.2)'},
        {id:'hp', x:w-bs-gap, y:bottomY+bs+gap, w:bs, h:bs, label:'HP', color:'rgba(192,57,43,0.2)'},
        {id:'lk', x:w-bs*2-gap*2, y:bottomY, w:bs, h:bs, label:'LK', color:'rgba(230,126,34,0.2)'},
        {id:'hk', x:w-bs-gap, y:bottomY, w:bs, h:bs, label:'HK', color:'rgba(211,84,0,0.2)'},
        {id:'sp', x:w-bs*2-gap*2, y:bottomY-bs-gap, w:bs, h:bs, label:'⚡SP', color:'rgba(155,89,182,0.25)'},
        {id:'ult', x:w-bs-gap, y:bottomY-bs-gap, w:bs, h:bs, label:'💥ULT', color:'rgba(243,156,18,0.25)'},
      ];
    }

    function getButton(x,y){ return buttons.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h); }

    function performAttack(attacker, defender, moveKey) {
      if(!attacker || attacker.stun>0 || attacker.attackPhase!==0 || attacker.atkCD>0 || paused) return;
      let move = attacker.data.moves[moveKey];
      if(!move) return;
      if(move.cost && attacker.meter < move.cost) return;
      
      attacker.atkCD = move.speed;
      attacker.state = 'attack';
      attacker.attackPhase = 1;
      attacker.attackPhaseTimer = 6;
      if(move.cost) attacker.meter -= move.cost;
      
      let dist = Math.abs(attacker.x - defender.x);
      if(dist < move.range + 30) {
        let hitResult = defender.hit(move.dmg, move.kb||3, move.effect, move.height);
        if(hitResult) { comboCount++; comboTimer = 45; if(comboCount>=5) shakeTimer = 5; }
      }
      
      if(moveKey==='sp' && !attacker.projectile){
        attacker.projectile = { x: attacker.x+35, y: attacker.y+40, vx: attacker.dir*7, dmg: move.dmg, effect: move.effect, height: move.height };
      }
      sfx(move.cost?350:120, 'square', 0.12, 0.1);
      if(moveKey==='ult'){ sfx(40,'sawtooth',0.5,0.2); shakeTimer=25; }
    }

    function doAction(id){
      if(!p1||p1.stun>0||winner||paused) return;
      switch(id){
        case 'left': p1.vx=-5; p1.dir=-1; p1.state='walk'; break;
        case 'right': p1.vx=5; p1.dir=1; p1.state='walk'; break;
        case 'jump': p1.jump(); break;
        case 'crouch': p1.crouch(); break;
        case 'block': p1.blocking=true; p1.vx=0; break;
        case 'lp': performAttack(p1,p2,'lp'); break;
        case 'hp': performAttack(p1,p2,'hp'); break;
        case 'lk': performAttack(p1,p2,'lk'); break;
        case 'hk': performAttack(p1,p2,'hk'); break;
        case 'sp': performAttack(p1,p2,'sp'); break;
        case 'ult': if(p1.meter>=p1.data.moves.ult.cost) performAttack(p1,p2,'ult'); break;
      }
    }

    function aiThink(){
      if(!p2||p2.stun>0||winner||paused) return;
      if(p2.aiCooldown > 0) return;
      let dx = p1.x - p2.x, dist = Math.abs(dx);
      p2.dir = dx>0 ? 1 : -1; p2.vx = 0; p2.blocking = false;
      let actionDelay = difficulty==='Easy' ? 50 : difficulty==='Hard' ? 20 : 32;
      if(frame % actionDelay !== 0) return;
      let r = Math.random();
      if(p1.attackPhase === 2 && dist < 150 && r < 0.5) { p2.blocking = true; p2.aiCooldown = 25; return; }
      if(dist < 90) {
        if(r < 0.3) performAttack(p2, p1, 'lp');
        else if(r < 0.5) performAttack(p2, p1, 'lk');
        else if(r < 0.6) performAttack(p2, p1, 'hp');
        else if(r < 0.7 && p2.meter >= 20) performAttack(p2, p1, 'sp');
        else if(r < 0.8) { p2.blocking = true; }
        else { p2.vx = p2.dir * 3; }
      } else if(dist < 200) {
        if(r < 0.35) { p2.vx = p2.dir * 4; }
        else if(r < 0.55) performAttack(p2, p1, 'hp');
        else if(r < 0.7 && p2.meter >= 90) performAttack(p2, p1, 'ult');
        else if(r < 0.85) p2.jump();
        else p2.blocking = true;
      } else {
        p2.vx = p2.dir * 5;
        if(r < 0.35) p2.jump();
        if(r < 0.55 && p2.meter >= 20) performAttack(p2, p1, 'sp');
      }
      p2.aiCooldown = difficulty==='Easy' ? 45 : difficulty==='Hard' ? 15 : 25;
    }

    function drawStage(){
      let grad=ctx.createLinearGradient(0,0,0,canvas.height); grad.addColorStop(0,currentStage.sky); grad.addColorStop(0.8,currentStage.ground);
      ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle=currentStage.ground; ctx.fillRect(0,canvas.height-100,canvas.width,100);
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,canvas.height-100); ctx.lineTo(canvas.width,canvas.height-100); ctx.stroke();
    }
    function drawUI(){
      if(!p1||!p2) return;
      let bw=Math.min(280,canvas.width*0.3), bh=20, y=10;
      // P1 HP
      ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(8,y-2,bw+4,bh+4);
      let hp1w=bw*(p1.hp/p1.maxHp); ctx.fillStyle=p1.hp/p1.maxHp>0.5?'#2ecc71':'#e74c3c'; ctx.fillRect(10,y,hp1w,bh);
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(10,y,bw,bh);
      ctx.fillStyle='#fff'; ctx.font='bold 13px Arial'; ctx.fillText(p1.data.name,10,y-5);
      ctx.font='10px Arial'; ctx.fillText('METER:'+Math.floor(p1.meter),10,y+bh+14);
      // P2 HP
      let px=canvas.width-bw-10;
      ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(px-2,y-2,bw+4,bh+4);
      let hp2w=bw*(p2.hp/p2.maxHp); ctx.fillStyle=p2.hp/p2.maxHp>0.5?'#2ecc71':'#e74c3c'; ctx.fillRect(px+bw-hp2w,y,hp2w,bh);
      ctx.strokeRect(px,y,bw,bh);
      ctx.fillStyle='#fff'; ctx.font='bold 13px Arial'; ctx.textAlign='right'; ctx.fillText(p2.data.name,canvas.width-10,y-5);
      ctx.textAlign='left'; ctx.font='10px Arial'; ctx.textAlign='right'; ctx.fillText('METER:'+Math.floor(p2.meter),canvas.width-10,y+bh+14); ctx.textAlign='left';
      // Combo
      if(comboCount>1&&comboTimer>0){ ctx.fillStyle='#ff0'; ctx.font='bold 22px Arial'; ctx.textAlign='center'; ctx.fillText(comboCount+' HIT!',canvas.width/2,y+40); ctx.textAlign='left'; }
      // Pause hint
      ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='10px Arial'; ctx.textAlign='center'; ctx.fillText('DOUBLE TAP TOP TO PAUSE',canvas.width/2,canvas.height-8); ctx.textAlign='left';
    }
    function drawButtons(){
      buttons.forEach(b=>{
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.floor(b.h*0.38)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.label, b.x+b.w/2, b.y+b.h/2);
      });
      ctx.textBaseline = 'alphabetic';
    }
    function drawPauseMenu(){
      ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 40px Arial'; ctx.textAlign='center'; ctx.fillText('PAUSED',canvas.width/2,canvas.height*0.3);
      let items = ['▶ RESUME', '🏠 QUIT TO MENU'];
      items.forEach((item,i)=>{
        let iy = canvas.height*0.5 + i*75;
        if(pauseMenuOption===i){ ctx.fillStyle='rgba(233,69,96,0.5)'; ctx.fillRect(canvas.width/2-130,iy-28,260,56); ctx.strokeStyle='#e94560'; ctx.lineWidth=3; ctx.strokeRect(canvas.width/2-130,iy-28,260,56); }
        ctx.fillStyle = pauseMenuOption===i ? '#e94560' : '#ccc';
        ctx.font = 'bold 28px Arial';
        ctx.fillText(item, canvas.width/2, iy+8);
      });
      ctx.textAlign='left';
    }
    function drawMenu(){
      ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 38px Arial'; ctx.textAlign='center'; ctx.fillText('ARCADE COMBAT',canvas.width/2,canvas.height*0.25);
      let items=['⚔️ FIGHT','👥 SELECT','⚙️ DIFFICULTY: '+difficulty];
      items.forEach((item,i)=>{ let iy=canvas.height*0.45+i*70; ctx.fillStyle=menuOption===i?'#e94560':'#ccc'; ctx.font='bold 26px Arial'; ctx.fillText(item,canvas.width/2,iy); });
    }
    function drawSelect(){
      ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 22px Arial'; ctx.textAlign='center'; ctx.fillText('SELECT FIGHTERS',canvas.width/2,30);
      let cols=3, cw=Math.min(130,(canvas.width-50)/cols), ch=cw*1.3, gap=15, totalW=cw*cols+gap*(cols-1), sx=(canvas.width-totalW)/2, sy=55;
      FIGHTERS.forEach((f,i)=>{ let x=sx+i*(cw+gap); ctx.fillStyle='#1a1a2e'; ctx.fillRect(x,sy,cw,ch); ctx.fillStyle=f.color; ctx.fillRect(x+3,sy+3,cw-6,ch-30); ctx.fillStyle='#fff'; ctx.font='bold 12px Arial'; ctx.fillText(f.name,x+cw/2,sy+ch-12); if(i===selP1){ ctx.strokeStyle='#ff0'; ctx.lineWidth=4; ctx.strokeRect(x-3,sy-3,cw+6,ch+6); } if(i===selP2){ ctx.strokeStyle='#3498db'; ctx.lineWidth=4; ctx.strokeRect(x-3,sy-3,cw+6,ch+6); } });
      ctx.fillStyle='#e74c3c'; ctx.fillRect(canvas.width/2-60,sy+ch+25,120,40); ctx.fillStyle='#fff'; ctx.font='bold 18px Arial'; ctx.fillText('READY!',canvas.width/2,sy+ch+50);
    }

    function update(){
      if(gameState===STATE.FIGHT && !winner && !paused){
        if(shakeTimer>0) shakeTimer--;
        if(comboTimer>0){ comboTimer--; if(comboTimer<=0) comboCount=0; }
        p1?.update(); p2?.update(); aiThink();
        [p1,p2].forEach(f=>{ if(f&&f.projectile){ let proj=f.projectile; let enemy = f===p1?p2:p1; if(enemy && Math.abs(proj.x-enemy.x-35)<45 && Math.abs(proj.y-enemy.y-45)<55){ enemy.hit(proj.dmg,3,proj.effect, proj.height); f.projectile=null; } } });
        particles=particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--; return p.life>0; });
        hitEffects=hitEffects.filter(e=>{ e.life--; if(e.vy)e.y+=e.vy; return e.life>0; });
        if(p1&&p1.hp<=0){ winner='CPU WINS!'; winTimer=150; }
        if(p2&&p2.hp<=0){ winner='YOU WIN!'; winTimer=150; }
      }
      if(winner&&winTimer>0){ winTimer--; if(winTimer<=0){ gameState=STATE.MENU; p1=null; p2=null; winner=null; } }
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if(gameState===STATE.MENU) drawMenu();
      else if(gameState===STATE.SELECT) drawSelect();
      else if(gameState===STATE.FIGHT){
        drawStage(); 
        if(p2) p2.draw(ctx); if(p1) p1.draw(ctx);
        [p1,p2].forEach(f=>{ if(f&&f.projectile){ let p=f.projectile; ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.fill(); } });
        particles.forEach(p=>{ ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2); ctx.fill(); });
        hitEffects.forEach(e=>{ ctx.fillStyle=e.color; ctx.globalAlpha=e.life/35; ctx.font='bold 18px Arial'; ctx.textAlign='center'; ctx.fillText(e.text,e.x,e.y); });
        ctx.globalAlpha=1; drawUI(); drawButtons();
        if(winner){ ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle=winner==='YOU WIN!'?'#2ecc71':'#e74c3c'; ctx.font='bold 45px Arial'; ctx.textAlign='center'; ctx.fillText(winner,canvas.width/2,canvas.height/2); }
        if(paused) drawPauseMenu();
      }
    }
    function loop(){ frame++; update(); draw(); requestAnimationFrame(loop); }

    function handleTap(x,y){
      initAudio();
      if(gameState===STATE.FIGHT && paused){
        let iy1=canvas.height*0.5, iy2=canvas.height*0.5+75;
        if(y>=iy1-28&&y<=iy1+28){ paused=false; }
        else if(y>=iy2-28&&y<=iy2+28){ paused=false; gameState=STATE.MENU; p1=null; p2=null; winner=null; }
        return;
      }
      if(gameState===STATE.MENU){
        let iy1=canvas.height*0.45, iy2=canvas.height*0.45+70, iy3=canvas.height*0.45+140;
        if(y>=iy1-28&&y<=iy1+28){ menuOption=0; currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); createButtons(); gameState=STATE.FIGHT; }
        else if(y>=iy2-28&&y<=iy2+28){ menuOption=1; gameState=STATE.SELECT; }
        else if(y>=iy3-28&&y<=iy3+28){ difficulty = difficulty==='Easy'?'Normal':difficulty==='Normal'?'Hard':'Easy'; }
      } else if(gameState===STATE.SELECT){
        let cols=3, cw=Math.min(130,(canvas.width-50)/cols), ch=cw*1.3, gap=15, totalW=cw*cols+gap*(cols-1), sx=(canvas.width-totalW)/2, sy=55;
        if(x>=canvas.width/2-60&&x<=canvas.width/2+60&&y>=sy+ch+25&&y<=sy+ch+65){ currentStage=STAGES[Math.floor(Math.random()*STAGES.length)]; createPlayers(); createButtons(); gameState=STATE.FIGHT; return; }
        FIGHTERS.forEach((f,i)=>{ let fx=sx+i*(cw+gap); if(x>=fx&&x<=fx+cw&&y>=sy&&y<=sy+ch){ if(x<canvas.width/2) selP1=i; else selP2=i; } });
      }
    }

    canvas.addEventListener('touchstart', e=>{
      e.preventDefault();
      let t = e.touches[0];
      if(gameState===STATE.FIGHT && !winner){
        if(paused){ handleTap(t.clientX, t.clientY); return; }
        // Double-tap detection untuk pause (area atas: y < 25% layar)
        if(t.clientY < canvas.height*0.25){
          let now = Date.now();
          if(now - lastTapTime < 350) { paused = true; pauseMenuOption = 0; lastTapTime = 0; return; }
          lastTapTime = now;
          return;
        }
        lastTapTime = 0;
        let btn = getButton(t.clientX, t.clientY);
        if(btn) doAction(btn.id);
      } else handleTap(t.clientX, t.clientY);
    }, {passive:false});
    canvas.addEventListener('touchmove', e=>{
      e.preventDefault();
      if(gameState===STATE.FIGHT && !winner && !paused){
        let t = e.touches[0];
        let btn = getButton(t.clientX, t.clientY);
        if(btn && ['left','right','block'].includes(btn.id)) doAction(btn.id);
      }
    }, {passive:false});
    canvas.addEventListener('touchend', e=>{ 
      e.preventDefault(); 
      if(gameState===STATE.FIGHT&&p1&&!paused){ p1.vx=0; p1.blocking=false; p1.stand(); } 
    });
    canvas.addEventListener('click', e=>{ if(gameState!==STATE.FIGHT) handleTap(e.clientX,e.clientY); });

    resizeCanvas(); loop();
  })();
</script>
</body>
</html>
